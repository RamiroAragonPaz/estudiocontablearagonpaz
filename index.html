// ── IMPORTAR VENCIMIENTOS ────────────────────────────
function ImportarVencimientos({ vencimientos, setVencimientos, clients, onClose }) {
  const [tab, setTab]           = useState('ics');
  const [csvText, setCsvText]   = useState('');
  const [icsText, setIcsText]   = useState('');
  const [manualRows, setManualRows] = useState([
    {nombre:'',tipo:'fiscal',fecha:'',clientes:'',prioridad:'media'}
  ]);
  const [saving, setSaving]     = useState(false);
  const [imported, setImported] = useState(0);
  const [preview, setPreview]   = useState([]);
  const [icsPreview, setIcsPreview] = useState([]);

  const addRow = () => setManualRows(r=>[...r,{nombre:'',tipo:'fiscal',fecha:'',clientes:'',prioridad:'media'}]);
  const upRow  = (i,k,v) => setManualRows(r=>r.map((x,j)=>j===i?{...x,[k]:v}:x));
  const delRow = (i) => setManualRows(r=>r.filter((_,j)=>j!==i));

  // ── Parse standard CSV ───────────────────────────────
  const parseCSV = (text) => {
    const lines = text.trim().split('\n').filter(l=>l.trim());
    const isHeader = lines[0] && lines[0].toLowerCase().includes('nombre');
    return lines.slice(isHeader?1:0).map(l=>{
      const parts = l.split(',').map(p=>p.trim().replace(/^"|"$/g,''));
      return { nombre:parts[0]||'', tipo:parts[1]||'fiscal', fecha:parts[2]||'', clientes:parts[3]||'', prioridad:parts[4]||'media' };
    }).filter(r=>r.nombre&&r.fecha);
  };

  // ── Parse ICS / iCalendar — RFC 5545 compliant ──────
  const parseICS = (text) => {
    // 1. Normalize line endings and unfold continuation lines (RFC 5545 §3.1)
    const unfolded = text
      .replace(/\r\n/g, '\n')
      .replace(/\r/g, '\n')
      .replace(/\n[ \t]/g, ''); // unfold: CRLF + SPACE/TAB = continuation

    const events = [];
    const blocks = unfolded.split('BEGIN:VEVENT');

    blocks.slice(1).forEach(block => {
      // Cut at END:VEVENT to avoid bleed into next event
      const eventBlock = block.split('END:VEVENT')[0];

      // Extract a property value — handles param syntax like DTSTART;TZID=...:value
      const getVal = (key) => {
        const rx = new RegExp('^' + key + '(?:;[^:]*)?:(.+)$', 'm');
        const m = eventBlock.match(rx);
        return m ? m[1].trim() : '';
      };

      const summary  = getVal('SUMMARY');
      const dtstart  = getVal('DTSTART');
      const desc     = getVal('DESCRIPTION').replace(/\\n/g,' ').replace(/\\,/g,',');
      const location = getVal('LOCATION');

      if (!summary || !dtstart) return;

      // Parse date: handles 20260318, 20260318T000000, 20260318T000000Z
      let raw = dtstart.replace(/Z$/, '').split('T')[0].replace(/-/g,'');
      let dateStr = '';
      if (raw.length === 8) {
        dateStr = raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);
      } else {
        return; // unparseable date, skip
      }

      // Classify tipo
      const lowSum = (summary + ' ' + desc).toLowerCase();
      const tipo =
        /sueldo|f\.?931|\bsuss\b|cargas sociales|\bart\b|laboral/.test(lowSum) ? 'laboral' :
        /societ|balance|igj|dppj/.test(lowSum) ? 'societario' :
        'fiscal';

      // Classify prioridad
      const prioridad =
        /\biva\b|ganancias|bienes personales|\barca\b|\bafip\b|suss|f\.?931/.test(lowSum)
        ? 'alta' : 'media';

      // Organismo hint for notas
      const org =
        /\barba\b/.test(lowSum) ? 'ARBA' :
        /\barca\b|\bafip\b/.test(lowSum) ? 'ARCA' :
        /\bart\b/.test(lowSum) ? 'ART' : '';

      const notas = [desc, location, org].filter(Boolean).join(' · ').slice(0, 200);

      events.push({ nombre: summary, tipo, fecha: dateStr, clientes: '', prioridad, notas });
    });

    return events;
  };

  // ── Smart CUIT client matching ───────────────────────
  const smartMatchClients = (_row) => {
    // El matching de clientes ocurre en tiempo real al mostrar vencimientos
    // via getClientesDelVenc/getClientesDelGrupo — no durante la importación
    return [];
  };

  // Build smart preview from CSV
  const buildSmartPreview = (text) => {
    const rows = parseCSV(text);
    const expanded = [];
    rows.forEach(row => {
      const matched = smartMatchClients(row);
      if (!matched.length) {
        expanded.push({...row, _display: row.clientes||'General', _matched:[]});
      } else {
        matched.forEach(c => expanded.push({...row, clientes:c.nombre, clienteId:c.id, _display:c.nombre, _matched:[c.nombre]}));
      }
    });
    return expanded;
  };

  // ── Handle file drop / input ─────────────────────────
  const handleICSFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result;
      setIcsText(text);
      const parsed = parseICS(text);
      setIcsPreview(parsed);
    };
    reader.readAsText(file, 'UTF-8');
  };

  React.useEffect(() => {
    if (tab === 'smart' && csvText) setPreview(buildSmartPreview(csvText));
  }, [csvText, tab]);

  // ── Import rows into Firestore + state ───────────────
  const handleImport = async (rows) => {
    const valid = rows.filter(r=>r.nombre&&r.fecha);
    if (!valid.length) {
      Swal.fire({ icon:'warning', title:'Sin datos', text:'No hay filas válidas para importar.', customClass:{popup:'swal-ap'} });
      return;
    }
    setSaving(true);
    let count = 0;
    const newVenc = [];
    for (const r of valid) {
      const { _display, _matched, ...v } = r;
      const rec = {...v, completado:false};
      try {
        const fb = FB();
        const ref = await fb.addDoc(fb.collection(fb.db,'vencimientos'), {...rec, createdAt:fb.serverTimestamp()});
        newVenc.push({...rec, id:ref.id}); count++;
      } catch(e) {
        newVenc.push({...rec, id:'local-'+Date.now()+count}); count++;
      }
    }
    setVencimientos(prev=>[...prev,...newVenc]);
    setSaving(false);
    setImported(count);
    setCsvText(''); setPreview([]); setIcsText(''); setIcsPreview([]);
    if (tab==='manual') setManualRows([{nombre:'',tipo:'fiscal',fecha:'',clientes:'',prioridad:'media'}]);
    Swal.fire({ icon:'success', title:`${count} vencimiento${count!==1?'s':''} importado${count!==1?'s':''}`, timer:2000, showConfirmButton:false, customClass:{popup:'swal-ap'} });
    onClose();
  };

  const TIPO_BADGE = { fiscal:'badge-gold', laboral:'badge-blue', societario:'badge-gray' };

  return (
    <Modal title="📥 Importar Vencimientos" onClose={onClose} wide
      footer={<>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>
        {tab!=='info' && (
          <button className="btn btn-gold" disabled={saving}
            onClick={()=>handleImport(
              tab==='ics'    ? icsPreview  :
              tab==='smart'  ? preview     :
              tab==='csv'    ? parseCSV(csvText) :
              manualRows
            )}>
            {saving ? '⏳ Importando...' : `📥 Importar${tab==='ics'&&icsPreview.length?' ('+icsPreview.length+')':tab==='smart'&&preview.length?' ('+preview.length+')':''}`}
          </button>
        )}
      </>}>

      <div style={{display:'flex',gap:4,background:'var(--cream2)',padding:4,borderRadius:10,marginBottom:20,width:'fit-content',flexWrap:'wrap'}}>
        {[['ics','📅 Archivo .ics'],['smart','🧠 Smart CSV'],['manual','✏️ Manual'],['csv','📄 CSV simple'],['info','ℹ️ Ayuda']].map(([t,l])=>(
          <button key={t} className={`tab ${tab===t?'active':''}`} style={{minWidth:110,fontSize:12}} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {/* ── ICS TAB ── */}
      {tab==='ics' && (
        <div>
          <div style={{padding:'10px 14px',background:'var(--blue2)',borderRadius:8,marginBottom:14,fontSize:12,color:'#1e40af',lineHeight:1.7}}>
            <strong>📅 Importar desde Google Calendar / Apple Calendar</strong><br/>
            Exportá tu calendario de vencimientos como <strong>.ics</strong> y subilos acá. El sistema detecta automáticamente fechas, tipos y prioridades.
          </div>
          <div
            onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--gold)';}}
            onDragLeave={e=>{e.currentTarget.style.borderColor='var(--border)';}}
            onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--border)';handleICSFile(e.dataTransfer.files[0]);}}
            style={{border:'2px dashed var(--border)',borderRadius:12,padding:'32px 20px',textAlign:'center',cursor:'pointer',transition:'border-color 0.2s',marginBottom:16}}
            onClick={()=>document.getElementById('ics-file-input').click()}>
            <div style={{fontSize:36,marginBottom:8}}>📅</div>
            <div style={{fontWeight:600,color:'var(--black)',marginBottom:4}}>Arrastrá tu archivo .ics aquí</div>
            <div style={{fontSize:12,color:'var(--gray)'}}>o hacé clic para seleccionar</div>
            <input id="ics-file-input" type="file" accept=".ics,.ical" style={{display:'none'}}
              onChange={e=>handleICSFile(e.target.files[0])} />
          </div>
          {icsPreview.length > 0 && (
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:600,color:'var(--black)'}}>
                  Vista previa — {icsPreview.length} evento{icsPreview.length!==1?'s':''}
                </div>
                <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>{setIcsPreview([]);setIcsText('');}}>✕ Limpiar</button>
              </div>
              <div style={{maxHeight:280,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8}}>
                <table style={{width:'100%',fontSize:11,borderCollapse:'collapse'}}>
                  <thead style={{background:'var(--cream2)',position:'sticky',top:0}}>
                    <tr>
                      {['Evento','Fecha','Tipo','Prioridad'].map(h=>(
                        <th key={h} style={{padding:'7px 10px',textAlign:'left',fontWeight:600,fontSize:11}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {icsPreview.map((r,i)=>(

// ── GESTOR DE TRIBUTOS MODAL ─────────────────────────
// ── CATÁLOGO DE TRIBUTOS (módulo standalone) ─────────
function CatalogoTributos({ tributosCatalogo, setTributosCatalogo }) {
  const [modal, setModal]   = useState(false);
  const [form, setForm]     = useState({ label:'', categoria:'Nacional', organismo:'ARCA', periodicidad:'mensual', dia:'',id:'' });
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const CAT_ICON = { Nacional:'🏛️', Provincial:'🏠', Municipal:'🏙️', Laboral:'👷', Societario:'📂', Otro:'📋' };

  const filtered = tributosCatalogo.filter(t =>
    (t.label||'').toLowerCase().includes(search.toLowerCase()) ||
    (t.categoria||'').toLowerCase().includes(search.toLowerCase()) ||
    (t.organismo||'').toLowerCase().includes(search.toLowerCase())
  );

  const openEdit = (t) => {
    setEditId(t.id);
    setForm({ label:t.label, categoria:t.categoria, organismo:t.organismo, periodicidad:t.periodicidad, dia:t.dia||'' });
    setModal(true);
  };
  const openNew = () => {
    setEditId(null);
    setForm({ label:'', categoria:'Nacional', organismo:'ARCA', periodicidad:'mensual', dia:'', id:'' });
    setModal(true);
  };

  const handleSave = async () => {
    if (!form.label.trim()) return;
    setSaving(true);
    const payload = { label:form.label.trim(), categoria:form.categoria, organismo:form.organismo, periodicidad:form.periodicidad, dia:Number(form.dia), id:form.id||null };
    try {
      const fb = FB();
      if (editId) {
        await fb.updateDoc(fb.doc(fb.db,'tributos',editId), payload);
        setTributosCatalogo(prev => prev.map(t => t.id===editId ? {...payload,id:editId} : t));
      } else {
        const ref = await fb.addDoc(fb.collection(fb.db,'tributos'), {...payload, createdAt:fb.serverTimestamp()});
        setTributosCatalogo(prev => [...prev, {...payload, id:ref.id}]);
      }
    } catch(e) {
      if (editId) setTributosCatalogo(prev => prev.map(t => t.id===editId ? {...payload,id:editId} : t));
      else setTributosCatalogo(prev => [...prev, {...payload, id:'local-'+Date.now()}]);
    }
    setSaving(false); setModal(false); setEditId(null);
  };

  const handleDelete = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar este tributo del catálogo', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'tributos',id)); } catch(e) {}
    setTributosCatalogo(prev => prev.filter(t => t.id !== id));
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Catálogo de Tributos</div>
          <div className="page-subtitle">{tributosCatalogo.length} tributos · base para asignar a clientes y generar vencimientos</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
            tributosCatalogo.map(t=>({'Tributo':t.label,'Categoría':t.categoria,'Organismo':t.organismo,'Periodicidad':t.periodicidad,'Día':t.dia||''})),
            'Catalogo_Tributos'
          )}>📥 Excel</button>
          <button className="btn btn-gold" onClick={openNew}>+ Nuevo Tributo</button>
        </div>
      </div>

      <div className="search-wrap" style={{marginBottom:24}}>
        <span className="search-icon">🔍</span>
        <input className="search-input" placeholder="Buscar por nombre, categoría u organismo..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>

      {TRIBUTO_CATEGORIAS.map(cat => {
        const items = filtered.filter(t=>(t.categoria||'Otro')===cat);
        if (!items.length) return null;
        return (
          <div key={cat} style={{marginBottom:28}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1.5px',
              fontFamily:'JetBrains Mono,monospace',marginBottom:10,display:'flex',alignItems:'center',gap:8,
              paddingBottom:8,borderBottom:'1px solid rgba(201,169,110,0.15)'}}>
              <span>{CAT_ICON[cat]||'📋'}</span>{cat}
              <span style={{fontWeight:400,color:'var(--gray2)',letterSpacing:0}}>· {items.length} tributo{items.length!==1?'s':''}</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:10}}>
              {items.map(t=>(
                <div key={t.id} className="card" style={{padding:'14px 16px',marginBottom:0,display:'flex',alignItems:'center',gap:12}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,color:'var(--black)'}}>{t.label}</div>
                    <div style={{fontSize:11,color:'var(--gray)',marginTop:3,fontFamily:'JetBrains Mono,monospace',display:'flex',gap:8,flexWrap:'wrap'}}>
                      <span className="badge badge-blue" style={{fontSize:9}}>{t.organismo}</span>
                      <span className="badge badge-gray" style={{fontSize:9}}>{t.periodicidad}</span>
                      {t.dia && <span className="badge badge-amber" style={{fontSize:9}}>día {t.dia}</span>}
                    </div>
                  </div>
                  <div className="action-btns">
                    <button className="btn-icon edit" title="Editar" onClick={()=>openEdit(t)}>✏️</button>
                    <button className="btn-icon trash" title="Eliminar" onClick={()=>handleDelete(t.id)}>🗑️</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {filtered.length===0 && <div className="empty-state"><div className="empty-icon">📊</div><p>No hay tributos en el catálogo</p></div>}

      {modal && (
        <Modal title={editId ? '✏️ Editar Tributo' : '➕ Nuevo Tributo'} onClose={()=>{setModal(false);setEditId(null);}}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setModal(false);setEditId(null);}}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={handleSave} disabled={saving||!form.label.trim()}>
              {saving?'Guardando...':editId?'Guardar Cambios':'Crear Tributo'}
            </button>
          </>}>
          <div className="form-group">
            <label className="form-label">Nombre del Tributo *</label>
            <input className="form-input" value={form.label} onChange={e=>setForm(f=>({...f,label:e.target.value}))}
              placeholder="Ej: IVA Mensual, IIBB La Plata..." autoFocus />
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Categoría</label>
              <select className="form-select" value={form.categoria} onChange={e=>setForm(f=>({...f,categoria:e.target.value}))}>
                {TRIBUTO_CATEGORIAS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Organismo</label>
              <select className="form-select" value={form.organismo} onChange={e=>setForm(f=>({...f,organismo:e.target.value}))}>
                {TRIBUTO_ORGANISMOS.map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Periodicidad</label>
              <select className="form-select" value={form.periodicidad} onChange={e=>setForm(f=>({...f,periodicidad:e.target.value}))}>
                {TRIBUTO_PERIODICIDADES.map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Día de vencimiento <span style={{color:'var(--gray2)',fontWeight:400}}>(opcional)</span></label>
              <input className="form-input" type="number" min="1" max="31" value={form.dia}
                onChange={e=>setForm(f=>({...f,dia:e.target.value}))} placeholder="Ej: 20" />
            </div>
            <div className="form-group">
              <label className="form-label">ID <span style={{color:'var(--gray2)',fontWeight:400}}>(opcional)</span></label>
              <input className="form-input" type="text" value={form.id}
                onChange={e=>setForm(f=>({...f,id:e.target.value}))} placeholder="Ej: siradig" />
            </div>
          </div>
          <div style={{padding:'10px 14px',background:'var(--blue2)',borderRadius:8,fontSize:12,color:'#1e40af',marginTop:4}}>
            💡 El día se usa para generar automáticamente vencimientos al asignar este tributo a un cliente.
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────
function App() {
  const [user, setUser]             = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [section, setSection]       = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  const [clients, setClients]             = useState([]);
  const [vencimientos, setVencimientos]   = useState([]);
  const [tributosCatalogo, setTributosCatalogo] = useState(TRIBUTOS_SEED);
  const [cobros, setCobros]               = useState([]);
  const [facturas, setFacturas]           = useState([]);
  const [tareas, setTareas]               = useState([]);
  const [notas, setNotas]                 = useState([]);

  // Auth listener
  useEffect(() => {
    const fb = FB();
    if (!fb?.auth) { setAuthLoading(false); return; }
    const unsub = fb.onAuthStateChanged(fb.auth, (u) => { setUser(u); setAuthLoading(false); });
    return unsub;
  }, []);

  // Load Firestore data
  useEffect(() => {
    if (!user) return;
    const fb = FB();
    if (!fb?.db) return;

    // clients
    fb.getDocs(fb.collection(fb.db,'clients')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setClients(data);
      }
    }).catch(()=>{});

    // vencimientos
    fb.getDocs(fb.collection(fb.db,'vencimientos')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setVencimientos(data);
      }
    }).catch(()=>{});

    // tributos catalog — seed if empty
    fb.getDocs(fb.collection(fb.db,'tributos')).then(snap => {
      if (snap.empty) {
        // Seed the collection from TRIBUTOS_SEED
        Promise.all(TRIBUTOS_SEED.map(t => fb.addDoc(fb.collection(fb.db,'tributos'), {...t, createdAt:fb.serverTimestamp()})
          .then(ref => ({...t, id:ref.id}))
          .catch(() => t)
        )).then(seeded => setTributosCatalogo(seeded));
      } else {
        setTributosCatalogo(snap.docs.map(d=>({id:d.id,...d.data()})));
      }
    }).catch(()=>{});

    // tareas
    fb.getDocs(fb.collection(fb.db,'tareas')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setTareas(data);
      }
    }).catch(()=>{});

    // notas
    fb.getDocs(fb.collection(fb.db,'notas')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setNotas(data);
      }
    }).catch(()=>{});
    // cobros
    fb.getDocs(fb.collection(fb.db,'cobros')).then(snap => {
      if (!snap.empty) setCobros(snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)));
    }).catch(()=>{});
    // facturas
    fb.getDocs(fb.collection(fb.db,'facturas')).then(snap => {
      if (!snap.empty) {
        const data=snap.docs.map(d=>({id:d.id,...d.data()}));
        setFacturas(data);
      }
    }).catch(()=>{});
    // auto-generate monthly charges on first of month
    const todayD=new Date();
    const monthKey=`charges-${todayD.getFullYear()}-${todayD.getMonth()}`;
    if (todayD.getDate()>=1 && !localStorage.getItem(monthKey)) {
      // will run after clients load — use a small delay
      setTimeout(()=>{
        setClients(current => {
          const active=current.filter(c=>c.estado==='activo'&&c.honorario>0);
          const mesLabel=`${MONTHS_FULL[todayD.getMonth()]} ${todayD.getFullYear()}`;
          const newFacts=active.map(c=>({
            id:'auto-'+c.id+'-'+monthKey,
            clienteId:c.id, cliente:c.nombre,
            concepto:`${c.servicio||'Honorarios'} - ${mesLabel}`,
            monto:c.honorario, fecha:todayStr, estado:'pendiente'
          }));
          setFacturas(prev=>{
            const autoIds=newFacts.map(f=>f.id);
            const filtered=prev.filter(f=>!autoIds.includes(f.id));
            return [...filtered,...newFacts];
          });
          // Save to firebase
          const fb2=FB();
          newFacts.forEach(f=>{
            fb2?.addDoc(fb2.collection(fb2.db,'facturas'),{...f,autoGenerado:true,createdAt:fb2.serverTimestamp()}).catch(()=>{});
          });
          localStorage.setItem(monthKey,'done');
          return current;
        });
      },1500);
    }
  }, [user]);

  const handleLogout = async () => { try { await FB().signOut(FB().auth); } catch(e){} setUser(null); };

  if (authLoading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--black)'}}>
      <div><div className="spinner" style={{width:48,height:48,borderWidth:4,margin:'0 auto 20px'}} />
        <div style={{color:'var(--gold2)',fontFamily:'Playfair Display,serif',textAlign:'center'}}>Cargando...</div>
      </div>
    </div>
  );

  if (!user) return <LoginScreen onLogin={()=>{}} />;

  const NAV = [
    { id:'dashboard',    label:'Dashboard',    icon:'🏠' },
    { id:'clientes',     label:'Clientes',     icon:'👥' },
    { id:'vencimientos', label:'Vencimientos', icon:'📅', badge:vencimientos.filter(v=>!v.completado&&daysUntil(v.fecha)<=7).length||null },
    { id:'facturacion',  label:'Facturación',  icon:'💰' },
    { id:'cobros',       label:'Cobros',       icon:'🧾' },
    { id:'finanzas',     label:'Finanzas',     icon:'📊' },
    { id:'tareas',       label:'Tareas',       icon:'✅', badge:tareas.filter(t=>!t.completado).length||null, badgeClass:'amber' },
    { id:'notas',        label:'Notas',        icon:'📝' },
    { id:'catalogo',     label:'Tributos',     icon:'⚙️' },
  ];

  // Each section is ALWAYS mounted — only visibility changes.
  // This preserves internal state (search, filters, scroll) when switching sections.
  const S = (id) => ({ style: { display: section === id ? 'block' : 'none' } });

  return (
    <div className="app-layout">
      <aside className={`sidebar ${sidebarCollapsed?'collapsed':''}`}>
        {/* Toggle button */}
        <div className="sidebar-toggle" onClick={()=>setSidebarCollapsed(c=>!c)} title={sidebarCollapsed?'Expandir menú':'Colapsar menú'}>
          {sidebarCollapsed ? '›' : '‹'}
        </div>

        <div className="sidebar-header">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:38,height:38,borderRadius:10,background:'linear-gradient(135deg,var(--gold),var(--gold2))',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Playfair Display,serif',fontWeight:900,fontSize:16,color:'var(--black)',flexShrink:0}}>AP</div>
            {!sidebarCollapsed && (
              <div>
                <div className="sidebar-brand">Aragón Paz</div>
                <div className="sidebar-brand-sub">Estudio Contable</div>
              </div>
            )}
          </div>
        </div>

        <nav className="sidebar-nav">
          {!sidebarCollapsed && <div className="nav-section-label">Principal</div>}
          {NAV.map(item => (
            <div key={item.id} className={`nav-item ${section===item.id?'active':''}`}
              onClick={()=>setSection(item.id)} data-tooltip={item.label}>
              <span className="nav-icon">{item.icon}</span>
              {!sidebarCollapsed && <span className="nav-label">{item.label}</span>}
              {!sidebarCollapsed && item.badge>0 && <span className={`nav-badge ${item.badgeClass||''}`}>{item.badge}</span>}
            </div>
          ))}
        </nav>

        <div className="sidebar-user">
          <div className="user-avatar">
            {user.photoURL ? <img src={user.photoURL} alt={user.displayName} /> : initials(user.displayName||user.email)}
          </div>
          {!sidebarCollapsed && (
            <div className="user-info" style={{flex:1,minWidth:0}}>
              <div className="user-name">{user.displayName?.split(' ')[0]||'Usuario'}</div>
              <div className="user-role">Contador</div>
            </div>
          )}
          {!sidebarCollapsed && <button className="btn-logout" onClick={handleLogout} title="Cerrar sesión">⏻</button>}
        </div>
      </aside>

      <main className={`main ${sidebarCollapsed?'collapsed':''}`}>
        <div {...S('dashboard')}><Dashboard clients={clients} vencimientos={vencimientos} tareas={tareas} notas={notas} setSection={setSection} setTareas={setTareas} /></div>
        <div {...S('clientes')}><Clientes clients={clients} setClients={setClients} vencimientos={vencimientos} setVencimientos={setVencimientos} tributosCatalogo={tributosCatalogo} setTributosCatalogo={setTributosCatalogo} tareas={tareas} setTareas={setTareas} /></div>
        <div {...S('vencimientos')}><Vencimientos vencimientos={vencimientos} setVencimientos={setVencimientos} clients={clients} tareas={tareas} setTareas={setTareas} /></div>
        <div {...S('facturacion')}><Facturacion clients={clients} facturas={facturas} setFacturas={setFacturas} cobros={cobros} setCobros={setCobros} /></div>
        <div {...S('tareas')}><Tareas tareas={tareas} setTareas={setTareas} clients={clients} /></div>
        <div {...S('notas')}><Notas notas={notas} setNotas={setNotas} clients={clients} /></div>
        <div {...S('cobros')}><Cobros clients={clients} facturas={facturas} setFacturas={setFacturas} cobros={cobros} setCobros={setCobros} /></div>
        <div {...S('finanzas')}><Finanzas cobros={cobros} setCobros={setCobros} facturas={facturas} setFacturas={setFacturas} /></div>
        <div {...S('catalogo')}><CatalogoTributos tributosCatalogo={tributosCatalogo} setTributosCatalogo={setTributosCatalogo} /></div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

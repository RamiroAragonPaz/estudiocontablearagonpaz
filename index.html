  <!-- Si tenés un PNG 180×180 usá: <link rel="apple-touch-icon" sizes="180x180" href="logo180.png" /> -->
  <script>
    // Genera un PNG 180x180 en canvas y lo usa como apple-touch-icon dinámico
    // (funciona cuando no hay imagen externa disponible)
    (function() {
      try {
        var c = document.createElement('canvas');
        c.width = c.height = 180;
        var ctx = c.getContext('2d');
        // Fondo negro
        ctx.fillStyle = '#111110';
        ctx.fillRect(0,0,180,180);
        // Rounded rect dorado
        var r = 36;
        ctx.beginPath();
        ctx.moveTo(r,10); ctx.lineTo(170-r,10);
        ctx.quadraticCurveTo(170,10,170,r);
        ctx.lineTo(170,170-r); ctx.quadraticCurveTo(170,170,170-r,170);
        ctx.lineTo(r,170); ctx.quadraticCurveTo(10,170,10,170-r);
        ctx.lineTo(10,r); ctx.quadraticCurveTo(10,10,r,10);
        ctx.closePath();
        var grad = ctx.createLinearGradient(10,10,170,170);
        grad.addColorStop(0,'#c9a96e'); grad.addColorStop(1,'#e2c48a');
        ctx.fillStyle = grad;
        ctx.fill();
        // Texto AP
        ctx.fillStyle = '#111110';
        ctx.font = 'bold 72px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('AP', 90, 94);
        // Inyectar como link
        var link = document.createElement('link');
        link.rel = 'apple-touch-icon';
        link.href = c.toDataURL('image/png');
        document.head.appendChild(link);
      } catch(e) {}
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #111110;
      --black2:   #1c1c1a;
      --black3:   #2a2a28;
      --gold:     #c9a96e;
      --gold2:    #e2c48a;
      --gold3:    #f0ddb8;
      --cream:    #faf8f3;
      --cream2:   #f2ede3;
      --white:    #ffffff;
      --green:    #2d9a6b;
      --green2:   #d1f0e4;
      --red:      #c0392b;
      --red2:     #fde8e8;
      --amber:    #c97c1e;
      --amber2:   #fef3d8;
      --blue:     #2563eb;
      --blue2:    #dbeafe;
      --gray:     #6b6b66;
      --gray2:    #9b9b96;
      --border:   rgba(201,169,110,0.2);
      --shadow:   0 4px 24px rgba(17,17,16,0.08);
      --shadow2:  0 12px 48px rgba(17,17,16,0.14);
      --r:        12px;
      --r2:       8px;
      --sidebar:  260px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      color: var(--black);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── SCROLLBAR ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream2); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

    /* ── LOGIN SCREEN ─────────────────────────────── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      position: relative;
      overflow: hidden;
    }
    .login-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(201,169,110,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 80% 20%, rgba(201,169,110,0.05) 0%, transparent 70%);
    }
    .login-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(28,28,26,0.92);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 24px;
      padding: 64px 56px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201,169,110,0.15);
    }
    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 900;
      color: var(--black);
      box-shadow: 0 8px 24px rgba(201,169,110,0.3);
    }
    .login-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold2);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .login-sub {
      font-size: 14px;
      color: var(--gray2);
      margin-bottom: 40px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .btn-google {
      width: 100%;
      padding: 16px 24px;
      background: var(--white);
      border: none;
      border-radius: var(--r);
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--black);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .btn-google:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .btn-google svg { width: 20px; height: 20px; }
    .login-footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(155,155,150,0.6);
    }

    /* ── LAYOUT ────────────────────────────────────── */
    html, body { height: 100%; margin: 0; padding: 0; }
    #root { height: 100%; }
    .app-layout {
      display: flex;
      min-height: 100vh;
      background: var(--cream);
    }

    /* ── SIDEBAR ───────────────────────────────────── */
    .sidebar {
      width: var(--sidebar);
      background: var(--black);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(201,169,110,0.12);
      z-index: 200;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar-header {
      padding: 28px 20px 24px;
      border-bottom: 1px solid rgba(201,169,110,0.12);
    }
    .sidebar-brand {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold2);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .sidebar-brand-sub {
      font-size: 10px;
      color: var(--gray2);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
    }
    .nav-section-label {
      font-size: 10px;
      color: rgba(155,155,150,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 8px;
      margin: 16px 0 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: var(--r2);
      cursor: pointer;
      transition: all 0.18s;
      color: rgba(250,248,243,0.55);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
      border: 1px solid transparent;
      font-family: 'Montserrat', sans-serif;
    }
    .nav-item:hover { background: rgba(201,169,110,0.08); color: var(--gold3); }
    .nav-item.active {
      background: rgba(201,169,110,0.14);
      color: var(--gold2);
      border-color: rgba(201,169,110,0.2);
    }
    .nav-item .nav-icon { font-size: 16px; flex-shrink: 0; }
    .nav-badge {
      margin-left: auto;
      background: var(--red);
      color: white;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 700;
    }
    .nav-badge.amber { background: var(--amber); }
    .sidebar-user {
      padding: 16px 20px;
      border-top: 1px solid rgba(201,169,110,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--black);
      flex-shrink: 0;
      overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-size: 13px; color: var(--gold3); font-weight: 600; }
    .user-role { font-size: 11px; color: var(--gray2); }
    .btn-logout {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray2);
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s;
    }
    .btn-logout:hover { color: var(--red); }

    /* ── MAIN CONTENT ──────────────────────────────── */
    .main {
      margin-left: var(--sidebar);
      transition: margin-left 0.25s cubic-bezier(.4,0,.2,1);
      flex: 1;
      padding: 32px 36px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: margin-left 0.25s cubic-bezier(.4,0,.2,1);
    }
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .page-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.8px;
      line-height: 1;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--gray);
      margin-top: 6px;
    }
    .page-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--gray2);
      text-align: right;
    }

    /* ── CARDS ─────────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--r);
      border: 1px solid rgba(201,169,110,0.12);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title span { font-size: 18px; }

    /* ── STAT CARDS ────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--r);
      border: 1px solid rgba(201,169,110,0.12);
      padding: 20px 22px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      cursor: default;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow2); }
    .stat-label { font-size: 11px; color: var(--gray2); letter-spacing: 1.5px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 8px; }
    .stat-value { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 700; color: var(--black); letter-spacing: -0.5px; }
    .stat-value.gold { color: var(--gold); }
    .stat-delta { font-size: 12px; color: var(--gray); margin-top: 4px; }
    .stat-delta.up { color: var(--green); }
    .stat-delta.down { color: var(--red); }
    .stat-icon { font-size: 24px; margin-bottom: 10px; }

    /* ── GRID LAYOUTS ──────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-6040 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }

    /* ── TABLE ─────────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: var(--r2); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: var(--cream2); }
    th {
      padding: 12px 14px;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--cream2);
      font-weight: 500;
    }
    td { padding: 13px 14px; border-bottom: 1px solid var(--cream2); color: var(--black); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--cream); transition: background 0.15s; }

    /* ── BADGES ────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.3px;
    }
    .badge-green { background: var(--green2); color: #186344; }
    .badge-red { background: var(--red2); color: #991b1b; }
    .badge-amber { background: var(--amber2); color: #92400e; }
    .badge-blue { background: var(--blue2); color: #1e40af; }
    .badge-gray { background: var(--cream2); color: var(--gray); }
    .badge-gold { background: rgba(201,169,110,0.15); color: var(--amber); }

    /* ── BUTTONS ───────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border-radius: var(--r2);
      font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--black); color: var(--gold2);
      border: 1px solid rgba(201,169,110,0.2);
    }
    .btn-primary:hover { background: var(--black2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(17,17,16,0.2); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--black); font-weight: 700;
    }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,169,110,0.35); }
    .btn-ghost {
      background: transparent; color: var(--gray);
      border: 1px solid var(--cream2);
    }
    .btn-ghost:hover { background: var(--cream2); color: var(--black); }
    .btn-danger {
      background: var(--red2); color: var(--red);
      border: 1px solid rgba(192,57,43,0.15);
    }
    .btn-danger:hover { background: #fbd5d5; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-icon { padding: 8px; width: 34px; height: 34px; justify-content: center; }

    /* ── FORMS ─────────────────────────────────────── */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--gray); margin-bottom: 6px;
      letter-spacing: 0.5px; text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 14px;
      background: var(--cream);
      border: 1.5px solid rgba(201,169,110,0.2);
      border-radius: var(--r2);
      font-family: 'Montserrat', sans-serif; font-size: 14px;
      color: var(--black); transition: all 0.18s;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(201,169,110,0.12);
    }
    .form-textarea { resize: vertical; min-height: 90px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* ── MODAL ─────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(17,17,16,0.6);
      backdrop-filter: blur(4px);
      z-index: 200; display: flex;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--white);
      border-radius: 20px;
      border: 1px solid rgba(201,169,110,0.15);
      width: 100%; max-width: 640px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 24px 80px rgba(17,17,16,0.25);
    }
    .modal-header {
      padding: 24px 28px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px; font-weight: 700; color: var(--black);
    }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--cream2); border: none; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: var(--cream); }
    .modal-body { padding: 24px 28px 28px; }
    .modal-footer {
      padding: 0 28px 24px;
      display: flex; gap: 10px; justify-content: flex-end;
    }

    /* ── ALERTS ────────────────────────────────────── */
    .alert {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 16px; border-radius: var(--r2);
      font-size: 13px; margin-bottom: 12px;
    }
    .alert-red { background: var(--red2); color: #7f1d1d; border-left: 3px solid var(--red); }
    .alert-amber { background: var(--amber2); color: #78350f; border-left: 3px solid var(--amber); }
    .alert-green { background: var(--green2); color: #064e3b; border-left: 3px solid var(--green); }

    /* ── VENCIMIENTO ITEM ──────────────────────────── */
    .venc-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--cream2);
    }
    .venc-item:last-child { border-bottom: none; }
    .venc-date-box {
      width: 48px; height: 48px; border-radius: 10px;
      background: var(--cream2); display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .venc-date-box .day { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; line-height: 1; }
    .venc-date-box .month { font-size: 9px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; }
    .venc-date-box.urgent { background: var(--red2); }
    .venc-date-box.urgent .day { color: var(--red); }
    .venc-date-box.soon { background: var(--amber2); }
    .venc-date-box.soon .day { color: var(--amber); }
    .venc-date-box.ok { background: var(--green2); }
    .venc-date-box.ok .day { color: var(--green); }
    .venc-info { flex: 1; min-width: 0; }
    .venc-name { font-size: 14px; font-weight: 600; color: var(--black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .venc-client { font-size: 12px; color: var(--gray); }

    /* ── TASK ITEM ─────────────────────────────────── */
    .task-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--cream2);
    }
    .task-item:last-child { border-bottom: none; }
    .task-check {
      width: 18px; height: 18px; border-radius: 4px;
      border: 2px solid rgba(201,169,110,0.4);
      background: transparent; cursor: pointer;
      flex-shrink: 0; margin-top: 2px; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .task-check.done { background: var(--gold); border-color: var(--gold); }
    .task-check.done::after { content: '✓'; font-size: 11px; color: var(--black); font-weight: 700; }
    .task-text { font-size: 13px; color: var(--black); flex: 1; }
    .task-text.done { text-decoration: line-through; color: var(--gray2); }
    .task-meta { font-size: 11px; color: var(--gray2); margin-top: 2px; }

    /* ── NOTA ITEM ─────────────────────────────────── */
    .nota-card {
      background: var(--cream);
      border: 1px solid rgba(201,169,110,0.15);
      border-radius: 10px; padding: 16px;
      margin-bottom: 12px; position: relative;
    }
    .nota-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; border-radius: 3px 0 0 3px;
      background: var(--gold);
    }
    .nota-text { font-size: 14px; color: var(--black); line-height: 1.6; }
    .nota-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .nota-date { font-size: 11px; color: var(--gray2); font-family: 'JetBrains Mono', monospace; }

    /* ── CLIENT ROW ────────────────────────────────── */
    .client-row { cursor: pointer; transition: background 0.15s; }
    .client-row:hover { background: rgba(201,169,110,0.06) !important; }
    .client-row.selected { background: rgba(201,169,110,0.1) !important; }
    .client-row.selected td:first-child { border-left: 3px solid var(--gold); }

    /* ── DETAIL PANEL ──────────────────────────────── */
    .clients-layout { display: flex; gap: 20px; align-items: flex-start; }
    .clients-list-col { flex: 1; min-width: 0; }
    .detail-panel {
      width: 360px; flex-shrink: 0;
      background: var(--white);
      border: 1px solid rgba(201,169,110,0.15);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      position: sticky; top: 20px;
      overflow: hidden;
    }
    .detail-panel-header {
      background: linear-gradient(135deg, var(--black), var(--black2));
      padding: 22px 20px;
      display: flex; align-items: center; gap: 13px;
    }
    .detail-avatar-lg {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif; font-size: 19px; font-weight: 700;
      color: var(--black); flex-shrink: 0;
    }
    .detail-name { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 700; color: var(--gold2); line-height: 1.2; }
    .detail-sub { font-size: 11px; color: rgba(250,248,243,0.5); margin-top: 3px; }
    .detail-tabs { display: flex; border-bottom: 1px solid var(--cream2); }
    .detail-tab {
      flex: 1; padding: 11px 8px; text-align: center;
      font-size: 12px; font-weight: 600; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.15s;
      color: var(--gray); background: none; border-left: none; border-right: none; border-top: none;
      font-family: 'Montserrat', sans-serif;
    }
    .detail-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .detail-body { padding: 18px 20px; max-height: 500px; overflow-y: auto; }
    .detail-field { margin-bottom: 13px; }
    .detail-field-label { font-size: 10px; color: var(--gray2); text-transform: uppercase; letter-spacing: 1.2px; font-family: 'JetBrains Mono', monospace; margin-bottom: 3px; }
    .detail-field-val { font-size: 14px; color: var(--black); font-weight: 500; word-break: break-word; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .detail-actions { padding: 14px 20px; border-top: 1px solid var(--cream2); display: flex; gap: 8px; }

    /* ── CLAVE CARD ────────────────────────────────── */
    .clave-card {
      background: var(--cream);
      border: 1px solid rgba(201,169,110,0.2);
      border-radius: 10px; padding: 14px; margin-bottom: 12px;
    }
    .clave-card-title {
      font-size: 10px; font-weight: 700; color: var(--gold);
      text-transform: uppercase; letter-spacing: 1.5px;
      font-family: 'JetBrains Mono', monospace; margin-bottom: 10px;
    }
    .clave-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .clave-label-sm { font-size: 11px; color: var(--gray); width: 72px; flex-shrink: 0; }
    .clave-val {
      flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: var(--black); background: var(--white);
      border: 1px solid rgba(201,169,110,0.18); border-radius: 5px;
      padding: 4px 8px; letter-spacing: 0.5px;
    }
    .clave-val.empty { color: var(--gray2); font-style: italic; font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0; }

    /* ── CLIENT CARD (legacy - unused) ─────────────── */
    .client-card {
      background: var(--white);
      border: 1px solid rgba(201,169,110,0.12);
      border-radius: var(--r);
      padding: 20px; cursor: pointer;
      transition: all 0.2s; box-shadow: var(--shadow);
    }
    .client-card:hover { transform: translateY(-3px); box-shadow: var(--shadow2); border-color: rgba(201,169,110,0.3); }
    .client-card-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
    .client-avatar {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700;
      color: var(--black); flex-shrink: 0;
    }
    .client-name { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 600; color: var(--black); }
    .client-type { font-size: 12px; color: var(--gray); margin-top: 2px; }
    .client-stats { display: flex; gap: 16px; padding-top: 14px; border-top: 1px solid var(--cream2); }
    .client-stat { text-align: center; flex: 1; }
    .client-stat-val { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 700; color: var(--black); }
    .client-stat-label { font-size: 10px; color: var(--gray2); letter-spacing: 0.5px; }

    /* ── DIVIDER ────────────────────────────────────── */
    .divider { height: 1px; background: var(--cream2); margin: 20px 0; }

    /* ── SEARCH ────────────────────────────────────── */
    .search-wrap { position: relative; }
    .search-wrap .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--gray2); }
    .search-input {
      width: 100%; padding: 10px 14px 10px 38px;
      background: var(--cream); border: 1.5px solid rgba(201,169,110,0.18);
      border-radius: var(--r2); font-family: 'Montserrat', sans-serif; font-size: 14px;
      color: var(--black); outline: none; transition: all 0.18s;
    }
    .search-input:focus { border-color: var(--gold); background: var(--white); box-shadow: 0 0 0 3px rgba(201,169,110,0.1); }

    /* ── TABS ──────────────────────────────────────── */
    .tabs { display: flex; gap: 4px; background: var(--cream2); padding: 4px; border-radius: 10px; margin-bottom: 24px; }
    .tab {
      flex: 1; padding: 8px 16px; border-radius: 7px;
      font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; background: transparent;
      color: var(--gray); transition: all 0.18s; text-align: center;
    }
    .tab.active { background: var(--white); color: var(--black); box-shadow: 0 2px 8px rgba(17,17,16,0.08); }

    /* ── EMPTY STATE ────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--gray2);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state p { font-size: 14px; max-width: 280px; margin: 0 auto; }

    /* ── LOADING ────────────────────────────────────── */
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--cream2);
      border-top-color: var(--gold);
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════════════
       RESPONSIVE — 3 breakpoints
       Desktop  ≥ 1025px  : sidebar 260px (o colapsado 64px)
       Tablet   768–1024px: sidebar 64px íconos
       Mobile   < 768px   : sin sidebar, bottom nav fijo
    ═══════════════════════════════════════════════════ */

    /* ── Desktop large: 2-col stats ── */
    @media (max-width: 1200px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── TABLET (768px – 1024px) ────────────────────── */
    @media (min-width: 768px) and (max-width: 1024px) {
      :root { --sidebar: 64px; }

      /* Sidebar colapsado a íconos */
      .sidebar {
        width: 64px !important;
        display: flex !important;
      }
      .sidebar-brand, .sidebar-brand-sub,
      .nav-section-label, .nav-label, .nav-badge,
      .user-info, .btn-logout,
      .sidebar-toggle { display: none !important; }
      .sidebar-header { padding: 16px 13px; justify-content: center; }
      .nav-item {
        justify-content: center;
        padding: 12px 0;
        min-height: 48px;
      }
      .nav-icon { font-size: 20px !important; }
      .sidebar-user { justify-content: center; padding: 14px 10px; }

      /* Main */
      .main { margin-left: 64px !important; padding: 20px 16px; }
      .page-title { font-size: 22px; }
      .page-subtitle { font-size: 12px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-6040 { grid-template-columns: 1fr; }

      /* Touch targets */
      .btn, .btn-gold, .btn-ghost { min-height: 42px; font-size: 13px; }
      .btn-icon { width: 36px; height: 36px; font-size: 15px; }
      .task-check { width: 22px !important; height: 22px !important; }

      /* Forms — prevent iOS zoom on focus */
      .form-input, .form-select, .form-textarea { font-size: 16px; min-height: 44px; }

      /* Tabla: ocultar columnas menos críticas */
      .col-hide-tablet { display: none !important; }
    }

    /* ── iPAD portrait (768–834px) ── */
    @media (min-width: 768px) and (max-width: 834px) {
      .main { padding: 16px 14px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .page-header > div:last-child { width: 100%; justify-content: flex-start; }
    }

    /* ── MOBILE (< 768px) ───────────────────────────── */
    @media (max-width: 767px) {
      :root { --sidebar: 0px; }

      /* Sidebar completamente oculto */
      .sidebar { display: none !important; }
      .sidebar-toggle { display: none !important; }

      /* Main ocupa todo el ancho, con padding bottom para el bottom nav */
      .main {
        margin-left: 0 !important;
        padding: 16px 14px 80px;
        width: 100%;
      }
      .main.collapsed { margin-left: 0 !important; }

      /* Tipografía */
      .page-title { font-size: 20px; letter-spacing: -0.5px; }
      .page-subtitle { font-size: 12px; }
      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }
      .page-header > div:last-child {
        display: flex; flex-wrap: wrap; gap: 8px; width: 100%;
      }

      /* Grids a 1 columna */
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .grid-2, .grid-6040 { grid-template-columns: 1fr; gap: 14px; }

      /* Cards */
      .card { padding: 16px; border-radius: 10px; }
      .card-title { font-size: 14px; }

      /* Botones */
      .btn, .btn-gold, .btn-ghost {
        font-size: 13px;
        padding: 10px 14px;
        min-height: 42px;
      }
      .btn-sm { font-size: 12px; padding: 8px 12px; min-height: 36px; }
      .btn-icon { width: 36px; height: 36px; font-size: 14px; }

      /* Forms */
      .form-input, .form-select, .form-textarea { font-size: 16px; min-height: 44px; }
      .form-grid-2 { grid-template-columns: 1fr; }

      /* Touch checkboxes */
      .task-check { width: 22px !important; height: 22px !important; }

      /* Modales a pantalla completa */
      .modal-overlay { align-items: flex-end; }
      .modal-box { border-radius: 20px 20px 0 0; max-height: 92vh; width: 100% !important; max-width: 100% !important; }

      /* Tablas: scroll horizontal, fuente pequeña */
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { font-size: 12px; }
      th, td { padding: 9px 10px !important; white-space: nowrap; }

      /* Columnas que se ocultan en mobile */
      .col-hide-mobile { display: none !important; }

      /* Stat cards */
      .stat-value { font-size: 22px !important; }
      .stat-icon { font-size: 22px !important; }
    }

    /* ═══════════════════════════════════════════════
       BOTTOM NAV — solo mobile (< 768px)
    ═══════════════════════════════════════════════ */
    .bottom-nav {
      display: none;
    }
    @media (max-width: 767px) {
      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 62px;
        background: var(--black);
        border-top: 1px solid rgba(201,169,110,0.18);
        z-index: 300;
        align-items: stretch;
        box-shadow: 0 -4px 20px rgba(17,17,16,0.25);
      }
      .bottom-nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        cursor: pointer;
        transition: background 0.15s;
        border: none;
        background: transparent;
        color: rgba(250,248,243,0.45);
        font-family: 'Montserrat', sans-serif;
        position: relative;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      .bottom-nav-item:active { background: rgba(201,169,110,0.08); }
      .bottom-nav-item.active {
        color: var(--gold2);
        background: rgba(201,169,110,0.08);
      }
      .bottom-nav-item.active::after {
        content: '';
        position: absolute;
        top: 0; left: 20%; right: 20%;
        height: 2px;
        background: var(--gold);
        border-radius: 0 0 3px 3px;
      }
      .bottom-nav-icon { font-size: 18px; line-height: 1; }
      .bottom-nav-label {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.3px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 52px;
        text-align: center;
      }
      .bottom-nav-badge {
        position: absolute;
        top: 6px; right: calc(50% - 18px);
        background: var(--red);
        color: #fff;
        font-size: 8px;
        font-weight: 700;
        font-family: 'JetBrains Mono', monospace;
        padding: 1px 4px;
        border-radius: 99px;
        min-width: 14px;
        text-align: center;
      }
    }

    /* ── TABLA CLIENTES — control de columnas ────────── */
    /* En todas las resoluciones: nowrap y truncado */
    .tbl-cliente-nombre {
      font-weight: 600;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tbl-cuit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gray);
      white-space: nowrap;
    }
    .tbl-tipo { white-space: nowrap; }
    .tbl-servicio {
      font-size: 12px;
      color: var(--gray);
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tbl-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      white-space: nowrap;
    }



    /* ── ICON ACTION BUTTONS ───────────────────────── */
    .btn-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 7px;
      border: none; cursor: pointer; font-size: 14px;
      transition: all 0.15s; background: transparent;
    }
    .btn-icon:hover { transform: scale(1.12); }
    .btn-icon.edit  { color: var(--gold); background: var(--amber2); }
    .btn-icon.edit:hover  { background: #fde68a; }
    .btn-icon.trash { color: var(--red);  background: var(--red2);   }
    .btn-icon.trash:hover { background: #fca5a5; }
    .btn-icon.check { color: var(--green); background: var(--green2); }
    .btn-icon.check:hover { background: #a7f3d0; }
    .action-btns { display: flex; gap: 4px; align-items: center; }
    /* ── STAT CARD CLICKABLE ──────────────────────── */
    .stat-card-link { cursor: pointer; position: relative; transition: all 0.2s; }
    .stat-card-link:hover { transform: translateY(-4px); box-shadow: var(--shadow2); border-color: rgba(201,169,110,0.3); }
    .stat-card-link:hover .stat-card-arrow { opacity: 1; transform: translateX(0); }
    .stat-card-arrow { position:absolute; bottom:12px; right:16px; font-size:14px; color:var(--gold); opacity:0; transform:translateX(-4px); transition:all 0.2s; font-weight:700; }

    /* ── SIDEBAR COLLAPSIBLE ───────────────────────── */
    :root { --sidebar-collapsed: 64px; }
    .sidebar { transition: width 0.25s cubic-bezier(.4,0,.2,1); overflow: hidden; }
    .sidebar.collapsed { width: var(--sidebar-collapsed) !important; }
    .sidebar.collapsed .sidebar-brand,
    .sidebar.collapsed .sidebar-brand-sub,
    .sidebar.collapsed .nav-section-label,
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-badge,
    .sidebar.collapsed .user-info,
    .sidebar.collapsed .btn-logout { display: none !important; }
    .sidebar.collapsed .sidebar-header { padding: 18px 13px; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 11px 0; }
    .sidebar.collapsed .nav-icon { font-size: 20px; }
    .sidebar.collapsed .sidebar-user { justify-content: center; padding: 16px 10px; }
    .sidebar-toggle {
      position: absolute; right: -14px; top: 22px;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--gold); border: 2px solid var(--cream);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 11px; z-index: 200;
      box-shadow: 0 2px 8px rgba(17,17,16,0.18);
      transition: all 0.2s; color: var(--black); font-weight: 700;
      user-select: none;
    }
    .sidebar-toggle:hover { background: var(--gold2); transform: scale(1.1); }
    .main.collapsed { margin-left: var(--sidebar-collapsed) !important; }
    .client-row { cursor: pointer; transition: background 0.15s; }
    .client-row:hover td { background: rgba(201,169,110,0.05); }
    .sidebar.collapsed .nav-item { position: relative; }
    .sidebar.collapsed .nav-item::after {
      content: attr(data-tooltip);
      position: absolute; left: calc(100% + 12px); top: 50%;
      transform: translateY(-50%);
      background: var(--black2); color: var(--gold3);
      padding: 5px 10px; border-radius: 6px; font-size: 12px;
      white-space: nowrap; pointer-events: none; opacity: 0;
      transition: opacity 0.15s; font-family: 'Montserrat', sans-serif;
      border: 1px solid rgba(201,169,110,0.2); z-index: 999;
    }
    .sidebar.collapsed .nav-item:hover::after { opacity: 1; }


    /* ── STAT CARD LINK ────────────────────────────────── */
    .stat-card-link { cursor: pointer; transition: all 0.18s; position: relative; }

<body>
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── HELPERS ─────────────────────────────────────────
const fmt = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0 }).format(n);
const fmtShort = (n) => {
  if (n >= 1000000) return `$${(n/1000000).toFixed(1)}M`;
  if (n >= 1000) return `$${(n/1000).toFixed(0)}K`;
  return fmt(n);
};
const today = new Date();
const todayStr = today.toISOString().split('T')[0];

const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const fmtDate = (d) => {
  if (!d) return '-';
  const dt = new Date(d + 'T12:00:00');
  return `${dt.getDate()} ${MONTHS_ES[dt.getMonth()]} ${dt.getFullYear()}`;
};

const daysUntil = (dateStr) => {
  const d = new Date(dateStr + 'T12:00:00');
  const diff = Math.ceil((d - today) / (1000*60*60*24));
  return diff;
};

const urgencyClass = (days) => {
  if (days < 0) return 'urgent';
  if (days <= 7) return 'urgent';
  if (days <= 15) return 'soon';
  return 'ok';
};

const initials = (name) => {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
};

// ── FIREBASE ACCESS ──────────────────────────────────
const FB = () => window.__FB__;

// ── MOCK DATA ────────────────────────────────────────


// ── GOOGLE ICON ──────────────────────────────────────
const GoogleIcon = () => (
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
  </svg>
);

// ── LOGIN COMPONENT ──────────────────────────────────
function LoginScreen({ onLogin }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleGoogleLogin = async () => {
    setLoading(true); setError('');
    const fb = FB();
    try {
      const provider = new fb.GoogleAuthProvider();
      await fb.signInWithPopup(fb.auth, provider);
    } catch (e) {
      setError('Error al iniciar sesión. Verificá las credenciales de Firebase.');

  return (
    <div className="login-screen">
      <div className="login-grid" />
      <div className="login-card">
        <div className="login-logo">AP</div>
        <div className="login-title">Aragón Paz</div>
        <div className="login-sub">Estudio Contable · Sistema de Gestión</div>
        {error && <div className="alert alert-red" style={{marginBottom:20, textAlign:'left'}}><span>⚠️</span>{error}</div>}
        <button className="btn-google" onClick={handleGoogleLogin} disabled={loading}>
          {loading ? <div className="spinner" style={{width:20,height:20,borderWidth:2}} /> : <GoogleIcon />}
          {loading ? 'Conectando...' : 'Ingresar con Google'}
        </button>
        <div className="login-footer">
          Acceso restringido · Solo cuentas autorizadas
        </div>
      </div>
    </div>
  );
}

// ── MODAL WRAPPER ────────────────────────────────────
// ── EXCEL EXPORT UTILITY ─────────────────────────────
function exportToExcel(rows, filename = 'export') {
  if (!rows || !rows.length) { alert('No hay datos para exportar'); return; }
  const headers = Object.keys(rows[0]);
  const sep = '	';
  const lines = [
    headers.join(sep),
    ...rows.map(r => headers.map(h => {
      const v = r[h] ?? '';
      // Quote cells that contain tabs or newlines
      const s = String(v);
      return s.indexOf('\t') !== -1 || s.indexOf('\n') !== -1 ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(sep))
  ];
  const content = '\uFEFF' + lines.join('\r\n'); // BOM for Excel UTF-8
  const blob = new Blob([content], { type: 'text/tab-separated-values;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `${filename}_${todayStr}.xls`;
  a.click();
  URL.revokeObjectURL(url);
}

function Modal({ title, onClose, children, footer }) {
  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">

          <div className="modal-title">{title}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────
function Dashboard({ clients, vencimientos, tareas, notas, setSection, setTareas }) {
  const activeClients = clients.filter(c => c.estado === 'activo');
  const totalMensual  = activeClients.reduce((s, c) => s + (c.honorario || 0), 0);
  const saldosPendientes = clients.reduce((s, c) => s + (c.saldoPendiente || 0), 0);
  const tareasP = tareas.filter(t => !t.completado).slice(0, 5);

  const now = new Date();
  const dateDisplay = `${now.getDate()} de ${MONTHS_FULL[now.getMonth()]} ${now.getFullYear()}`;
  const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const dayName = days[now.getDay()];

  // ── Misma lógica de matching que Vencimientos ────────
  const TRIBUTO_KEYWORDS = [
    { id:'recat_mono',  words:['recategori'] },
    { id:'monotributo', words:['monotributo'] },
    { id:'autonomos',   words:['autónomos','autonomos'] },
    { id:'ganancias',   words:['ganancias'] },
    { id:'iibb_cm',     words:['convenio multilateral','multilateral','cm0'] },
    { id:'iibb_anual',  words:['iibb','ingresos brutos'], extra: n => n.includes('anual') },
    { id:'iibb',        words:['iibb','ingresos brutos'] },
    { id:'iva',         words:['iva'] },
    { id:'f931',        words:['f.931','f931','suss','siradig','f572'] },
    { id:'bienes_pers', words:['bienes personales'] },
    { id:'imp_sellos',  words:['sellos'] },
    { id:'imp_inmob',   words:['inmobiliario'] },
    { id:'automotores', words:['automotor','patente'] },
    { id:'sueldos',     words:['sueldo','remuneracion','remuneración'] },
  ];
  const getTributoId = (nombre) => {
    const n = (nombre||'').toLowerCase();
    for (const e of TRIBUTO_KEYWORDS) {
      if (e.extra && !e.extra(n)) continue;
      if (e.words.some(w => n.includes(w))) return e.id;
    }
    return null;
  };
  const getCuitRange = (nombre) => {
    const m = (nombre||'').match(/CUIT[^0-9]*term[^0-9]*(\d)\s*[-–y]\s*(\d)/i);
    if (!m) return null;
    const from = parseInt(m[1]), to = parseInt(m[2]);
    return Array.from({length: to-from+1}, (_,i) => from+i);
  };
  const getCuitDigit = (cuit) => {
    const l = (cuit||'').replace(/[-\s]/g,'');
    return l.length < 2 ? NaN : parseInt(l[l.length-2]);
  };
  const hasMatchingClients = (v) => {
    const tid = getTributoId(v.nombre);
    if (!tid) return false;
    const cr = getCuitRange(v.nombre);
    return activeClients.some(c => {
      const tiene = Array.isArray(c.tributos) && c.tributos.some(t => t.id === tid);
      if (!tiene) return false;
      if (cr) { const d = getCuitDigit(c.cuit); return !isNaN(d) && cr.includes(d); }
      return true;
    });
  };

  // ── Vencimientos filtrados con lógica de clientes ────
  const mesActualKey = todayStr.slice(0,7);

  // Solo los que tienen clientes dados de alta con ese tributo
  const vencConClientes = vencimientos.filter(v => !v.presentado && hasMatchingClients(v));

  // Stat card: venc del mes actual (pendientes)
  const vencDelMes = vencConClientes.filter(v => v.fecha && v.fecha.startsWith(mesActualKey)).length;

  // Urgentes (≤7 días, no presentados)
  const vencUrgentes = vencConClientes.filter(v => {
    const d = daysUntil(v.fecha);
    return d >= -1 && d <= 7;
  }).length;

  // Próximos 30 días para stat card
  const vencProximos30 = vencConClientes.filter(v => {
    const d = daysUntil(v.fecha);
    return d >= 0 && d <= 30;
  }).length;

  // Lista del dashboard: próximos 8 vencimientos ordenados por fecha
  // Deduplicamos por vencId para no repetir el mismo vencimiento por cada cliente
  const vencListaUniq = [];
  const vencIdsSeen = new Set();
  [...vencConClientes]
    .sort((a,b) => new Date(a.fecha) - new Date(b.fecha))
    .filter(v => { const d = daysUntil(v.fecha); return d >= -3 && d <= 30; })
    .forEach(v => {
      if (!vencIdsSeen.has(v.id)) {
        vencIdsSeen.add(v.id);
        // Contar cuántos clientes aplican
        const tid = getTributoId(v.nombre);
        const cr  = getCuitRange(v.nombre);
        const matchedCount = tid ? activeClients.filter(c => {
          const tiene = Array.isArray(c.tributos) && c.tributos.some(t => t.id === tid);
          if (!tiene) return false;
          if (cr) { const d = getCuitDigit(c.cuit); return !isNaN(d) && cr.includes(d); }
          return true;
        }).length : 0;
        vencListaUniq.push({...v, _matchedCount: matchedCount});
      }
    });
  const vencLista = vencListaUniq.slice(0, 8);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Buenos días ☀️</div>
          <div className="page-subtitle">{dayName}, {dateDisplay} · Todo listo para arrancar</div>
        </div>
        <div className="page-date" style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}}>
          <div style={{fontWeight:700,color:'var(--black)',fontSize:14}}>{activeClients.length} clientes activos</div>
          <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>exportToExcel(
            clients.map(c=>({'Cliente':c.nombre,'Tipo':c.tipo,'Honorario':c.honorario,'Saldo':c.saldoPendiente,'Estado':c.estado})),
            'Dashboard_Clientes'
          )}>📥 Exportar Excel</button>
        </div>
      </div>

      {/* ── ALERTA URGENTE — usa vencDelMes ── */}
      {(vencUrgentes > 0 || vencDelMes > 0) && (
        <div className="alert alert-red" style={{marginBottom:20}}>
          <span>🚨</span>
          <span>
            {vencUrgentes > 0 && (
              <><strong>{vencUrgentes} vencimiento{vencUrgentes>1?'s':''} urgente{vencUrgentes>1?'s':''}</strong> (próximos 7 días). </>
            )}
            {vencDelMes > 0 && (
              <><strong>{vencDelMes} vencimiento{vencDelMes>1?'s':''}</strong> este mes ({MONTHS_FULL[now.getMonth()]}). </>
            )}
            <span style={{cursor:'pointer',textDecoration:'underline'}} onClick={()=>setSection('vencimientos')}>Ver todos →</span>
          </span>
        </div>
      )}

      {/* ── STAT CARDS ── */}
      <div className="stats-grid">
        <div className="stat-card stat-card-link" onClick={()=>setSection('clientes')} title="Ver clientes">
          <div className="stat-icon">👥</div>
          <div className="stat-label">Clientes Activos</div>
          <div className="stat-value">{activeClients.length}</div>
          <div className="stat-delta">De un total de {clients.length} registrados</div>
          <div className="stat-card-arrow">→</div>
        </div>
        <div className="stat-card stat-card-link" onClick={()=>setSection('facturacion')} title="Ver facturación">
          <div className="stat-icon">💰</div>
          <div className="stat-label">Ingresos Mensuales</div>
          <div className="stat-value gold">{fmtShort(totalMensual)}</div>
          <div className="stat-delta up">Facturación recurrente</div>
          <div className="stat-card-arrow">→</div>
        </div>
        <div className="stat-card stat-card-link" onClick={()=>setSection('vencimientos')} title="Ver vencimientos">
          <div className="stat-icon">📅</div>
          <div className="stat-label">Venc. del Mes</div>
          <div className="stat-value" style={{color: vencUrgentes > 0 ? 'var(--red)' : 'var(--black)'}}>
            {vencDelMes}
          </div>
          <div className="stat-delta" style={{color: vencUrgentes > 0 ? 'var(--red)' : ''}}>
            {vencUrgentes > 0 ? `${vencUrgentes} urgentes · ${vencProximos30} en 30d` : `${vencProximos30} en los próximos 30 días`}
          </div>
          <div className="stat-card-arrow">→</div>
        </div>
        <div className="stat-card stat-card-link" onClick={()=>setSection('cobros')} title="Ver cobros pendientes">
          <div className="stat-icon">⏳</div>
          <div className="stat-label">Saldos Pendientes</div>
          <div className="stat-value" style={{color: saldosPendientes > 0 ? 'var(--amber)' : 'var(--green)'}}>
            {fmtShort(saldosPendientes)}
          </div>
          <div className="stat-delta" style={{color: saldosPendientes > 0 ? 'var(--amber)' : 'var(--green)'}}>
            {saldosPendientes > 0 ? 'A cobrar' : 'Todo al día ✓'}
          </div>
          <div className="stat-card-arrow">→</div>
        </div>
      </div>

      <div className="grid-6040" style={{marginBottom:24}}>
        {/* ── VENCIMIENTOS — solo con clientes dados de alta ── */}
        <div className="card">
          <div className="card-title" style={{justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span>📅</span> Próximos Vencimientos
            </div>
            <span style={{fontSize:11,color:'var(--gray)',fontWeight:400,
              fontFamily:'JetBrains Mono,monospace',cursor:'pointer'}}
              onClick={()=>setSection('vencimientos')}>
              ver todos →
            </span>
          </div>

          {vencLista.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">🎉</div>
              <p>Sin vencimientos próximos con clientes activos</p>
            </div>
          ) : (
            vencLista.map(v => {
              const d  = daysUntil(v.fecha);
              const uc = urgencyClass(d);
              const dt = new Date(v.fecha + 'T12:00:00');
              return (
                <div className="venc-item" key={v.id} style={{cursor:'pointer'}}
                  onClick={()=>setSection('vencimientos')}>
                  <div className={`venc-date-box ${uc}`}>
                    <div className="day">{dt.getDate()}</div>
                    <div className="month">{MONTHS_ES[dt.getMonth()]}</div>
                  </div>
                  <div className="venc-info" style={{flex:1,minWidth:0}}>
                    <div className="venc-name">{v.nombre}</div>
                    <div className="venc-client" style={{display:'flex',alignItems:'center',gap:6}}>
                      {v._matchedCount > 0 && (
                        <span style={{fontSize:10,background:'rgba(201,169,110,0.15)',
                          color:'var(--gold)',padding:'1px 6px',borderRadius:99,
                          fontWeight:700,fontFamily:'JetBrains Mono,monospace'}}>
                          {v._matchedCount} cliente{v._matchedCount!==1?'s':''}
                        </span>
                      )}
                      <span>
                        {d < 0
                          ? <span style={{color:'var(--red)',fontWeight:600}}>Vencido hace {Math.abs(d)}d</span>
                          : d === 0
                          ? <span style={{color:'var(--red)',fontWeight:600}}>HOY</span>
                          : `${d}d`}
                      </span>
                    </div>
                  </div>
                  <span className={`badge badge-${uc==='urgent'?'red':uc==='soon'?'amber':'green'}`}>
                    {uc==='urgent'?'🚨 Urgente':uc==='soon'?'⚠️ Pronto':'✓ OK'}
                  </span>
                </div>
              );
            })
          )}
        </div>

        {/* TAREAS */}
        <div className="card">
          <div className="card-title"><span>✅</span> Pendientes del Día</div>
          {tareasP.length === 0
            ? <div className="empty-state"><div className="empty-icon">✨</div><p>Todo al día</p></div>
            : tareasP.map(t => (
              <div className="task-item" key={t.id} style={{opacity:t.completado?0.5:1,transition:'opacity 0.3s'}}>
                <div className={`task-check ${t.completado?'done':''}`}
                  style={{cursor:'pointer'}}
                  onClick={async () => {
                    try { await FB().updateDoc(FB().doc(FB().db,'tareas',t.id),{completado:true}); } catch(e){}
                    setTareas(prev => prev.map(x => x.id===t.id?{...x,completado:true}:x));
                    setTimeout(()=>setTareas(prev=>prev.filter(x=>x.id!==t.id||!x.completado)),600);
                  }} />
                <div style={{flex:1}}>
                  <div className={`task-text ${t.completado?'done':''}`}>{t.texto}</div>
                  {t.cliente && <div className="task-meta">📁 {t.cliente}</div>}
                </div>
              </div>
            ))
          }
          {tareas.filter(t=>!t.completado).length > 5 && (
            <div style={{marginTop:8,fontSize:12,color:'var(--gray)',cursor:'pointer'}} onClick={()=>setSection('tareas')}>
              + {tareas.filter(t=>!t.completado).length-5} más pendientes →
            </div>
          )}
        </div>
      </div>

      {/* CLIENTES RESUMEN */}
      <div className="card" style={{marginBottom:24}}>
        <div className="card-title"><span>👥</span> Resumen de Clientes</div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Tipo</th>
                <th>Servicio</th>
                <th>Honorario</th>
                <th>Saldo Pendiente</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              {clients.slice(0,6).map(c => (
                <tr key={c.id} style={{cursor:'pointer'}} title="Ver detalle del cliente"
                  onClick={()=>{ setSection('clientes'); setTimeout(()=>window.__openClient&&window.__openClient(c.id),100); }}>
                  <td style={{fontWeight:600,color:'var(--black)'}}>{c.nombre}</td>
                  <td>
                    <span className={`badge ${c.tipo==='sociedad'?'badge-blue':c.tipo==='responsable_inscripto'?'badge-amber':c.tipo==='monotributista'?'badge-gold':'badge-gray'}`}>
                      {c.tipo==='sociedad'?'🏢 Sociedad':c.tipo==='responsable_inscripto'?'📊 Resp. Inscripto':c.tipo==='monotributista'?'📋 Monotributo':'🔵 Exento'}
                    </span>
                  </td>
                  <td style={{fontSize:13}}>{c.servicio}</td>
                  <td style={{fontFamily:'JetBrains Mono, monospace',fontSize:13}}>{fmt(c.honorario)}</td>
                  <td>
                    {c.saldoPendiente > 0
                      ? <span style={{color:'var(--amber)',fontWeight:600,fontFamily:'JetBrains Mono, monospace',fontSize:13}}>{fmt(c.saldoPendiente)}</span>
                      : <span className="badge badge-green">Al día</span>
                    }
                  </td>
                  <td><span className={`badge ${c.estado==='activo'?'badge-green':'badge-red'}`}>{c.estado}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* NOTAS RECIENTES */}
      {notas.length > 0 && (
        <div className="card">
          <div className="card-title"><span>📝</span> Notas Recientes</div>
          <div className="grid-2">
            {notas.slice(0,2).map(n => (
              <div className="nota-card" key={n.id}>
                <div className="nota-text">{n.texto}</div>
                <div className="nota-meta">
                  <div className="nota-date">{fmtDate(n.fecha)}</div>
                  {n.cliente && <span className="badge badge-gray">{n.cliente}</span>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── TRIBUTOS SEED (seeds Firebase collection on first load) ───────────
// ── CUIT-dependent due-date offsets (official ARCA calendar) ─────────
// Each key = tributo id. base = nominal day. offsets[lastDigit] = delta days.
const CUIT_OFFSETS = {
  iva:       { base:18, offsets:{0:0,1:0, 2:1,3:1, 4:2,5:2, 6:7,7:7, 8:8,9:8} },
  // IVA: CUIT 0-1→día18, 2-3→19, 4-5→20, 6-7→25, 8-9→26
  f931:      { base:9,  offsets:{0:0,1:0,2:0,3:0, 4:1,5:1,6:1, 7:2,8:2,9:2} },
  // F.931: CUIT 0-3→día9, 4-6→10, 7-9→11
  autonomos: { base:5,  offsets:{0:0,1:0,2:0,3:0, 4:1,5:1,6:1, 7:4,8:4,9:4} },
  // Autónomos: CUIT 0-3→día5, 4-6→6, 7-9→9
};

// ── Resolve exact business day for a tributo given a CUIT and month ───
// Handles CUIT-dependent offsets, Monotributo special months, and skips weekends.
function resolveVencDia(tributo, cuitStr, year, month0) {
  const lastDigit = parseInt((cuitStr||'').replace(/[-\s]/g,'').slice(-1)) || 0;
  // CUIT-dependent tributos (IVA, F.931, Autónomos)
  if (tributo.cuitDependiente && CUIT_OFFSETS[tributo.cuitKey]) {
    const { base, offsets } = CUIT_OFFSETS[tributo.cuitKey];
    return base + (offsets[lastDigit] ?? 0);
  }
  // Monotributo special: June→22, Sep/Dec→21, rest→20
  if (tributo.id === 'monotributo') {
    if (month0 === 5)  return 22;
    if (month0 === 8 || month0 === 11) return 21;
    return 20;
  }
  return tributo.dia || 20;
}

// ── TAREAS RECURRENTES (pestaña dentro de detalle de cliente) ────────
function TareasRecurrentes({ cliente, tareas, setTareas }) {
  const [texto, setTexto]           = useState('');
  const [frecuencia, setFrecuencia] = useState('mensual');
  const [dia, setDia]               = useState('1');
  const [saving, setSaving]         = useState(false);

  const templates = tareas.filter(t => t.recurrente && t.clienteId === cliente.id);
  const thisMonth = todayStr.slice(0, 7);
  const instances = tareas.filter(t =>
    !t.recurrente && t.clienteId===cliente.id &&
    t.recurrenteId && (t.fecha||'').startsWith(thisMonth)
  );

  useEffect(() => {
    if (!templates.length) return;
    const monthNum = parseInt(thisMonth.split('-')[1]);
    const toCreate = [];
    templates.forEach(tmpl => {
      const freq = tmpl.frecuencia || 'mensual';
      if (freq==='bimestral'  && monthNum%2!==1) return;
      if (freq==='trimestral' && ![1,4,7,10].includes(monthNum)) return;
      const exists = tareas.some(t => t.recurrenteId===tmpl.id && (t.fecha||'').startsWith(thisMonth));
      if (!exists) {
        const yr = parseInt(thisMonth.split('-')[0]);
        const d  = Math.min(parseInt(tmpl.dia||1), new Date(yr, monthNum, 0).getDate());
        toCreate.push({
          texto:tmpl.texto, clienteId:cliente.id, cliente:cliente.nombre,
          recurrenteId:tmpl.id, fecha:`${thisMonth}-${String(d).padStart(2,'0')}`,
          completado:false, recurrente:false,
        });
      }
    });
    if (!toCreate.length) return;
    Promise.all(toCreate.map(async task => {
      try {
        const ref = await FB().addDoc(FB().collection(FB().db,'tareas'),{...task,createdAt:FB().serverTimestamp()});
        return {...task, id:ref.id};
      } catch(e) { return {...task, id:'local-'+Date.now()+Math.random()}; }
    })).then(created => setTareas(prev=>[...prev,...created]));
  }, [templates.length, thisMonth, cliente.id]);

  const addTemplate = async () => {
    if (!texto.trim()) return;
    setSaving(true);
    const tmpl = { texto:texto.trim(), clienteId:cliente.id, cliente:cliente.nombre,
      frecuencia, dia:parseInt(dia), recurrente:true, completado:false };
    try {
      const ref = await FB().addDoc(FB().collection(FB().db,'tareas'),{...tmpl,createdAt:FB().serverTimestamp()});
      setTareas(prev=>[...prev,{...tmpl,id:ref.id}]);
    } catch(e) { setTareas(prev=>[...prev,{...tmpl,id:'local-'+Date.now()}]); }
    setTexto(''); setSaving(false);
  };

  const deleteTemplate = async (id) => {
    const r = await Swal.fire({title:'¿Eliminar template?',text:'Las instancias ya generadas no se borran.',
      icon:'warning',showCancelButton:true,confirmButtonText:'Sí, eliminar',cancelButtonText:'Cancelar',
      customClass:{popup:'swal-ap'},reverseButtons:true});
    if (!r.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'tareas',id)); } catch(e){}
    setTareas(prev=>prev.filter(t=>t.id!==id));
  };

  const toggleInstance = async (id) => {
    const t = tareas.find(x=>x.id===id);
    try { await FB().updateDoc(FB().doc(FB().db,'tareas',id),{completado:!t.completado}); } catch(e){}
    setTareas(prev=>prev.map(x=>x.id===id?{...x,completado:!x.completado}:x));
  };

  const FREQ = {mensual:'Mensual',bimestral:'Bimestral',trimestral:'Trimestral'};

  return (
    <div>
      <div className="card" style={{marginBottom:20}}>
        <div className="card-title" style={{marginBottom:16}}><span>➕</span> Nueva Tarea Recurrente</div>
        <div className="form-grid-3" style={{alignItems:'end'}}>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label">Descripción</label>
            <input className="form-input" value={texto} onChange={e=>setTexto(e.target.value)}
              placeholder="Ej: Presentar DDJJ mensual" onKeyDown={e=>e.key==='Enter'&&addTemplate()} />
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label">Frecuencia</label>
            <select className="form-select" value={frecuencia} onChange={e=>setFrecuencia(e.target.value)}>
              <option value="mensual">Mensual</option>
              <option value="bimestral">Bimestral</option>
              <option value="trimestral">Trimestral</option>
            </select>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label">Día del mes</label>
            <input className="form-input" type="number" min="1" max="28" value={dia}
              onChange={e=>setDia(e.target.value)} />
          </div>
        </div>
        <button className="btn btn-gold" style={{marginTop:14}} onClick={addTemplate} disabled={saving||!texto.trim()}>
          {saving?'⏳ Guardando...':'+ Agregar Template'}
        </button>
      </div>
      <div className="card" style={{marginBottom:20}}>
        <div className="card-title" style={{marginBottom:14}}><span>📋</span> Templates Activos ({templates.length})</div>
        {!templates.length
          ? <div style={{color:'var(--gray)',fontSize:13,textAlign:'center',padding:'20px 0'}}>Sin templates. Creá uno arriba.</div>
          : templates.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
              padding:'10px 14px',background:'var(--cream)',borderRadius:'var(--r2)',marginBottom:8,
              border:'1px solid rgba(201,169,110,0.2)'}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <span>🔁</span>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{t.texto}</div>
                  <div style={{fontSize:11,color:'var(--gray)',fontFamily:'JetBrains Mono,monospace',marginTop:2}}>
                    {FREQ[t.frecuencia]||t.frecuencia} · día {t.dia}
                  </div>
                </div>
              </div>
              <button className="btn-icon trash" onClick={()=>deleteTemplate(t.id)}>🗑️</button>
            </div>
          ))
        }
      </div>
      <div className="card">
        <div className="card-title" style={{marginBottom:14}}>
          <span>📅</span> {MONTHS_FULL[parseInt(thisMonth.split('-')[1])-1]} {thisMonth.split('-')[0]}
        </div>
        {!instances.length
          ? <div style={{color:'var(--gray)',fontSize:13,textAlign:'center',padding:'20px 0'}}>
              {templates.length?'Sin instancias este mes aún.':'Creá templates primero.'}
            </div>
          : instances.map(t=>(
            <div key={t.id} onClick={()=>toggleInstance(t.id)}
              style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',cursor:'pointer',
                background:t.completado?'var(--green2)':'var(--cream)',borderRadius:'var(--r2)',marginBottom:8,
                border:`1px solid ${t.completado?'rgba(34,197,94,0.3)':'rgba(201,169,110,0.15)'}`,transition:'all 0.15s'}}>
              <div style={{width:22,height:22,borderRadius:6,flexShrink:0,
                background:t.completado?'var(--green)':'transparent',
                border:`2px solid ${t.completado?'var(--green)':'rgba(201,169,110,0.5)'}`,
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'white',fontWeight:700}}>
                {t.completado?'✓':''}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:500,fontSize:14,textDecoration:t.completado?'line-through':'none',
                  color:t.completado?'var(--gray)':'var(--black)'}}>{t.texto}</div>
                <div style={{fontSize:11,color:'var(--gray)',fontFamily:'JetBrains Mono,monospace',marginTop:2}}>
                  Vence: {fmtDate(t.fecha)}
                </div>
              </div>
              <span className={`badge ${t.completado?'badge-green':'badge-amber'}`} style={{fontSize:10}}>
                {t.completado?'✓ Hecha':'Pendiente'}
              </span>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ── CLIENTES ─────────────────────────────────────────
function Clientes({ clients, setClients, vencimientos, setVencimientos, tributosCatalogo, setTributosCatalogo, tareas, setTareas }) {
  const [search, setSearch]       = useState('');
  const [view, setView]           = useState('list');
  const [selected, setSelected]   = useState(null);
  const [detailTab, setDetailTab] = useState('info');
  const [form, setForm]           = useState({});
  const [formTab, setFormTab]     = useState('datos');
  const [filter, setFilter]       = useState('todos');
  const [saving, setSaving]       = useState(false);
  const [cuitError, setCuitError] = useState('');
  const [showPass, setShowPass]   = useState({});
  const [showCatalogo, setShowCatalogo] = useState(false);

  const filtered = React.useMemo(() => clients.filter(c => {
    const q = (search||'').toLowerCase().trim();
    const matchSearch = !q ||
      (c.nombre||'').toLowerCase().includes(q) ||
      (c.email||'').toLowerCase().includes(q) ||
      (c.cuit||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')) ||
      (c.telefono||'').includes(q) ||
      (c.servicio||'').toLowerCase().includes(q);
    const matchFilter =
      filter === 'todos' ? true :
      filter === 'inactivo' ? c.estado === 'inactivo' :
      filter === 'prospecto' ? c.estado === 'prospecto' :
      c.tipo === filter;
    return matchSearch && matchFilter;
  }), [clients, search, filter]);

  const handleCuitChange = (val) => {
    const digits = val.replace(/\D/g, '').slice(0, 11);
    let formatted = digits;
    if (digits.length > 2)  formatted = digits.slice(0,2) + '-' + digits.slice(2);
    if (digits.length > 10) formatted = digits.slice(0,2) + '-' + digits.slice(2,10) + '-' + digits.slice(10);
    setForm(f => ({...f, cuit: formatted, claves: {...(f.claves||{}), arca_usuario: formatted}}));
    if (digits.length > 0 && digits.length < 11) setCuitError('El CUIT debe tener 11 dígitos');
    else setCuitError('');
  };

  const openNew = () => {
    setForm({ tipo:'monotributista', estado:'activo', honorario:'', saldoPendiente:0, tributos:[],
      claves:{ arca_usuario:'', arca_clave:'', arba_clave:'', muni_clave:'' }
    });
    setFormTab('datos'); setCuitError(''); setShowPass({}); setView('new');
  };
  const openEdit = (c) => {
    setSelected(c);
    setForm({ ...c, tributos: c.tributos||[],
      claves:{ arca_usuario: c.claves?.arca_usuario || c.cuit||'',
               arca_clave:   c.claves?.arca_clave||'',
               arba_clave:   c.claves?.arba_clave||'',
               muni_clave:   c.claves?.muni_clave||'' }
    });
    setFormTab('datos'); setCuitError(''); setShowPass({}); setView('edit');
  };
  const openDetail = (c) => { setSelected(c); setDetailTab('info'); setView('detail'); };

  // Mantener selected sincronizado cuando clients cambia desde afuera (ej: cobro registrado)
  React.useEffect(() => {
    if (selected && view === 'detail') {
      const updated = clients.find(x => x.id === selected.id);
      if (updated) setSelected(updated);
    }
  }, [clients]);

  // Expose openDetail for cross-component navigation (used by Dashboard)
  React.useEffect(() => {
    window.__openClient = (clientId) => {
      const c = clients.find(x => x.id === clientId);
      if (c) openDetail(c);
    };
    return () => { window.__openClient = null; };
  }, [clients]);
  const backToList = () => setView('list');

  // ── CUIT-aware vencimiento generator ────────────────────────────────
  // Given a client + their assigned tributos, produces dated vencimientos
  // for the next 12 months, respecting CUIT-dependent due dates (IVA, F.931, etc.)
  const generateVencimientosForClient = async (client, tributos) => {
    if (!tributos || !tributos.length) return [];
    const now   = new Date();
    const cuit  = (client.cuit || '').replace(/[-\s]/g, '');
    const generated = [];

    for (let m = 0; m < 12; m++) {
      const totalMon = now.getMonth() + m;
      const yr  = now.getFullYear() + Math.floor(totalMon / 12);
      const mon = totalMon % 12;                   // 0-indexed month

      tributos.forEach(t => {
        const per = t.periodicidad || 'mensual';
        // skip non-recurring
        if (per === 'variable' || per === 'cuotas' || per === 'anual') return;
        if (per === 'semestral'     && m % 6 !== 0) return;
        if (per === 'bimestral'     && m % 2 !== 0) return;
        if (per === 'cuatrimestral' && m % 4 !== 0) return;

        // Resolve the exact day using global resolveVencDia (uses CUIT_OFFSETS)
        const rawDay = resolveVencDia(t, cuit, yr, mon);
        const maxDay = new Date(yr, mon + 1, 0).getDate();
        const day    = Math.min(rawDay, maxDay);
        const fecha  = `${yr}-${String(mon+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        // For CUIT-dependent tributos, append last digit so it's traceable
        const cuitTag = t.cuitDependiente && cuit.length
          ? ` · CUIT ···${cuit.slice(-1)}`
          : '';
        const nombre = `${t.label}${cuitTag} — ${client.nombre}`;

        generated.push({
          nombre,
          tipo:       t.categoria === 'Laboral' ? 'laboral' : 'fiscal',
          fecha,
          clientes:   client.nombre,
          prioridad:  t.categoria === 'Nacional' ? 'alta' : 'media',
          completado: false,
          autoGenerado: true,
          clienteId:  client.id,
          tributoId:  t.id,
          notas:      t.nota || '',
        });
      });
    }

    // Persist to Firestore + local state
    const saved = [];
    for (const v of generated) {
      try {
        const ref = await FB().addDoc(FB().collection(FB().db,'vencimientos'), {...v, createdAt: FB().serverTimestamp()});
        saved.push({...v, id: ref.id});
      } catch(e) {
        saved.push({...v, id: 'local-'+Date.now()+Math.random()});
      }
    }
    return saved;
  };

      nombre: form.nombre||'', tipo: form.tipo||'monotributista',
      cuit: form.cuit||'', email: form.email||'', telefono: form.telefono||'',
      responsable: form.responsable||'', domicilio: form.domicilio||'',
      servicio: form.servicio||'', honorario: Number(form.honorario||0),
      saldoPendiente: Number(form.saldoPendiente||0), estado: form.estado||'activo',
      desde: form.desde||'', empleados: Number(form.empleados||0), notas: form.notas||'',
      tributos: form.tributos||[],
      claves: {
        arca_usuario: form.claves?.arca_usuario||form.cuit||'',
        arca_clave:   form.claves?.arca_clave||'',
        arba_clave:   form.claves?.arba_clave||'',
        muni_clave:   form.claves?.muni_clave||'',
      }

    let savedClient;
    try {
      const fb = FB();
      if (view === 'new') {
        const docRef = await fb.addDoc(fb.collection(fb.db,'clients'), {...payload, createdAt: fb.serverTimestamp()});
        savedClient = {...payload, id: docRef.id};
        setClients(prev => [...prev, savedClient]);
      } else {
        await fb.updateDoc(fb.doc(fb.db,'clients',selected.id), payload);
        savedClient = {...payload, id: selected.id};
        setClients(prev => prev.map(c => c.id===selected.id ? savedClient : c));
      }
    } catch(e) {
      if (view === 'new') {
        savedClient = {...payload, id:'local-'+Date.now()};
        setClients(prev => [...prev, savedClient]);
      } else {
        savedClient = {...payload, id: selected.id};
        setClients(prev => prev.map(c => c.id===selected.id ? savedClient : c));
      }
    }
    // auto-generate vencimientos for NEW clients with assigned tributos
    if (view === 'new' && (form.tributos||[]).length > 0) {
      const newVenc = await generateVencimientosForClient(savedClient, form.tributos);
      if (newVenc.length > 0) setVencimientos(prev => [...prev, ...newVenc]);
    }
    setSelected(savedClient);
    setSaving(false); setView('detail');
    Swal.fire({ icon:'success', title: view==='new'?'Cliente creado':'Cliente actualizado', timer:1500, showConfirmButton:false, customClass:{popup:'swal-ap'} });

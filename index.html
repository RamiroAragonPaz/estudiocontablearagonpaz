                </div>
              ))}
            </div>
          </div>
        )}
        {detailTab==='tributos' && (
          <div className="card">
            <div className="card-title"><span>📊</span> Tributos del Cliente</div>
            {(c.tributos||[]).length===0
              ? <div className="empty-state" style={{padding:40}}><div className="empty-icon">📊</div><p>Sin tributos asignados.</p></div>
              : <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>
                  {(c.tributos||[]).map(t=>(
                    <div key={t.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:'var(--cream)',borderRadius:'var(--r2)',border:'1px solid rgba(201,169,110,0.15)'}}>
                      <div style={{width:36,height:36,borderRadius:9,background:'rgba(201,169,110,0.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>
                        {CAT_ICON[t.categoria]||'📋'}
                      </div>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{t.label}</div>
                        <div style={{display:'flex',gap:6,marginTop:3}}>
                          <span className="badge badge-blue" style={{fontSize:9}}>{t.categoria||t.tipo}</span>
                          <span className="badge badge-gray" style={{fontSize:9}}>{t.organismo}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
            }
          </div>
        )}
        {detailTab==='claves' && (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:16}}>
            {[
              {title:'🏛️ ARCA (Ex-AFIP)', showUser:true, u:c.claves?.arca_usuario||c.cuit, p:c.claves?.arca_clave, ku:'d_arca_u', kp:'d_arca_p'},
              {title:'🏠 ARBA / Provincia', showUser:false, u:c.claves?.arca_usuario||c.cuit, p:c.claves?.arba_clave, ku:'d_arba_u', kp:'d_arba_p'},
              {title:'🏙️ Municipal', showUser:false, u:c.claves?.arca_usuario||c.cuit, p:c.claves?.muni_clave, ku:'d_muni_u', kp:'d_muni_p'},
            ].map(({title,showUser,u,p,kp})=>(
              <div key={title} className="card">
                <div className="card-title" style={{marginBottom:14}}><span>🔑</span> {title}</div>
                {showUser && (
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:10,color:'var(--gray2)',textTransform:'uppercase',letterSpacing:'1px',fontFamily:'JetBrains Mono,monospace',marginBottom:4}}>CUIT / Usuario</div>
                    <div style={{padding:'8px 12px',background:'var(--cream)',borderRadius:'var(--r2)',fontFamily:'JetBrains Mono,monospace',fontSize:13,color:u?'var(--black)':'var(--gray2)',fontStyle:u?'normal':'italic'}}>{u||'No cargado'}</div>
                  </div>
                )}
                {!showUser && u && (
                  <div style={{marginBottom:10,fontSize:11,color:'var(--gray2)'}}>Usuario: {u}</div>
                )}
                <div>
                  <div style={{fontSize:10,color:'var(--gray2)',textTransform:'uppercase',letterSpacing:'1px',fontFamily:'JetBrains Mono,monospace',marginBottom:4}}>Contraseña</div>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <div style={{flex:1,padding:'8px 12px',background:'var(--cream)',borderRadius:'var(--r2)',fontFamily:'JetBrains Mono,monospace',fontSize:13,color:p?'var(--black)':'var(--gray2)',fontStyle:p?'normal':'italic',letterSpacing:p&&!showPass[kp]?'2px':'normal'}}>
                      {!p?'No cargada':showPass[kp]?p:'●'.repeat(Math.min(p.length,12))}
                    </div>
                    {p && <button onClick={()=>togglePass(kp)} style={{background:'var(--cream2)',border:'1px solid rgba(201,169,110,0.2)',borderRadius:'var(--r2)',padding:'7px 10px',cursor:'pointer',fontSize:15}}>{showPass[kp]?'🙈':'👁️'}</button>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
        {detailTab==='notas' && (
          <ClientNotas cliente={c} />
        )}
        {detailTab==='recurrentes' && (
          <TareasRecurrentes cliente={c} tareas={tareas||[]} setTareas={setTareas} />
        )}
      </div>
    );
  };

  // ── LIST VIEW ────────────────────────────────────────
  const renderList = () => (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Clientes</div>
          <div className="page-subtitle">{filtered.length} cliente{filtered.length!==1?'s':''} · {clients.filter(c=>c.estado==='activo').length} activos</div>
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-ghost btn-sm" style={{fontSize:12}} onClick={()=>setShowCatalogo(true)}>⚙️ Catálogo Tributos</button>
          <button className="btn btn-gold" onClick={openNew}>+ Nuevo Cliente</button>
        </div>
      </div>
      <div style={{display:'flex',gap:12,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <div className="search-wrap" style={{flex:1,minWidth:220}}>
          <span className="search-icon">🔍</span>
          <input className="search-input" placeholder="Buscar por nombre, CUIT o email..." value={search} onChange={e=>setSearch(e.target.value)} />
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {[['todos','Todos'],['sociedad','Sociedades'],['responsable_inscripto','Resp. Inscripto'],['monotributista','Monotributo'],['prospecto','Prospectos'],['inactivo','Inactivos']].map(([f,l])=>(
            <button key={f} className={`btn btn-sm ${filter===f?'btn-primary':'btn-ghost'}`} onClick={()=>setFilter(f)}>{l}</button>
          ))}
        </div>
      </div>
      {filtered.length===0
        ? <div className="empty-state card"><div className="empty-icon">👥</div><p>No se encontraron clientes. ¡Agregá el primero!</p></div>
        : (
          <div className="card" style={{padding:0,overflow:'hidden'}}>
            <div className="table-wrap">
              <table>
                <thead><tr>
                  <th style={{paddingLeft:16,whiteSpace:'nowrap'}}>Cliente</th>
                  <th style={{whiteSpace:'nowrap'}}>CUIT</th>
                  <th style={{whiteSpace:'nowrap'}}>Tipo</th>
                  <th className="col-hide-tablet col-hide-mobile" style={{whiteSpace:'nowrap'}}>Servicio</th>
                  <th className="col-hide-tablet col-hide-mobile" style={{whiteSpace:'nowrap'}}>Tributos</th>
                  <th style={{whiteSpace:'nowrap'}}>Honorario</th>
                  <th style={{whiteSpace:'nowrap'}}>Saldo</th>
                  <th className="col-hide-mobile" style={{whiteSpace:'nowrap'}}>Estado</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  {filtered.map(c=>(
                    <tr key={c.id} className="client-row" onClick={()=>openDetail(c)}>
                      <td style={{paddingLeft:16,maxWidth:180,overflow:'hidden'}}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <div style={{width:32,height:32,borderRadius:8,flexShrink:0,background:'linear-gradient(135deg,var(--gold),var(--gold2))',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Playfair Display,serif',fontSize:12,fontWeight:700,color:'var(--black)'}}>{initials(c.nombre)}</div>
                          <div style={{minWidth:0}}>
                            <div className="tbl-cliente-nombre">{c.nombre}</div>
                            {c.email&&<div style={{fontSize:10,color:'var(--gray)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:140}}>{c.email}</div>}
                          </div>
                        </div>
                      </td>
                      <td className="tbl-cuit">{c.cuit||'—'}</td>
                      <td className="tbl-tipo" style={{whiteSpace:'nowrap'}}>
                        <span className={`badge ${c.tipo==='sociedad'?'badge-blue':c.tipo==='responsable_inscripto'?'badge-amber':c.tipo==='monotributista'?'badge-gold':'badge-gray'}`} style={{fontSize:9,whiteSpace:'nowrap'}}>
                          {c.tipo==='sociedad'?'🏢 Soc.':c.tipo==='responsable_inscripto'?'📊 RI':c.tipo==='monotributista'?'📋 Mono':'🔵 Ex.'}
                        </span>
                      </td>
                      <td className="tbl-servicio col-hide-tablet col-hide-mobile">{c.servicio||'—'}</td>
                      <td className="col-hide-tablet col-hide-mobile">{(c.tributos||[]).length>0?<span className="badge badge-blue" style={{fontSize:10}}>{(c.tributos||[]).length} trib.</span>:<span style={{color:'var(--gray2)',fontSize:12}}>—</span>}</td>
                      <td className="tbl-mono" style={{fontWeight:600,color:'var(--gold)'}}>{c.honorario>0?fmtShort(c.honorario):'—'}</td>
                      <td style={{whiteSpace:'nowrap'}}>{c.saldoPendiente>0?<span className="tbl-mono" style={{color:'var(--amber)',fontWeight:700}}>{fmtShort(c.saldoPendiente)}</span>:<span className="badge badge-green" style={{fontSize:10}}>✓</span>}</td>
                      <td className="col-hide-mobile"><span className={`badge ${c.estado==='activo'?'badge-green':c.estado==='prospecto'?'badge-amber':'badge-red'}`} style={{fontSize:10}}>{c.estado}</span></td>
                    <td onClick={e=>e.stopPropagation()}>
                      <div className="action-btns">
                        <button className="btn-icon edit" title="Editar" onClick={e=>{e.stopPropagation();openEdit(c);}}>✏️</button>
                        <button className="btn-icon trash" title="Eliminar" onClick={async e=>{
                          e.stopPropagation();
                          if(!confirm(`¿Eliminar a ${c.nombre}? Esta acción no se puede deshacer.`)) return;
                          try{await FB().deleteDoc(FB().doc(FB().db,'clients',c.id));}catch(er){}
                          setClients(prev=>prev.filter(x=>x.id!==c.id));
                        }}>🗑️</button>
                      </div>
                    </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )
      }
    </div>
  );

  if (view==='detail') return renderDetail();
  if (view==='new'||view==='edit') return renderForm();
  return renderList();
}


// ── COBROS + FACTURACIÓN UNIFICADO ───────────────────
const MEDIOS_PAGO = [
  { id: 'efectivo',      label: 'Efectivo',       icon: '💵', subs: [] },
  { id: 'transferencia', label: 'Transferencia',  icon: '🏦', subs: ['Banco Provincia','Banco Nación','Banco Galicia','Mercado Pago','BBVA','HSBC','Otro banco'] },
  { id: 'cheque',        label: 'Cheque',         icon: '📄', subs: [] },
  { id: 'mp',            label: 'Mercado Pago',   icon: '💙', subs: [] },
];
const NATURALEZAS_COBRO = [
  'Honorarios mensuales','Honorario por consulta','Consultoría puntual',
  'Presentación impositiva','Gestión laboral','Trámite especial',
  'Asesoría extraordinaria','Regularización de deuda','Adelanto',
  'Saldo pendiente','Otro',
];
const MEDIO_LABEL = { efectivo:'💵 Efectivo', transferencia:'🏦 Transferencia', cheque:'📄 Cheque', mp:'💙 Mercado Pago' };

function Cobros({ clients, setClients, facturas, setFacturas, cobros, setCobros }) {
  const now = new Date();
  const mesActualKey = todayStr.slice(0,7);

  // ── Estado ──────────────────────────────────────────
  const [tab,       setTab]       = useState('pendientes'); // 'pendientes' | 'cobrados'
  const [modal,     setModal]     = useState(false);
  const [editItem,  setEditItem]  = useState(null);
  const [cobroCtx,  setCobroCtx]  = useState(null); // factura desde la que se abre el modal
  const [saving,    setSaving]    = useState(false);
  const [collapsed, setCollapsed] = useState(new Set());
  const [form, setForm] = useState({
    clienteId:'', monto:'', naturaleza:'Honorarios mensuales',
    medio:'efectivo', submedio:'', fecha:todayStr, notas:''
  });

  // ── Construir filas: una por cliente activo con honorario ──
  // Fuente de verdad: clients con honorario > 0 (activos)
  // Para cada mes, generar una fila por cliente
  // Estado cobrado: si existe cobro en cobros[] para ese cliente y ese mes

  // Todos los meses conocidos (de facturas + cobros + mes actual)
  const allMeses = [...new Set([
    mesActualKey,
    ...facturas.map(f => (f.fecha||'').slice(0,7)),
    ...cobros.map(c => (c.fecha||'').slice(0,7)),
  ])].filter(Boolean).sort().reverse();

  const activeClients = clients.filter(c => c.estado === 'activo' && (c.honorario||0) > 0);

  // Para un cliente y un mes, buscar si ya tiene cobro registrado
  const getCobrosDelMes = (clienteId, mesKey) =>
    cobros.filter(c => c.clienteId === clienteId && (c.fecha||'').startsWith(mesKey));

  const getFacturasDelMes = (clienteId, mesKey) =>
    facturas.filter(f => (f.clienteId === clienteId || clients.find(c=>c.nombre===f.cliente)?.id === clienteId)
      && (f.fecha||'').startsWith(mesKey));

  // Construir filas por mes
  const buildMesRows = (mesKey) => {
    return activeClients.map(c => {
      const cobrosC  = getCobrosDelMes(c.id, mesKey);
      const facturasC = getFacturasDelMes(c.id, mesKey);
      const montoCobrado = cobrosC.reduce((s,x) => s + (Number(x.monto)||0), 0);
      const honorario    = Number(c.honorario) || 0;
      const saldo        = Math.max(0, honorario - montoCobrado);
      const cobrado      = montoCobrado >= honorario && honorario > 0;
      const parcial      = montoCobrado > 0 && montoCobrado < honorario;
      const medios       = [...new Set(cobrosC.map(x => MEDIO_LABEL[x.medio]||x.medio).filter(Boolean))];
      return {
        clienteId:    c.id,
        clienteNombre:c.nombre,
        honorario,
        montoCobrado,
        saldo,
        cobrado,
        parcial,
        medios,
        cobrosIds:    cobrosC.map(x=>x.id),
        cobrosData:   cobrosC,
        mesKey,
      };
    }).filter(r => r.honorario > 0);
  };

  // Grupos por mes filtrados según tab
  const mesGroups = allMeses.map(m => ({
    key: m,
    rows: buildMesRows(m),
  })).filter(g => {
    if (tab === 'pendientes') return g.rows.some(r => !r.cobrado);
    if (tab === 'cobrados')   return g.rows.some(r => r.cobrado || r.parcial);
    return true;
  });

  // Stats
  const totalPendiente = activeClients.reduce((s,c) => s + Math.max(0, (Number(c.honorario)||0) - getCobrosDelMes(c.id, mesActualKey).reduce((ss,x)=>ss+(Number(x.monto)||0),0)), 0);
  const totalCobradoMes = cobros.filter(c=>(c.fecha||'').startsWith(mesActualKey)).reduce((s,c)=>s+(Number(c.monto)||0),0);
  const totalHistorico  = cobros.reduce((s,c)=>s+(Number(c.monto)||0),0);
  const clientesDeuda   = clients.filter(c=>c.saldoPendiente>0);

  // Toggle mes colapsado
  const toggleMes = (key) => setCollapsed(prev => {
    const n = new Set(prev); n.has(key)?n.delete(key):n.add(key); return n;
  });

  // Abrir modal de cobro desde una fila
  const openCobrar = (row) => {
    setCobroCtx(row);
    setEditItem(null);
    setForm({
      clienteId: row.clienteId,
      monto: row.saldo > 0 ? String(row.saldo) : String(row.honorario),
      naturaleza: 'Honorarios mensuales',
      medio: 'efectivo', submedio: '',
      fecha: todayStr, notas: '',
    });
    setModal(true);
  };

  const openNuevoCobro = () => {
    setCobroCtx(null); setEditItem(null);
    setForm({ clienteId:'', monto:'', naturaleza:'Honorarios mensuales', medio:'efectivo', submedio:'', fecha:todayStr, notas:'' });
    setModal(true);
  };

  const openEditCobro = (cobro) => {
    setCobroCtx(null); setEditItem(cobro);
    setForm({ clienteId:cobro.clienteId||'', monto:cobro.monto||'', naturaleza:cobro.naturaleza||'Honorarios mensuales', medio:cobro.medio||'efectivo', submedio:cobro.submedio||'', fecha:cobro.fecha||todayStr, notas:cobro.notas||'' });
    setModal(true);
  };

  const handleSave = async () => {
    if (!form.clienteId || !form.monto || !form.fecha) return;
    setSaving(true);
    const cliente = clients.find(c=>c.id===form.clienteId);
    const cobro = {
      clienteId: form.clienteId, cliente: cliente?.nombre||'',
      monto: Number(form.monto), naturaleza: form.naturaleza,
      medio: form.medio, submedio: form.submedio||'',
      fecha: form.fecha, notas: form.notas||'', tipo:'ingreso',
    };
    try {
      if (editItem) {
        try { await FB().updateDoc(FB().doc(FB().db,'cobros',editItem.id), cobro); } catch(e){}
        setCobros(prev=>prev.map(x=>x.id===editItem.id?{...cobro,id:editItem.id}:x));
        Swal.fire({ icon:'success', title:'Cobro actualizado', timer:1500, showConfirmButton:false, customClass:{popup:'swal-ap'} });
      } else {
        let saved;
        try {
          const fb = FB();
          const ref = await fb.addDoc(fb.collection(fb.db,'cobros'),{...cobro,createdAt:fb.serverTimestamp()});
          saved = {...cobro, id:ref.id};
        } catch(e) { saved = {...cobro, id:'local-'+Date.now()}; }
        setCobros(prev=>[saved,...prev]);
        if (cliente && Number(form.monto)>0) {
          const newSaldo = Math.max(0,(cliente.saldoPendiente||0)-Number(form.monto));
          try { await FB().updateDoc(FB().doc(FB().db,'clients',form.clienteId),{saldoPendiente:newSaldo}); } catch(e){}
          setClients(prev=>prev.map(c=>c.id===form.clienteId?{...c,saldoPendiente:newSaldo}:c));
        }
        Swal.fire({ icon:'success', title:'💰 Cobro registrado', text:fmt(Number(form.monto))+' · '+cliente?.nombre, timer:1800, showConfirmButton:false, customClass:{popup:'swal-ap'} });
      }
    } finally {
      setSaving(false); setModal(false); setEditItem(null); setCobroCtx(null);
      setForm({clienteId:'',monto:'',naturaleza:'Honorarios mensuales',medio:'efectivo',submedio:'',fecha:todayStr,notas:''});
    }
  };

  const handleDeleteCobro = async (id) => {
    const result = await Swal.fire({ title:'¿Eliminar cobro?', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'cobros',id)); } catch(e){}
    setCobros(prev=>prev.filter(x=>x.id!==id));
  };

  const mesLabel = (key) => {
    const [y,m] = key.split('-');
    return `${MONTHS_FULL[parseInt(m)-1]} ${y}`;
  };

  const selectedClient = clients.find(c=>c.id===form.clienteId);
  const medioActual = MEDIOS_PAGO.find(m=>m.id===form.medio);

  return (
    <div>
      {/* ── HEADER ── */}
      <div className="page-header">
        <div>
          <div className="page-title">Facturación y Cobros</div>
          <div className="page-subtitle">Honorarios mensuales por cliente · mes a mes</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
            cobros.map(c=>({'Fecha':c.fecha,'Cliente':c.cliente,'Concepto':c.naturaleza,'Medio':MEDIO_LABEL[c.medio]||c.medio,'Monto':c.monto,'Notas':c.notas||''})),
            'Cobros'
          )}>📥 Excel</button>
          <button className="btn btn-gold" onClick={openNuevoCobro}>+ Registrar Cobro</button>
        </div>
      </div>

      {/* ── STATS ── */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:20}}>
        <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>setTab('pendientes')}>
          <div className="stat-icon">⏳</div>
          <div className="stat-label">Pendiente este mes</div>
          <div className="stat-value" style={{color:totalPendiente>0?'var(--amber)':'var(--green)'}}>
            {fmtShort(totalPendiente)}
          </div>
          <div className="stat-delta" style={{color:totalPendiente>0?'var(--amber)':'var(--green)'}}>
            {totalPendiente>0?`${clientesDeuda.length} cliente${clientesDeuda.length!==1?'s':''} deben`:'Todo al día ✓'}
          </div>
        </div>
        <div className="stat-card" style={{cursor:'pointer'}} onClick={()=>setTab('cobrados')}>
          <div className="stat-icon">💰</div>
          <div className="stat-label">Cobrado este mes</div>
          <div className="stat-value gold">{fmtShort(totalCobradoMes)}</div>
          <div className="stat-delta up">
            {MONTHS_FULL[now.getMonth()]} {now.getFullYear()}
          </div>
        </div>
        <div className="stat-card">
          <div className="stat-icon">📊</div>
          <div className="stat-label">Total histórico</div>
          <div className="stat-value">{fmtShort(totalHistorico)}</div>
          <div className="stat-delta">{cobros.length} cobros registrados</div>
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{display:'flex',gap:4,background:'var(--cream2)',padding:4,borderRadius:10}}>
          {[
            {v:'pendientes', l:'⏳ Pendientes'},
            {v:'cobrados',   l:'✅ Cobrados'},
            {v:'todos',      l:'📋 Todos'},
          ].map(opt=>(
            <button key={opt.v}
              style={{padding:'8px 18px',borderRadius:7,border:'none',cursor:'pointer',
                fontFamily:'Montserrat,sans-serif',fontSize:13,fontWeight:700,transition:'all 0.15s',
                background:tab===opt.v?'var(--white)':'transparent',
                color:tab===opt.v?'var(--black)':'var(--gray)',
                boxShadow:tab===opt.v?'0 2px 8px rgba(17,17,16,0.08)':'none'}}
              onClick={()=>setTab(opt.v)}>{opt.l}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:6,marginLeft:'auto'}}>
          <button className="btn btn-ghost btn-sm" style={{fontSize:12}}
            onClick={()=>setCollapsed(new Set())}>↕ Expandir todo</button>
          <button className="btn btn-ghost btn-sm" style={{fontSize:12}}
            onClick={()=>setCollapsed(new Set(mesGroups.map(g=>g.key)))}>↕ Colapsar todo</button>
        </div>
      </div>

      {/* ── GRUPOS POR MES ── */}
      {mesGroups.length === 0 ? (

                                : tab==='cobrados'   ? rows.filter(r=>r.cobrado||r.parcial)
                                : rows;
            const totalMesHon   = rows.reduce((s,r)=>s+r.honorario,0);

            const cobradosMes   = rows.filter(r=>r.cobrado).length;

            return (
              <div key={key} className="card" style={{padding:0,overflow:'hidden',
                border: isMesActual ? '1px solid rgba(201,169,110,0.4)' : '1px solid rgba(201,169,110,0.15)'}}>

                      ? 'linear-gradient(135deg,var(--black),var(--black2))'

                    padding:'13px 20px',

                    width:22,height:22,borderRadius:6,flexShrink:0,
                    background: isMesActual?'rgba(201,169,110,0.2)':'rgba(0,0,0,0.06)',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:11,fontWeight:700,
                    color:isMesActual?'var(--gold2)':'var(--gray)',
                    transition:'transform 0.2s',
                    transform:isCollapsed?'rotate(-90deg)':'rotate(0deg)',

                  <div style={{fontFamily:'Playfair Display,serif',fontSize:17,fontWeight:700,
                    color:isMesActual?'var(--gold2)':'var(--black)',flex:1}}>
                    {mesLabel(key)}
                    {isMesActual && (
                      <span style={{marginLeft:10,fontSize:10,fontWeight:600,
                        fontFamily:'JetBrains Mono,monospace',
                        background:'rgba(201,169,110,0.2)',color:'var(--gold2)',
                        padding:'2px 8px',borderRadius:99,verticalAlign:'middle'}}>MES ACTUAL</span>

                  {/* Totales del mes */}
                  <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                    {pendientesMes > 0 && (
                      <span style={{fontSize:11,fontWeight:700,fontFamily:'JetBrains Mono,monospace',
                        background:'rgba(201,124,30,0.12)',color:'var(--amber)',

                    )}

                      <span style={{fontSize:11,fontWeight:700,fontFamily:'JetBrains Mono,monospace',
                        background:'rgba(34,197,94,0.12)',color:'#16a34a',

                {!isCollapsed && (
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                      <thead>

                      <tbody>
                        {rowsVisible.map(r => {
                          const rowBg = r.cobrado
                            ? 'rgba(34,197,94,0.04)'

                                        transition:'all 0.15s',whiteSpace:'nowrap'}}

                            </tr>
                          );
                        })}
                      </tbody>
                      {/* Subtotal del mes */}
                      <tfoot>
                        <tr style={{background:'rgba(201,169,110,0.06)',
                          borderTop:'2px solid rgba(201,169,110,0.2)'}}>
                          <td style={{padding:'9px 14px',fontWeight:700,fontSize:12,
                            color:'var(--gray)',fontFamily:'JetBrains Mono,monospace',
                            textTransform:'uppercase',letterSpacing:'0.5px'}}>
                            Subtotal
                          </td>
                          <td style={{padding:'9px 14px',textAlign:'right',fontFamily:'JetBrains Mono,monospace',
                            fontWeight:700,color:'var(--black)'}}>
                            {fmt(rowsVisible.reduce((s,r)=>s+r.honorario,0))}
                          </td>
                          <td style={{padding:'9px 14px',textAlign:'right',fontFamily:'JetBrains Mono,monospace',
                            fontWeight:700,color:'var(--green)'}}>
                            {fmt(rowsVisible.reduce((s,r)=>s+r.montoCobrado,0))}
                          </td>
                          <td></td>

                            fontWeight:700,color:'var(--amber)'}}>

                  </div>

            );
          })}
        </div>
      )}

      {/* ── MODAL COBRAR ── */}
      {modal && (
        <Modal title={editItem ? '✏️ Editar Cobro' : '💰 Registrar Cobro'}
          onClose={()=>{setModal(false);setEditItem(null);setCobroCtx(null);}} wide
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setModal(false);setEditItem(null);setCobroCtx(null);}}>Cancelar</button>
            <button className="btn btn-gold" onClick={handleSave} disabled={saving||!form.clienteId||!form.monto}>
              {saving?'⏳ Guardando...':editItem?'✓ Guardar Cambios':'✓ Registrar Cobro'}

          </>}>

          {cobroCtx && (
            <div style={{padding:'10px 14px',background:'rgba(201,169,110,0.1)',borderRadius:'var(--r2)',

              <div>
                <div style={{fontWeight:700,color:'var(--black)'}}>{cobroCtx.clienteNombre}</div>
                <div style={{fontSize:12,color:'var(--gray)'}}>
                  Honorario: {fmt(cobroCtx.honorario)} · Saldo pendiente: <strong style={{color:'var(--amber)'}}>{fmt(cobroCtx.saldo)}</strong>
                </div>
              </div>

          )}

          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Cliente *</label>
              <select className="form-select" value={form.clienteId}
                onChange={e=>setForm(f=>({...f,clienteId:e.target.value,monto:clients.find(c=>c.id===e.target.value)?.saldoPendiente||f.monto}))}
                disabled={!!cobroCtx}>
                <option value="">Seleccionar cliente...</option>
                {clients.filter(c=>c.estado==='activo'||c.saldoPendiente>0).map(c=>(
                  <option key={c.id} value={c.id}>{c.nombre}{c.saldoPendiente>0?' — Debe '+fmtShort(c.saldoPendiente):''}</option>
                ))}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Fecha *</label>
              <input className="form-input" type="date" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))} />
            </div>
          </div>

          <div className="form-group">
            <label className="form-label">Naturaleza del cobro</label>
            <select className="form-select" value={form.naturaleza} onChange={e=>setForm(f=>({...f,naturaleza:e.target.value}))}>
              {NATURALEZAS_COBRO.map(n=><option key={n}>{n}</option>)}
            </select>
          </div>

          <div className="form-group">
            <label className="form-label">Monto (ARS) *</label>
            <input className="form-input" type="number" value={form.monto}
              onChange={e=>setForm(f=>({...f,monto:e.target.value}))} placeholder="195000" />
          </div>

          <div className="form-group">
            <label className="form-label">Medio de Pago *</label>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:10}}>
              {MEDIOS_PAGO.map(m=>(
                <div key={m.id} onClick={()=>setForm(f=>({...f,medio:m.id,submedio:''}))}
                  style={{padding:'10px 8px',borderRadius:'var(--r2)',cursor:'pointer',textAlign:'center',
                    transition:'all 0.15s',
                    background:form.medio===m.id?'rgba(201,169,110,0.15)':'var(--cream)',
                    border:form.medio===m.id?'2px solid var(--gold)':'2px solid transparent'}}>
                  <div style={{fontSize:22,marginBottom:4}}>{m.icon}</div>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--black)'}}>{m.label}</div>
                </div>
              ))}
            </div>
            {medioActual?.subs?.length>0 && (
              <select className="form-select" value={form.submedio} onChange={e=>setForm(f=>({...f,submedio:e.target.value}))}>
                <option value="">Seleccionar banco/plataforma...</option>
                {medioActual.subs.map(s=><option key={s}>{s}</option>)}
              </select>
            )}
          </div>

          <div className="form-group">
            <label className="form-label">Notas / Observaciones</label>
            <textarea className="form-textarea" style={{minHeight:60}} value={form.notas}
              onChange={e=>setForm(f=>({...f,notas:e.target.value}))}
              placeholder="Ref. transferencia, comprobante, aclaraciones..." />
          </div>

          {form.clienteId && form.monto && (
            <div style={{padding:'12px 16px',background:'var(--green2)',borderRadius:'var(--r2)',
              border:'1px solid var(--green)',fontSize:13,color:'#065f46'}}>
              ✓ Se registrará un cobro de <strong>{fmt(Number(form.monto))}</strong> para <strong>{selectedClient?.nombre}</strong> por {form.naturaleza}.
              {selectedClient?.saldoPendiente>0 && ` El saldo pendiente quedará en ${fmt(Math.max(0,selectedClient.saldoPendiente-Number(form.monto)))}.`}
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

// ── VENCIMIENTOS — TABLA POR CLIENTE ────────────────
function Vencimientos({ vencimientos, setVencimientos, clients, tareas, setTareas }) {
  const now = new Date();
  const [modal,         setModal]         = useState(null);
  const [form,          setForm]          = useState({});
  const [selVenc,       setSelVenc]       = useState(null);
  const [showImport,    setShowImport]    = useState(false);
  const [tab,           setTab]           = useState('pendientes'); // 'pendientes' | 'presentados'
  const [filterCliente, setFilterCliente] = useState('');
  const [sortCol,       setSortCol]       = useState('dias');
  const [sortDir,       setSortDir]       = useState('asc');

  // ── helpers ─────────────────────────────────────────
  const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
  const ymd = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  // TRIBUTO_KEYWORDS — mismo mapa que antes
  const TRIBUTO_KEYWORDS = [
    { id: 'recat_mono',  words: ['recategori'] },
    { id: 'monotributo', words: ['monotributo'] },
    { id: 'autonomos',   words: ['autónomos', 'autonomos'] },
    { id: 'ganancias',   words: ['ganancias'] },
    { id: 'iibb_cm',     words: ['convenio multilateral', 'multilateral', 'cm0'] },
    { id: 'iibb_anual',  words: ['iibb', 'ingresos brutos'], extra: n => n.includes('anual') },
    { id: 'iibb',        words: ['iibb', 'ingresos brutos'] },
    { id: 'iva',         words: ['iva'] },
    { id: 'f931',        words: ['f.931', 'f931', 'suss', 'siradig', 'f572'] },
    { id: 'bienes_pers', words: ['bienes personales'] },
    { id: 'imp_sellos',  words: ['sellos'] },
    { id: 'imp_inmob',   words: ['inmobiliario'] },
    { id: 'automotores', words: ['automotor', 'patente'] },
    { id: 'sueldos',     words: ['sueldo', 'remuneracion', 'remuneración'] },
  ];
  const getTributoId = (nombre) => {
    const n = (nombre || '').toLowerCase();
    for (const entry of TRIBUTO_KEYWORDS) {
      if (entry.extra && !entry.extra(n)) continue;
      if (entry.words.some(w => n.includes(w))) return entry.id;
    }
    return null;
  };
  const getCuitRange = (nombre) => {
    const m = (nombre || '').match(/CUIT[^0-9]*term[^0-9]*(\d)\s*[-–y]\s*(\d)/i);
    if (!m) return null;
    const from = parseInt(m[1]), to = parseInt(m[2]);
    return Array.from({ length: to - from + 1 }, (_, i) => from + i);
  };
  const getCuitDigit = (cuit) => {
    const limpio = (cuit || '').replace(/[-\s]/g, '');
    if (limpio.length < 2) return NaN;
    return parseInt(limpio[limpio.length - 2]);
  };

  // Dado un vencimiento, devuelve los clientes que aplican
  const getClientesDelVenc = (v) => {
    const tributeId = getTributoId(v.nombre);
    if (!tributeId) return { matched: [], fallbackText: v.clientes || null };
    const cuitRange = getCuitRange(v.nombre);
    const matched = clients.filter(c => {
      if (c.estado === 'inactivo') return false;
      const tiene = Array.isArray(c.tributos) && c.tributos.some(t => t.id === tributeId);
      if (!tiene) return false;
      if (cuitRange) {
        const d = getCuitDigit(c.cuit);
        return !isNaN(d) && cuitRange.includes(d);
      }
      return true;
    });
    return { matched, fallbackText: matched.length === 0 ? (v.clientes || null) : null };
  };

  // ── Construir filas: SOLO vencimientos con clientes dados de alta ──
  // Si un vencimiento no matchea ningún cliente activo con ese tributo, NO aparece
  const buildRows = () => {
    const rows = [];
    vencimientos.forEach(v => {
      const days = daysUntil(v.fecha);
      const { matched } = getClientesDelVenc(v);

      // REGLA: solo mostrar si hay al menos un cliente con ese tributo dado de alta
      if (matched.length === 0) return;

      // Una fila por cada cliente que tenga ese tributo
      matched.forEach(c => {
        rows.push({
          id:             v.id + '-' + c.id,
          vencId:         v.id,
          clienteNombre:  c.nombre,
          clienteId:      c.id,
          tributo:        v.nombre,
          fecha:          v.fecha,
          dias:           days,
          presentado:     v.presentado || false,
          completado:     v.completado || false,
          fechaPresentado:v.fechaPresentado || null,
          prioridad:      v.prioridad || 'media',
          tipo:           v.tipo || 'fiscal',
          notas:          v.notas || '',
        });
      });
    });
    return rows;
  };

  // ── Filtros ──────────────────────────────────────────
  const allRows = buildRows();

  const filteredRows = allRows.filter(r => {
    if (tab === 'pendientes' && r.presentado) return false;
    if (tab === 'presentados' && !r.presentado) return false;
    if (filterCliente && !r.clienteNombre.toLowerCase().includes(filterCliente.toLowerCase())) return false;
    return true;
  });

  // ── Ordenamiento ─────────────────────────────────────
  const sorted = [...filteredRows].sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (sortCol === 'clienteNombre' || sortCol === 'tributo') {
      va = (va||'').toLowerCase(); vb = (vb||'').toLowerCase();
      return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortDir === 'asc' ? va - vb : vb - va;
  });

  const handleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('asc'); }
  };

  // ── Color por urgencia ───────────────────────────────
  const rowColor = (r) => {
    if (r.presentado)  return { bg: 'rgba(34,197,94,0.06)',  border: '3px solid rgba(34,197,94,0.4)',  badge: '#22c55e', badgeTxt: '#fff',          label: '✓ Presentado' };
    if (r.dias < 0)    return { bg: 'rgba(192,57,43,0.08)',  border: '3px solid var(--red)',            badge: 'var(--red)', badgeTxt: '#fff',        label: `Vencido ${Math.abs(r.dias)}d` };
    if (r.dias === 0)  return { bg: 'rgba(201,169,110,0.15)',border: '3px solid var(--gold)',           badge: 'var(--gold)', badgeTxt: '#111',       label: 'HOY' };
    if (r.dias <= 3)   return { bg: 'rgba(239,68,68,0.06)',  border: '3px solid rgba(239,68,68,0.6)',  badge: 'var(--red)', badgeTxt: '#fff',        label: `${r.dias}d` };
    if (r.dias <= 7)   return { bg: 'rgba(201,124,30,0.07)', border: '3px solid var(--amber)',         badge: 'var(--amber)', badgeTxt: '#fff',      label: `${r.dias}d` };
    if (r.dias <= 15)  return { bg: 'rgba(201,169,110,0.05)',border: '3px solid rgba(201,169,110,0.4)',badge: 'var(--gold2)', badgeTxt: '#111',      label: `${r.dias}d` };
    return               { bg: 'transparent',                border: '3px solid transparent',         badge: 'var(--cream2)', badgeTxt: 'var(--gray)', label: `${r.dias}d` };
  };

  // ── Estadísticas rápidas ─────────────────────────────
  const stats = {
    vencidos:    allRows.filter(r => !r.presentado && r.dias < 0).length,
    hoy:         allRows.filter(r => !r.presentado && r.dias === 0).length,
    urgentes:    allRows.filter(r => !r.presentado && r.dias > 0 && r.dias <= 3).length,
    semana:      allRows.filter(r => !r.presentado && r.dias > 0 && r.dias <= 7).length,
    pendientes:  allRows.filter(r => !r.presentado).length,
    presentados: allRows.filter(r => r.presentado).length,
  };

  // ── Marcar como presentado / deshacer ────────────────
  const marcarPresentado = async (vencId, valor) => {
    const payload = {
      presentado: valor,
      fechaPresentado: valor ? todayStr : null,
      completado: valor,
    };
    try { await FB().updateDoc(FB().doc(FB().db,'vencimientos',vencId), payload); } catch(e) {}
    setVencimientos(prev => prev.map(x => x.id === vencId ? {...x, ...payload} : x));
    if (valor) {
      Swal.fire({ icon:'success', title:'¡Presentado!',
        text:'El vencimiento fue marcado como presentado.',
        timer:1800, showConfirmButton:false, customClass:{popup:'swal-ap'} });
    }
  };

  const handleDelete = async (vencId) => {
    const result = await Swal.fire({
      title: '¿Eliminar vencimiento?', icon: 'warning',
      showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar',
      customClass: {popup:'swal-ap'}, reverseButtons: true
    });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'vencimientos',vencId)); } catch(e) {}
    setVencimientos(prev => prev.filter(x => x.id !== vencId));
  };

  const openNew  = () => { setSelVenc(null); setForm({tipo:'fiscal',prioridad:'media'}); setModal('form'); };
  const openEdit = (v) => { setSelVenc(v); setForm({...v}); setModal('form'); };

  const buildFechas = (f) => {
    const per = f.periodicidad || 'puntual';
    const now2 = new Date();
    if (per === 'puntual') return f.fecha ? [f.fecha] : [];
    if (per === 'anual') {
      if (!f.fecha) return [];
      const base = new Date(f.fecha + 'T12:00:00');
      return Array.from({length:5},(_,i) => {
        const d = new Date(base); d.setFullYear(base.getFullYear()+i);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      });
    }
    const dia = parseInt(f.diaMes) || 20;
    const step = per==='bimestral'?2 : per==='trimestral'?3 : 1;
    const months = per==='trimestral'?4 : per==='bimestral'?6 : 12;
    const dates = [];
    for (let i = 0; i < months; i += step) {
      const yr  = now2.getMonth()+i > 11 ? now2.getFullYear()+Math.floor((now2.getMonth()+i)/12) : now2.getFullYear();
      const mon = (now2.getMonth()+i)%12;
      const maxD = new Date(yr, mon+1, 0).getDate();
      dates.push(`${yr}-${String(mon+1).padStart(2,'0')}-${String(Math.min(dia,maxD)).padStart(2,'0')}`);
    }
    return dates;
  };

  const handleSave = async () => {
    if (!form.nombre) return;
    const per = form.periodicidad || 'puntual';
    if ((per==='puntual'||per==='anual') && !form.fecha) return;
    if ((per==='mensual'||per==='bimestral'||per==='trimestral') && !form.diaMes) return;

    if (selVenc) {
      const payload = {...form, completado: selVenc.completado};
      try { await FB().updateDoc(FB().doc(FB().db,'vencimientos',selVenc.id), payload); } catch(e) {}
      setVencimientos(prev => prev.map(x => x.id===selVenc.id ? {...payload,id:selVenc.id} : x));
    } else {
      const fechas = buildFechas(form);
      if (!fechas.length) return;
      const base = { nombre:form.nombre, tipo:form.tipo||'fiscal', clientes:form.clientes||'',
        prioridad:form.prioridad||'media', completado:false, periodicidad:per, notas:form.notas||'' };
      const newVenc = [];
      for (const fecha of fechas) {
        const v = {...base, fecha};
        try {
          const ref = await FB().addDoc(FB().collection(FB().db,'vencimientos'),{...v,createdAt:FB().serverTimestamp()});
          newVenc.push({...v, id:ref.id});
        } catch(e) { newVenc.push({...v, id:'local-'+Date.now()+Math.random()}); }
      }
      setVencimientos(prev => [...prev, ...newVenc]);
    }
    setModal(null); setSelVenc(null);
  };

  const SortIcon = ({col}) => sortCol===col
    ? <span style={{marginLeft:4,color:'var(--gold)',fontSize:10}}>{sortDir==='asc'?'▲':'▼'}</span>
    : <span style={{marginLeft:4,color:'var(--cream2)',fontSize:10}}>⇅</span>;

  const pendientesMuyUrgentes = allRows.filter(r => !r.presentado && r.dias >= 0 && r.dias <= 7);

  // ── Agrupar filas por mes (YYYY-MM) ─────────────────
  const groupByMonth = (rows) => {
    const map = {};
    rows.forEach(r => {
      const key = r.fecha ? r.fecha.slice(0,7) : 'sin-fecha';
      if (!map[key]) map[key] = [];
      map[key].push(r);
    });
    // Ordenar meses cronológicamente
    return Object.entries(map).sort(([a],[b]) => a.localeCompare(b));
  };

  const monthGroups = groupByMonth(sorted);

  // Meses colapsados — por defecto todos abiertos excepto los pasados en tab presentados
  const defaultCollapsed = () => {
    const s = new Set();
    if (tab === 'presentados') {
      const currentYM = todayStr.slice(0,7);
      monthGroups.forEach(([key]) => { if (key < currentYM) s.add(key); });
    }
    return s;
  };
  const [collapsedMonths, setCollapsedMonths] = useState(() => defaultCollapsed());

  // Reset collapsed cuando cambia el tab
  React.useEffect(() => {
    setCollapsedMonths(defaultCollapsed());
  }, [tab]);

  const toggleMonth = (key) => {
    setCollapsedMonths(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  };

  const monthLabel = (key) => {
    if (key === 'sin-fecha') return 'Sin fecha';
    const [y, m] = key.split('-');
    return `${MONTHS_FULL[parseInt(m)-1]} ${y}`;
  };

  // Color del header del mes según urgencia de las filas
  const monthHeaderColor = (rows) => {
    if (rows.every(r => r.presentado)) return { bg:'rgba(34,197,94,0.08)', accent:'#22c55e', label:'Completo' };
    if (rows.some(r => !r.presentado && r.dias < 0))  return { bg:'rgba(192,57,43,0.08)', accent:'var(--red)',   label:'Con vencidos' };
    if (rows.some(r => !r.presentado && r.dias <= 7))  return { bg:'rgba(201,124,30,0.08)', accent:'var(--amber)', label:'Urgente' };
    return { bg:'rgba(201,169,110,0.06)', accent:'var(--gold)', label:null };
  };

  const colCount = tab === 'presentados' ? 6 : 5;

  const TableRow = ({r}) => {
    const c = rowColor(r);
    return (
      <tr key={r.id} style={{borderBottom:'1px solid var(--cream2)',borderLeft:c.border,
        background:c.bg, opacity:r.presentado?0.75:1, transition:'background 0.15s'}}>

        <td style={{padding:'10px 14px',fontWeight:600,color:'var(--black)',
          maxWidth:170,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {r.clienteNombre}
        </td>

        <td style={{padding:'10px 14px',color:'var(--black)',
          maxWidth:230,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          <span style={{fontSize:10,padding:'2px 6px',borderRadius:4,marginRight:6,
            background:'rgba(201,169,110,0.15)',color:'var(--gold)',fontWeight:700,
            fontFamily:'JetBrains Mono,monospace',textTransform:'uppercase'}}>
            {(r.tipo||'fisc').slice(0,4)}
          </span>
          {r.tributo}
        </td>

        <td style={{padding:'10px 14px'}}>
          <span style={{display:'inline-block',minWidth:58,textAlign:'center',
            padding:'4px 10px',borderRadius:20,fontWeight:700,fontSize:12,
            fontFamily:'JetBrains Mono,monospace',background:c.badge,color:c.badgeTxt}}>
            {c.label}
          </span>
        </td>

        <td style={{padding:'10px 14px',fontFamily:'JetBrains Mono,monospace',
          fontSize:12,color:'var(--gray)',whiteSpace:'nowrap'}}>
          {fmtDate(r.fecha)}
        </td>

        {tab === 'presentados' && (
          <td style={{padding:'10px 14px',fontFamily:'JetBrains Mono,monospace',
            fontSize:12,color:'var(--green)',whiteSpace:'nowrap',fontWeight:600}}>
            {r.fechaPresentado ? fmtDate(r.fechaPresentado) : '—'}
          </td>
        )}

        <td style={{padding:'10px 16px 10px 10px'}}>
          <div className="action-btns" style={{justifyContent:'flex-end'}}>
            {!r.presentado ? (
              <button onClick={()=>marcarPresentado(r.vencId, true)}
                style={{display:'inline-flex',alignItems:'center',gap:4,padding:'4px 10px',
                  borderRadius:7,border:'none',cursor:'pointer',fontFamily:'Montserrat,sans-serif',
                  fontSize:11,fontWeight:700,background:'rgba(34,197,94,0.15)',color:'#16a34a',
                  transition:'all 0.15s',whiteSpace:'nowrap'}}
                onMouseOver={e=>e.currentTarget.style.background='rgba(34,197,94,0.28)'}
                onMouseOut={e=>e.currentTarget.style.background='rgba(34,197,94,0.15)'}>
                ✅ Presentar
              </button>
            ) : (
              <button onClick={()=>marcarPresentado(r.vencId, false)}
                style={{display:'inline-flex',alignItems:'center',gap:4,padding:'4px 9px',
                  borderRadius:7,border:'none',cursor:'pointer',fontFamily:'Montserrat,sans-serif',
                  fontSize:11,fontWeight:600,background:'rgba(107,114,128,0.1)',color:'var(--gray)',
                  transition:'all 0.15s',whiteSpace:'nowrap'}}>
                ↩ Deshacer
              </button>
            )}
            <button className="btn-icon edit" title="Editar"
              onClick={()=>openEdit(vencimientos.find(x=>x.id===r.vencId))}>✏️</button>
            <button className="btn-icon trash" title="Eliminar"
              onClick={()=>handleDelete(r.vencId)}>🗑️</button>
          </div>
        </td>
      </tr>
    );
  };

  return (
    <div>
      {/* ── HEADER ── */}
      <div className="page-header">
        <div>
          <div className="page-title">Vencimientos</div>
          <div className="page-subtitle">{stats.pendientes} pendiente{stats.pendientes!==1?'s':''} · {stats.presentados} presentado{stats.presentados!==1?'s':''}</div>
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
            sorted.map(r=>({'Cliente':r.clienteNombre,'Tributo':r.tributo,'Días':r.dias,'Fecha':r.fecha,'Estado':r.presentado?'Presentado':'Pendiente','Fecha Presentado':r.fechaPresentado||''})),
            'Vencimientos'
          )}>📥 Excel</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowImport(true)}>📋 Importar</button>
          <button className="btn btn-gold" onClick={openNew}>+ Nuevo</button>
        </div>
      </div>

      {/* ── STATS RÁPIDAS ── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:20}}>
        {[
          {label:'Vencidos',    val:stats.vencidos,   color:'var(--red)',   icon:'🔴', t:'pendientes'},
          {label:'Hoy',         val:stats.hoy,         color:'var(--gold)',  icon:'🟡', t:'pendientes'},
          {label:'≤ 3 días',    val:stats.urgentes,   color:'var(--red)',   icon:'⚠️', t:'pendientes'},
          {label:'Esta semana', val:stats.semana,      color:'var(--amber)', icon:'📅', t:'pendientes'},
          {label:'Presentados', val:stats.presentados, color:'var(--green)', icon:'✅', t:'presentados'},
        ].map(s => (
          <div key={s.label} className="card"
            style={{padding:'14px 16px',textAlign:'center',cursor:'pointer',
              border:`1px solid ${s.color}25`,transition:'all 0.2s'}}
            onClick={()=>setTab(s.t)}>
            <div style={{fontSize:22,marginBottom:4}}>{s.icon}</div>
            <div style={{fontFamily:'Playfair Display,serif',fontSize:24,fontWeight:700,color:s.color,lineHeight:1}}>{s.val}</div>
            <div style={{fontSize:11,color:'var(--gray)',marginTop:4,fontWeight:500}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* ── ALERTA URGENTE ── */}
      {tab === 'pendientes' && pendientesMuyUrgentes.length > 0 && (
        <div style={{background:'linear-gradient(135deg,var(--black),var(--black2))',borderRadius:'var(--r)',
          padding:'14px 20px',marginBottom:20,display:'flex',alignItems:'center',gap:14,
          border:'1px solid rgba(239,68,68,0.4)'}}>
          <div style={{fontSize:24,flexShrink:0}}>🚨</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,color:'var(--red)',fontSize:14}}>
              {pendientesMuyUrgentes.length} vencimiento{pendientesMuyUrgentes.length!==1?'s':''} en los próximos 7 días
            </div>
            <div style={{fontSize:12,color:'rgba(250,248,243,0.6)',marginTop:3}}>
              {[...new Map(pendientesMuyUrgentes.map(r=>[r.vencId,r])).values()].slice(0,4)
                .map(r=>`${r.clienteNombre} · ${r.tributo} (${r.dias===0?'HOY':r.dias<0?'VENCIDO':r.dias+'d'})`).join('  |  ')}
              {pendientesMuyUrgentes.length > 4 && ` y más...`}
            </div>
          </div>
        </div>
      )}

      {/* ── TABS + FILTROS ── */}
      <div style={{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{display:'flex',gap:4,background:'var(--cream2)',padding:4,borderRadius:10}}>
          {[
            {v:'pendientes', l:'📋 Pendientes', count:stats.pendientes, countColor:'var(--red)'},
            {v:'presentados',l:'✅ Presentados', count:stats.presentados, countColor:'#22c55e'},
          ].map(opt => (
            <button key={opt.v}
              style={{padding:'8px 20px',borderRadius:7,border:'none',cursor:'pointer',
                fontFamily:'Montserrat,sans-serif',fontSize:13,fontWeight:700,transition:'all 0.15s',
                background:tab===opt.v?'var(--white)':'transparent',
                color:tab===opt.v?'var(--black)':'var(--gray)',
                boxShadow:tab===opt.v?'0 2px 8px rgba(17,17,16,0.08)':'none'}}
              onClick={()=>setTab(opt.v)}>
              {opt.l}
              {opt.count > 0 && (
                <span style={{marginLeft:7,background:opt.countColor,color:'#fff',
                  fontSize:10,fontFamily:'JetBrains Mono,monospace',padding:'1px 6px',
                  borderRadius:99,fontWeight:700}}>{opt.count}</span>
              )}
            </button>
          ))}
        </div>

        <div className="search-wrap" style={{flex:1,maxWidth:260}}>
          <span className="search-icon">🔍</span>
          <input className="search-input" placeholder="Buscar cliente..."
            value={filterCliente} onChange={e=>setFilterCliente(e.target.value)} />
        </div>

        <div style={{display:'flex',gap:6,marginLeft:'auto'}}>
          <button className="btn btn-ghost btn-sm"
            onClick={()=>setCollapsedMonths(new Set())}
            title="Expandir todos los meses" style={{fontSize:12}}>
            ↕ Expandir todo
          </button>
          <button className="btn btn-ghost btn-sm"
            onClick={()=>setCollapsedMonths(new Set(monthGroups.map(([k])=>k)))}
            title="Colapsar todos los meses" style={{fontSize:12}}>
            ↕ Colapsar todo
          </button>
        </div>
      </div>

      {/* ── GRUPOS POR MES ── */}
      {sorted.length === 0 ? (
        <div className="card" style={{padding:'60px 20px',textAlign:'center',color:'var(--gray2)'}}>
          <div style={{fontSize:40,marginBottom:12}}>{tab==='presentados'?'✅':'📅'}</div>
          <div style={{fontSize:14}}>
            {tab==='presentados' ? 'Todavía no hay vencimientos presentados' : 'No hay vencimientos pendientes'}
          </div>
          {tab==='pendientes' && (
            <div style={{fontSize:12,color:'var(--gray2)',marginTop:6}}>
              Solo aparecen vencimientos cuyos tributos están dados de alta en al menos un cliente activo
            </div>
          )}
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {monthGroups.map(([key, rows]) => {
            const isCollapsed = collapsedMonths.has(key);
            const mh = monthHeaderColor(rows);
            const pendientesEnMes = rows.filter(r => !r.presentado).length;
            const presentadosEnMes = rows.filter(r => r.presentado).length;
            const isMesCurrent = key === todayStr.slice(0,7);
            const isMesPast    = key < todayStr.slice(0,7);

            return (
              <div key={key} className="card" style={{padding:0,overflow:'hidden',
                border:`1px solid ${mh.accent}30`}}>

                {/* ── Header del mes (clickeable para colapsar) ── */}
                <div onClick={()=>toggleMonth(key)}
                  style={{
                    background: isMesCurrent
                      ? 'linear-gradient(135deg,var(--black),var(--black2))'
                      : mh.bg,
                    padding:'13px 20px',
                    display:'flex',alignItems:'center',gap:12,
                    cursor:'pointer',userSelect:'none',
                    borderBottom: isCollapsed ? 'none' : `1px solid ${mh.accent}25`,
                    transition:'background 0.15s',
                  }}>

                  {/* Flecha colapsar */}
                  <div style={{
                    width:22,height:22,borderRadius:6,
                    background: isMesCurrent ? 'rgba(201,169,110,0.2)' : 'rgba(0,0,0,0.06)',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:11,fontWeight:700,flexShrink:0,
                    color: isMesCurrent ? 'var(--gold2)' : mh.accent,
                    transition:'transform 0.2s',
                    transform: isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)',
                  }}>▼</div>

                  {/* Nombre del mes */}
                  <div style={{fontFamily:'Playfair Display,serif',fontSize:17,fontWeight:700,
                    color: isMesCurrent ? 'var(--gold2)' : 'var(--black)',flex:1}}>
                    {monthLabel(key)}
                    {isMesCurrent && (
                      <span style={{marginLeft:10,fontSize:10,fontWeight:600,
                        fontFamily:'JetBrains Mono,monospace',
                        background:'rgba(201,169,110,0.2)',color:'var(--gold2)',
                        padding:'2px 8px',borderRadius:99,verticalAlign:'middle'}}>
                        MES ACTUAL
                      </span>
                    )}
                    {isMesPast && tab==='pendientes' && pendientesEnMes > 0 && (
                      <span style={{marginLeft:10,fontSize:10,fontWeight:600,
                        fontFamily:'JetBrains Mono,monospace',
                        background:'rgba(192,57,43,0.15)',color:'var(--red)',
                        padding:'2px 8px',borderRadius:99,verticalAlign:'middle'}}>
                        VENCIDO
                      </span>
                    )}
                  </div>

                  {/* Contadores */}
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    {tab === 'pendientes' && pendientesEnMes > 0 && (
                      <span style={{fontSize:11,fontWeight:700,
                        fontFamily:'JetBrains Mono,monospace',
                        background:'rgba(192,57,43,0.12)',color:'var(--red)',
                        padding:'3px 10px',borderRadius:99}}>
                        {pendientesEnMes} pendiente{pendientesEnMes!==1?'s':''}
                      </span>
                    )}
                    {presentadosEnMes > 0 && (
                      <span style={{fontSize:11,fontWeight:700,
                        fontFamily:'JetBrains Mono,monospace',
                        background:'rgba(34,197,94,0.12)',color:'#16a34a',
                        padding:'3px 10px',borderRadius:99}}>
                        ✓ {presentadosEnMes}
                      </span>
                    )}
                    <span style={{fontSize:11,color:isMesCurrent?'rgba(250,248,243,0.5)':'var(--gray2)',
                      fontFamily:'JetBrains Mono,monospace'}}>
                      {rows.length} total
                    </span>
                  </div>
                </div>

                {/* ── Tabla del mes (se oculta si colapsado) ── */}
                {!isCollapsed && (
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                      <thead>
                        <tr style={{background:'rgba(201,169,110,0.06)',
                          borderBottom:'1px solid rgba(201,169,110,0.15)'}}>
                          {[
                            {col:'clienteNombre', label:'Cliente'},
                            {col:'tributo',       label:'Tributo / Descripción'},
                            {col:'dias',          label:'Días'},
                            {col:'fecha',         label:'Fecha venc.'},
                            ...(tab==='presentados' ? [{col:'fechaPresentado', label:'Presentado el'}] : []),
                          ].map(h => (
                            <th key={h.col} onClick={()=>handleSort(h.col)}
                              style={{padding:'9px 14px',textAlign:'left',
                                color:'var(--gray)',fontWeight:700,fontSize:11,
                                fontFamily:'JetBrains Mono,monospace',
                                cursor:'pointer',userSelect:'none',whiteSpace:'nowrap',
                                letterSpacing:'0.3px',textTransform:'uppercase'}}>
                              {h.label}<SortIcon col={h.col}/>
                            </th>
                          ))}
                          <th style={{padding:'9px 14px',textAlign:'right',
                            color:'var(--gray)',fontSize:11,
                            fontFamily:'JetBrains Mono,monospace',
                            textTransform:'uppercase',letterSpacing:'0.3px'}}>
                            Acciones
                          </th>
                        </tr>
                      </thead>
                      <tbody>
                        {rows.map(r => <TableRow key={r.id} r={r} />)}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Leyenda */}
      {tab === 'pendientes' && sorted.length > 0 && (
        <div style={{display:'flex',gap:16,flexWrap:'wrap',marginTop:14,paddingLeft:4}}>
          {[['var(--red)','Vencido / ≤ 3 días'],['var(--amber)','4–7 días'],['var(--gold2)','8–15 días']].map(([color,label]) => (
            <div key={label} style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--gray)'}}>
              <div style={{width:10,height:10,borderRadius:2,background:color,flexShrink:0}} />
              {label}
            </div>
          ))}
        </div>
      )}

      {/* ── MODAL FORMULARIO ── */}
      {modal === 'form' && (
        <Modal title={selVenc ? '✏️ Editar Vencimiento' : '📅 Nuevo Vencimiento'}
          onClose={()=>{setModal(null);setSelVenc(null);}}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setModal(null);setSelVenc(null);}}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={handleSave}>Guardar</button>
          </>}>

          <div className="form-group">
            <label className="form-label">Descripción *</label>
            <input className="form-input" value={form.nombre||''}
              onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}
              placeholder="Ej: IIBB Mensual, IVA, Monotributo..." autoFocus />
          </div>

          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Tipo</label>
              <select className="form-select" value={form.tipo||'fiscal'}
                onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                <option value="fiscal">Fiscal / Impositivo</option>
                <option value="laboral">Laboral</option>
                <option value="societario">Societario</option>

            <div className="form-group">
              <label className="form-label">Prioridad</label>

                <option value="media">🟡 Media</option>
                <option value="baja">🟢 Baja</option>
              </select>
            </div>
          </div>

          <div className="form-group">
            <label className="form-label">Cliente(s)</label>
            <select className="form-select" value={form.clientes||''}
              onChange={e=>setForm(f=>({...f,clientes:e.target.value}))}>
              <option value="">Todos / General</option>
              <option value="Todos los monotributistas">Todos los monotributistas</option>
              {clients.map(c=><option key={c.id} value={c.nombre}>{c.nombre}</option>)}
            </select>
          </div>

          <div className="form-group">
            <label className="form-label">Recurrencia</label>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:12}}>
              {[
                {v:'puntual',    l:'📌 Puntual',    d:'Fecha exacta'},
                {v:'mensual',    l:'📆 Mensual',     d:'Mismo día c/mes'},
                {v:'bimestral',  l:'📅 Bimestral',   d:'Cada 2 meses'},

                    background:(form.periodicidad||'puntual')===opt.v?'rgba(201,169,110,0.18)':'var(--cream)',

          {(!form.periodicidad||form.periodicidad==='puntual'||form.periodicidad==='anual') && (
            <div className="form-group">
              <label className="form-label">Fecha *</label>

              <label className="form-label">Día del mes (1–31)</label>
              <input className="form-input" type="number" min="1" max="31" value={form.diaMes||''}
                onChange={e=>setForm(f=>({...f,diaMes:e.target.value}))}

          <div className="form-group">
            <label className="form-label">Notas</label>
            <textarea className="form-textarea" value={form.notas||''}

              placeholder="Observaciones..." style={{minHeight:60}} />

      {/* ── IMPORTAR ── */}

        <ImportarVencimientos
          vencimientos={vencimientos}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="logoBlack2.ico" />
  <title>Aragón Paz · Estudio Contable</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* ── SweetAlert2 custom theme — Aragón Paz palette ── */
    .swal-ap { font-family: 'Montserrat', sans-serif !important; border-radius: 16px !important; }
    .swal2-popup.swal-ap { background: #faf8f3 !important; border: 1px solid rgba(201,169,110,0.25) !important; box-shadow: 0 20px 60px rgba(17,17,16,0.18) !important; }

    .swal2-popup.swal-ap .swal2-html-container { color: #666 !important; font-size: 0.9rem !important; }
    .swal2-popup.swal-ap .swal2-confirm { background: #c9a96e !important; border-radius: 8px !important; font-weight: 600 !important; font-family: 'Montserrat',sans-serif !important; color: #fff !important; }
    .swal2-popup.swal-ap .swal2-confirm:hover { background: #b8955a !important; }
    .swal2-popup.swal-ap .swal2-cancel { background: #f0ede6 !important; border-radius: 8px !important; font-weight: 600 !important; font-family: 'Montserrat',sans-serif !important; color: #111110 !important; }
    .swal2-popup.swal-ap .swal2-icon.swal2-success { border-color: #22c55e !important; }
    .swal2-popup.swal-ap .swal2-icon.swal2-success [class^=swal2-success-line] { background: #22c55e !important; }
    .swal2-popup.swal-ap .swal2-icon.swal2-error { border-color: #ef4444 !important; }
    .swal2-popup.swal-ap .swal2-icon.swal2-warning { border-color: #c9a96e !important; color: #c9a96e !important; }
    .swal2-popup.swal-ap .swal2-icon.swal2-question { border-color: #c9a96e !important; color: #c9a96e !important; }
    .swal2-timer-progress-bar { background: #c9a96e !important; }
    .swal2-toast.swal-ap-toast { font-family: 'Montserrat', sans-serif !important; background: #111110 !important; color: #e2c48a !important; border-radius: 10px !important; }
    .swal2-toast.swal-ap-toast .swal2-title { color: #e2c48a !important; }
  </style>

    // 🔥 Estudio Contable Aragón Paz — Firebase Config
    const firebaseConfig = {
      apiKey:            "AIzaSyA8-tNN8_9p_Gu3W4qnKzT17OstQ8IC0zs",
      authDomain:        "estudioaragonpaz.firebaseapp.com",
      projectId:         "estudioaragonpaz",
      storageBucket:     "estudioaragonpaz.firebasestorage.app",

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #111110;
      --black2:   #1c1c1a;
      --black3:   #2a2a28;
      --gold:     #c9a96e;
      --gold2:    #e2c48a;
      --gold3:    #f0ddb8;
      --cream:    #faf8f3;
      --cream2:   #f2ede3;
      --white:    #ffffff;
      --green:    #2d9a6b;
      --green2:   #d1f0e4;
      --red:      #c0392b;
      --red2:     #fde8e8;
      --amber:    #c97c1e;
      --amber2:   #fef3d8;
      --blue:     #2563eb;
      --blue2:    #dbeafe;
      --gray:     #6b6b66;
      --gray2:    #9b9b96;
      --border:   rgba(201,169,110,0.2);
      --shadow:   0 4px 24px rgba(17,17,16,0.08);
      --shadow2:  0 12px 48px rgba(17,17,16,0.14);
      --r:        12px;
      --r2:       8px;
      --sidebar:  260px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      color: var(--black);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── SCROLLBAR ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--cream2); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

    /* ── LOGIN SCREEN ─────────────────────────────── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      position: relative;
      overflow: hidden;
    }
    .login-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 50%, rgba(201,169,110,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 80% 20%, rgba(201,169,110,0.05) 0%, transparent 70%);
    }
    .login-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(28,28,26,0.92);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 24px;
      padding: 64px 56px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(201,169,110,0.15);
    }
    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 900;
      color: var(--black);
      box-shadow: 0 8px 24px rgba(201,169,110,0.3);
    }
    .login-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold2);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .login-sub {
      font-size: 14px;
      color: var(--gray2);
      margin-bottom: 40px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .btn-google {
      width: 100%;
      padding: 16px 24px;
      background: var(--white);
      border: none;
      border-radius: var(--r);
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--black);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .btn-google:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .btn-google svg { width: 20px; height: 20px; }
    .login-footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(155,155,150,0.6);
    }

    /* ── LAYOUT ────────────────────────────────────── */
    html, body { height: 100%; margin: 0; padding: 0; }
    #root { height: 100%; }
    .app-layout {
      display: flex;
      min-height: 100vh;
      background: var(--cream);
    }

    /* ── SIDEBAR ───────────────────────────────────── */
    .sidebar {
      width: var(--sidebar);
      background: var(--black);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(201,169,110,0.12);
      z-index: 200;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar-header {
      padding: 28px 20px 24px;
      border-bottom: 1px solid rgba(201,169,110,0.12);
    }
    .sidebar-brand {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold2);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }
    .sidebar-brand-sub {
      font-size: 10px;
      color: var(--gray2);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
    }
    .nav-section-label {
      font-size: 10px;
      color: rgba(155,155,150,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 8px;
      margin: 16px 0 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: var(--r2);
      cursor: pointer;
      transition: all 0.18s;
      color: rgba(250,248,243,0.55);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
      border: 1px solid transparent;
      font-family: 'Montserrat', sans-serif;
    }
    .nav-item:hover { background: rgba(201,169,110,0.08); color: var(--gold3); }
    .nav-item.active {
      background: rgba(201,169,110,0.14);
      color: var(--gold2);
      border-color: rgba(201,169,110,0.2);
    }
    .nav-item .nav-icon { font-size: 16px; flex-shrink: 0; }
    .nav-badge {
      margin-left: auto;
      background: var(--red);
      color: white;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 700;
    }
    .nav-badge.amber { background: var(--amber); }
    .sidebar-user {
      padding: 16px 20px;
      border-top: 1px solid rgba(201,169,110,0.12);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--black);
      flex-shrink: 0;
      overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-name { font-size: 13px; color: var(--gold3); font-weight: 600; }
    .user-role { font-size: 11px; color: var(--gray2); }
    .btn-logout {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray2);
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s;
    }
    .btn-logout:hover { color: var(--red); }

    /* ── MAIN CONTENT ──────────────────────────────── */
    .main {
      margin-left: var(--sidebar);
      transition: margin-left 0.25s cubic-bezier(.4,0,.2,1);
      flex: 1;
      padding: 32px 36px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: margin-left 0.25s cubic-bezier(.4,0,.2,1);
    }
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .page-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--black);
      letter-spacing: -0.8px;
      line-height: 1;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--gray);
      margin-top: 6px;
    }
    .page-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--gray2);
      text-align: right;
    }

    /* ── CARDS ─────────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--r);
      border: 1px solid rgba(201,169,110,0.12);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title span { font-size: 18px; }

    /* ── STAT CARDS ────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--r);
      border: 1px solid rgba(201,169,110,0.12);
      padding: 20px 22px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      cursor: default;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow2); }
    .stat-label { font-size: 11px; color: var(--gray2); letter-spacing: 1.5px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 8px; }
    .stat-value { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 700; color: var(--black); letter-spacing: -0.5px; }
    .stat-value.gold { color: var(--gold); }
    .stat-delta { font-size: 12px; color: var(--gray); margin-top: 4px; }
    .stat-delta.up { color: var(--green); }
    .stat-delta.down { color: var(--red); }
    .stat-icon { font-size: 24px; margin-bottom: 10px; }

    /* ── GRID LAYOUTS ──────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-6040 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }

    /* ── TABLE ─────────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: var(--r2); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: var(--cream2); }
    th {
      padding: 12px 14px;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gray);
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--cream2);
      font-weight: 500;
    }
    td { padding: 13px 14px; border-bottom: 1px solid var(--cream2); color: var(--black); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--cream); transition: background 0.15s; }

    /* ── BADGES ────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.3px;
    }
    .badge-green { background: var(--green2); color: #186344; }
    .badge-red { background: var(--red2); color: #991b1b; }
    .badge-amber { background: var(--amber2); color: #92400e; }
    .badge-blue { background: var(--blue2); color: #1e40af; }
    .badge-gray { background: var(--cream2); color: var(--gray); }
    .badge-gold { background: rgba(201,169,110,0.15); color: var(--amber); }

    /* ── BUTTONS ───────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border-radius: var(--r2);
      font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--black); color: var(--gold2);
      border: 1px solid rgba(201,169,110,0.2);
    }
    .btn-primary:hover { background: var(--black2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(17,17,16,0.2); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--black); font-weight: 700;
    }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,169,110,0.35); }
    .btn-ghost {
      background: transparent; color: var(--gray);
      border: 1px solid var(--cream2);
    }
    .btn-ghost:hover { background: var(--cream2); color: var(--black); }
    .btn-danger {
      background: var(--red2); color: var(--red);
      border: 1px solid rgba(192,57,43,0.15);
    }
    .btn-danger:hover { background: #fbd5d5; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-icon { padding: 8px; width: 34px; height: 34px; justify-content: center; }

    /* ── FORMS ─────────────────────────────────────── */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--gray); margin-bottom: 6px;
      letter-spacing: 0.5px; text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 14px;
      background: var(--cream);
      border: 1.5px solid rgba(201,169,110,0.2);
      border-radius: var(--r2);
      font-family: 'Montserrat', sans-serif; font-size: 14px;
      color: var(--black); transition: all 0.18s;
      outline: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(201,169,110,0.12);
    }
    .form-textarea { resize: vertical; min-height: 90px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* ── MODAL ─────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(17,17,16,0.6);
      backdrop-filter: blur(4px);
      z-index: 200; display: flex;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--white);
      border-radius: 20px;
      border: 1px solid rgba(201,169,110,0.15);
      width: 100%; max-width: 640px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 24px 80px rgba(17,17,16,0.25);
    }
    .modal-header {
      padding: 24px 28px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px; font-weight: 700; color: var(--black);
    }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--cream2); border: none; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: var(--cream); }
    .modal-body { padding: 24px 28px 28px; }
    .modal-footer {
      padding: 0 28px 24px;
      display: flex; gap: 10px; justify-content: flex-end;
    }

    /* ── ALERTS ────────────────────────────────────── */
    .alert {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 16px; border-radius: var(--r2);
      font-size: 13px; margin-bottom: 12px;
    }
    .alert-red { background: var(--red2); color: #7f1d1d; border-left: 3px solid var(--red); }
    .alert-amber { background: var(--amber2); color: #78350f; border-left: 3px solid var(--amber); }
    .alert-green { background: var(--green2); color: #064e3b; border-left: 3px solid var(--green); }

    /* ── VENCIMIENTO ITEM ──────────────────────────── */
    .venc-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--cream2);
    }
    .venc-item:last-child { border-bottom: none; }
    .venc-date-box {
      width: 48px; height: 48px; border-radius: 10px;
      background: var(--cream2); display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .venc-date-box .day { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700; line-height: 1; }
    .venc-date-box .month { font-size: 9px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; }
    .venc-date-box.urgent { background: var(--red2); }
    .venc-date-box.urgent .day { color: var(--red); }
    .venc-date-box.soon { background: var(--amber2); }
    .venc-date-box.soon .day { color: var(--amber); }
    .venc-date-box.ok { background: var(--green2); }

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── HELPERS ─────────────────────────────────────────
const fmt = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0 }).format(n);
const fmtShort = (n) => {
  if (n >= 1000000) return `$${(n/1000000).toFixed(1)}M`;
  if (n >= 1000) return `$${(n/1000).toFixed(0)}K`;
  return fmt(n);
};
const today = new Date();
const todayStr = today.toISOString().split('T')[0];

const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const fmtDate = (d) => {
  if (!d) return '-';
  const dt = new Date(d + 'T12:00:00');
  return `${dt.getDate()} ${MONTHS_ES[dt.getMonth()]} ${dt.getFullYear()}`;
};

const daysUntil = (dateStr) => {
  const d = new Date(dateStr + 'T12:00:00');
  const diff = Math.ceil((d - today) / (1000*60*60*24));
  return diff;
};

const urgencyClass = (days) => {
  if (days < 0) return 'urgent';
  if (days <= 7) return 'urgent';
  if (days <= 15) return 'soon';
  return 'ok';
};

const initials = (name) => {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
};

// ── FIREBASE ACCESS ──────────────────────────────────

    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>

function LoginScreen({ onLogin }) {

// ── MODAL WRAPPER ────────────────────────────────────
// ── EXCEL EXPORT UTILITY ─────────────────────────────
function exportToExcel(rows, filename = 'export') {
  if (!rows || !rows.length) { alert('No hay datos para exportar'); return; }
  const headers = Object.keys(rows[0]);
  const sep = '	';
  const lines = [
    headers.join(sep),
    ...rows.map(r => headers.map(h => {
      const v = r[h] ?? '';
      // Quote cells that contain tabs or newlines
      const s = String(v);
      return s.indexOf('\t') !== -1 || s.indexOf('\n') !== -1 ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(sep))
  ];
  const content = '\uFEFF' + lines.join('\r\n'); // BOM for Excel UTF-8
  const blob = new Blob([content], { type: 'text/tab-separated-values;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `${filename}_${todayStr}.xls`;
  a.click();
  URL.revokeObjectURL(url);
}

  );
}

      fecha:      t.fecha,
      clientes:   t.cliente || '',
      completado: false,
      esTareaRecurrente: true,
    }));

  const pendientesHoy = [...vencimientos.filter(v => !v.completado), ...tareasComoVenc]
    .sort((a,b) => new Date(a.fecha) - new Date(b.fecha))
    .slice(0, 6);
  const tareasP = tareas.filter(t => !t.completado).slice(0, 5);
  const saldosPendientes = clients.reduce((s, c) => s + (c.saldoPendiente || 0), 0);
  const vencUrgentes = vencimientos.filter(v => !v.completado && daysUntil(v.fecha) <= 7).length;

  const now = new Date();
  const dateDisplay = `${now.getDate()} de ${MONTHS_FULL[now.getMonth()]} ${now.getFullYear()}`;

      <div className="page-header">

          <div style={{fontWeight:700, color:'var(--black)', fontSize:14}}>{activeClients.length} clientes activos</div>
          <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>exportToExcel(
            clients.map(c=>({'Cliente':c.nombre,'Tipo':c.tipo,'Honorario':c.honorario,'Saldo':c.saldoPendiente,'Estado':c.estado})),
            'Dashboard_Clientes'
          )}>📥 Exportar Excel</button>
        </div>
      </div>

      {vencUrgentes > 0 && (

// ── TRIBUTOS SEED (seeds Firebase collection on first load) ───────────
// ── CUIT-dependent due-date offsets (official ARCA calendar) ─────────
// Each key = tributo id. base = nominal day. offsets[lastDigit] = delta days.
const CUIT_OFFSETS = {
  iva:       { base:18, offsets:{0:0,1:0, 2:1,3:1, 4:2,5:2, 6:7,7:7, 8:8,9:8} },
  // IVA: CUIT 0-1→día18, 2-3→19, 4-5→20, 6-7→25, 8-9→26
  f931:      { base:9,  offsets:{0:0,1:0,2:0,3:0, 4:1,5:1,6:1, 7:2,8:2,9:2} },
  // F.931: CUIT 0-3→día9, 4-6→10, 7-9→11
  autonomos: { base:5,  offsets:{0:0,1:0,2:0,3:0, 4:1,5:1,6:1, 7:4,8:4,9:4} },
  // Autónomos: CUIT 0-3→día5, 4-6→6, 7-9→9
};

// ── Resolve exact business day for a tributo given a CUIT and month ───
// Handles CUIT-dependent offsets, Monotributo special months, and skips weekends.
function resolveVencDia(tributo, cuitStr, year, month0) {
  const lastDigit = parseInt((cuitStr||'').replace(/[-\s]/g,'').slice(-1)) || 0;
  // CUIT-dependent tributos (IVA, F.931, Autónomos)
  if (tributo.cuitDependiente && CUIT_OFFSETS[tributo.cuitKey]) {
    const { base, offsets } = CUIT_OFFSETS[tributo.cuitKey];
    return base + (offsets[lastDigit] ?? 0);
  }
  // Monotributo special: June→22, Sep/Dec→21, rest→20
  if (tributo.id === 'monotributo') {
    if (month0 === 5)  return 22;
    if (month0 === 8 || month0 === 11) return 21;
    return 20;
  }
  return tributo.dia || 20;
}

function ClientNotas({ cliente }) {
  const [notas, setNotas]   = useState(cliente.notasList || []);

  const [form, setForm]     = useState({ titulo:'', subtitulo:'', cuerpo:'' });
  const [saving, setSaving] = useState(false);

  // load from firebase
  React.useEffect(() => {
    const fb = FB();
    if (!fb?.db || !cliente.id) return;
    fb.getDocs(fb.collection(fb.db, `clients/${cliente.id}/notas`))
      .then(snap => { if (!snap.empty) setNotas(snap.docs.map(d=>({id:d.id,...d.data()}))); })
      .catch(()=>{});
  }, [cliente.id]);

  const handleSave = async () => {
    if (!form.titulo.trim() && !form.cuerpo.trim()) return;
    setSaving(true);
    const nota = { titulo: form.titulo.trim(), subtitulo: form.subtitulo.trim(), cuerpo: form.cuerpo.trim(), fecha: todayStr };
    try {
      const fb = FB();
      const ref = await fb.addDoc(fb.collection(fb.db,`clients/${cliente.id}/notas`), {...nota, createdAt:fb.serverTimestamp()});
      setNotas(prev => [{...nota, id:ref.id}, ...prev]);
    } catch(e) {
      setNotas(prev => [{...nota, id:'local-'+Date.now()}, ...prev]);
    }
    setSaving(false); setModal(false); setForm({titulo:'',subtitulo:'',cuerpo:''});
  };

  const del = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar esta nota', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,`clients/${cliente.id}/notas`,id)); } catch(e){}
    setNotas(prev => prev.filter(n => n.id!==id));
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div className="card-title" style={{marginBottom:0}}><span>📝</span> Notas del Cliente</div>
        <button className="btn btn-gold btn-sm" onClick={()=>{ setForm({titulo:'',subtitulo:'',cuerpo:''}); setModal(true); }}>+ Nueva Nota</button>

      {notas.length===0
        ? <div className="card"><div className="empty-state" style={{padding:40}}><div className="empty-icon">📝</div><p>Sin notas. Agregá la primera.</p></div></div>

          <div key={n.id} className="card" style={{marginBottom:12,borderLeft:'4px solid var(--gold)',padding:'18px 20px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
              <div>
                {n.titulo && <div style={{fontFamily:'Playfair Display,serif',fontSize:17,fontWeight:700,color:'var(--black)',marginBottom:2}}>{n.titulo}</div>}
                {n.subtitulo && <div style={{fontSize:12,color:'var(--gold)',fontWeight:600,textTransform:'uppercase',letterSpacing:'1px',fontFamily:'JetBrains Mono,monospace'}}>{n.subtitulo}</div>}
              </div>
              <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
                <div style={{fontSize:11,color:'var(--gray2)',fontFamily:'JetBrains Mono,monospace'}}>{fmtDate(n.fecha)}</div>

// ── TAREAS RECURRENTES ───────────────────────────────
// Manages recurring task templates per client and generates
// monthly instances automatically.
function TareasRecurrentes({ cliente, tareas, setTareas }) {
  const [texto, setTexto]           = useState('');
  const [frecuencia, setFrecuencia] = useState('mensual');
  const [dia, setDia]               = useState('1');
  const [saving, setSaving]         = useState(false);

  // Templates: recurrente:true tasks belonging to this client
  const templates = tareas.filter(t => t.recurrente && t.clienteId === cliente.id);

  // Instances this month: non-template tasks generated from a template
  const thisMonth = todayStr.slice(0, 7); // YYYY-MM
  const instances = tareas.filter(t =>
    !t.recurrente &&
    t.clienteId === cliente.id &&
    t.recurrenteId &&
    (t.fecha || '').startsWith(thisMonth)
  );

  // On mount: generate missing instances for this month
  useEffect(() => {
    if (!templates.length) return;
    const toCreate = [];
    templates.forEach(tmpl => {
      const freq = tmpl.frecuencia || 'mensual';
      const monthNum = parseInt(thisMonth.split('-')[1]);
      // bimestral: odd months; trimestral: Jan/Apr/Jul/Oct
      if (freq === 'bimestral'   && monthNum % 2 !== 1) return;
      if (freq === 'trimestral'  && ![1,4,7,10].includes(monthNum)) return;
      const alreadyExists = tareas.some(t =>
        t.recurrenteId === tmpl.id && (t.fecha || '').startsWith(thisMonth)
      );
      if (!alreadyExists) {
        const d = Math.min(parseInt(tmpl.dia || 1), new Date(parseInt(thisMonth.split('-')[0]), monthNum, 0).getDate());
        const fecha = `${thisMonth}-${String(d).padStart(2,'0')}`;
        toCreate.push({
          texto:       tmpl.texto,
          clienteId:   cliente.id,
          cliente:     cliente.nombre,
          recurrenteId: tmpl.id,
          fecha,
          completado:  false,
          recurrente:  false,
        });
      }
    });
    if (!toCreate.length) return;
    // Save all to Firestore
    Promise.all(toCreate.map(async task => {
      try {
        const ref = await FB().addDoc(FB().collection(FB().db,'tareas'), {...task, createdAt: FB().serverTimestamp()});
        return {...task, id: ref.id};
      } catch(e) {
        return {...task, id: 'local-'+Date.now()+Math.random()};
      }
    })).then(created => {
      setTareas(prev => [...prev, ...created]);
    });
  }, [templates.length, thisMonth]);

  const addTemplate = async () => {
    if (!texto.trim()) return;
    setSaving(true);
    const tmpl = {
      texto:      texto.trim(),
      clienteId:  cliente.id,
      cliente:    cliente.nombre,
      frecuencia,
      dia:        parseInt(dia),
      recurrente: true,
      completado: false,
    };
    try {
      const ref = await FB().addDoc(FB().collection(FB().db,'tareas'), {...tmpl, createdAt: FB().serverTimestamp()});
      setTareas(prev => [...prev, {...tmpl, id: ref.id}]);
    } catch(e) {
      setTareas(prev => [...prev, {...tmpl, id: 'local-'+Date.now()}]);
    }
    setTexto(''); setSaving(false);
  };

  const deleteTemplate = async (id) => {
    const r = await Swal.fire({ title:'¿Eliminar tarea recurrente?', text:'Se eliminará el template. Las instancias ya generadas no se borran.', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap'}, reverseButtons:true });
    if (!r.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'tareas',id)); } catch(e){}
    setTareas(prev => prev.filter(t => t.id !== id));
  };

  const toggleInstance = async (id) => {
    const t = tareas.find(x => x.id === id);
    try { await FB().updateDoc(FB().doc(FB().db,'tareas',id), {completado: !t.completado}); } catch(e){}
    setTareas(prev => prev.map(x => x.id === id ? {...x, completado: !x.completado} : x));
  };

  const FREQ_LABEL = { mensual:'Mensual', bimestral:'Bimestral', trimestral:'Trimestral' };

  return (
    <div>
      {/* ── New template form ── */}
      <div className="card" style={{marginBottom:20}}>
        <div className="card-title" style={{marginBottom:16}}><span>➕</span> Nueva Tarea Recurrente</div>
        <div className="form-grid-3" style={{alignItems:'end'}}>
          <div className="form-group" style={{gridColumn:'span 1',marginBottom:0}}>
            <label className="form-label">Descripción</label>
            <input className="form-input" value={texto} onChange={e=>setTexto(e.target.value)}
              placeholder="Ej: Presentar DDJJ mensual" onKeyDown={e=>e.key==='Enter'&&addTemplate()} />
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label">Frecuencia</label>
            <select className="form-select" value={frecuencia} onChange={e=>setFrecuencia(e.target.value)}>
              <option value="mensual">Mensual</option>
              <option value="bimestral">Bimestral</option>
              <option value="trimestral">Trimestral</option>
            </select>
          </div>
          <div className="form-group" style={{marginBottom:0}}>
            <label className="form-label">Día del mes</label>
            <input className="form-input" type="number" min="1" max="28" value={dia}
              onChange={e=>setDia(e.target.value)} placeholder="1-28" />
          </div>
        </div>
        <button className="btn btn-gold" style={{marginTop:14}} onClick={addTemplate} disabled={saving||!texto.trim()}>
          {saving ? '⏳ Guardando...' : '+ Agregar Template'}
        </button>
      </div>

      {/* ── Templates list ── */}
      <div className="card" style={{marginBottom:20}}>
        <div className="card-title" style={{marginBottom:14}}><span>📋</span> Templates Activos ({templates.length})</div>
        {templates.length === 0
          ? <div style={{color:'var(--gray)',fontSize:13,padding:'20px 0',textAlign:'center'}}>Sin templates. Creá uno arriba.</div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {templates.map(t => (
                <div key={t.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:'var(--cream)',borderRadius:'var(--r2)',border:'1px solid rgba(201,169,110,0.15)'}}>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <span style={{fontSize:18}}>🔁</span>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{t.texto}</div>
                      <div style={{fontSize:11,color:'var(--gray)',fontFamily:'JetBrains Mono,monospace',marginTop:2}}>
                        {FREQ_LABEL[t.frecuencia]||t.frecuencia} · día {t.dia}
                      </div>
                    </div>
                  </div>
                  <button className="btn-icon trash" onClick={()=>deleteTemplate(t.id)} title="Eliminar template">🗑️</button>
                </div>
              ))}
            </div>
        }
      </div>

      {/* ── This month's instances ── */}
      <div className="card">
        <div className="card-title" style={{marginBottom:14}}>
          <span>📅</span> Instancias — {MONTHS_FULL[parseInt(thisMonth.split('-')[1])-1]} {thisMonth.split('-')[0]}
        </div>
        {instances.length === 0
          ? <div style={{color:'var(--gray)',fontSize:13,padding:'20px 0',textAlign:'center'}}>
              {templates.length === 0 ? 'Creá templates para generar instancias automáticamente.' : 'No hay instancias para este mes todavía.'}
            </div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {instances.map(t => (
                <div key={t.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:t.completado?'var(--green2)':'var(--cream)',borderRadius:'var(--r2)',border:`1px solid ${t.completado?'rgba(34,197,94,0.3)':'rgba(201,169,110,0.15)'}`,cursor:'pointer',transition:'all 0.15s'}}
                  onClick={()=>toggleInstance(t.id)}>
                  <div style={{width:22,height:22,borderRadius:6,flexShrink:0,background:t.completado?'var(--green)':'transparent',border:`2px solid ${t.completado?'var(--green)':'rgba(201,169,110,0.5)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'white',fontWeight:700}}>
                    {t.completado?'✓':''}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:500,fontSize:14,textDecoration:t.completado?'line-through':'none',color:t.completado?'var(--gray)':'var(--black)'}}>{t.texto}</div>
                    <div style={{fontSize:11,color:'var(--gray)',fontFamily:'JetBrains Mono,monospace',marginTop:2}}>Vence: {fmtDate(t.fecha)}</div>
                  </div>
                  <span className={`badge ${t.completado?'badge-green':'badge-amber'}`} style={{fontSize:10}}>
                    {t.completado?'✓ Hecha':'Pendiente'}
                  </span>
                </div>
              ))}
            </div>
        }
      </div>
    </div>
  );
}

// ── CLIENTES ─────────────────────────────────────────
function Clientes({ clients, setClients, vencimientos, setVencimientos, tributosCatalogo, setTributosCatalogo, tareas, setTareas }) {
  const [search, setSearch]       = useState('');
  const [view, setView]           = useState('list');
  const [selected, setSelected]   = useState(null);
  const [detailTab, setDetailTab] = useState('info');
  const [form, setForm]           = useState({});
  const [formTab, setFormTab]     = useState('datos');
  const [filter, setFilter]       = useState('todos');
  const [saving, setSaving]       = useState(false);
  const [cuitError, setCuitError] = useState('');
  const [showPass, setShowPass]   = useState({});
  const [showCatalogo, setShowCatalogo] = useState(false);

  const filtered = React.useMemo(() => clients.filter(c => {
    const q = (search||'').toLowerCase().trim();
    const matchSearch = !q ||
      (c.nombre||'').toLowerCase().includes(q) ||
      (c.email||'').toLowerCase().includes(q) ||
      (c.cuit||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')) ||
      (c.telefono||'').includes(q) ||
      (c.servicio||'').toLowerCase().includes(q);
    const matchFilter =
      filter === 'todos' ? true :
      filter === 'inactivo' ? c.estado === 'inactivo' :
      filter === 'prospecto' ? c.estado === 'prospecto' :
      c.tipo === filter;
    return matchSearch && matchFilter;
  }), [clients, search, filter]);

  const handleCuitChange = (val) => {
    const digits = val.replace(/\D/g, '').slice(0, 11);
    let formatted = digits;
    if (digits.length > 2)  formatted = digits.slice(0,2) + '-' + digits.slice(2);
    if (digits.length > 10) formatted = digits.slice(0,2) + '-' + digits.slice(2,10) + '-' + digits.slice(10);
    setForm(f => ({...f, cuit: formatted, claves: {...(f.claves||{}), arca_usuario: formatted}}));
    if (digits.length > 0 && digits.length < 11) setCuitError('El CUIT debe tener 11 dígitos');
    else setCuitError('');
  };

  const openNew = () => {
    setForm({ tipo:'monotributista', estado:'activo', honorario:'', saldoPendiente:0, tributos:[],
      claves:{ arca_usuario:'', arca_clave:'', arba_clave:'', muni_clave:'' }
    });
    setFormTab('datos'); setCuitError(''); setShowPass({}); setView('new');
  };
  const openEdit = (c) => {
    setSelected(c);
    setForm({ ...c, tributos: c.tributos||[],
      claves:{ arca_usuario: c.claves?.arca_usuario || c.cuit||'',
               arca_clave:   c.claves?.arca_clave||'',
               arba_clave:   c.claves?.arba_clave||'',
               muni_clave:   c.claves?.muni_clave||'' }
    });
    setFormTab('datos'); setCuitError(''); setShowPass({}); setView('edit');
  };
  const openDetail = (c) => { setSelected(c); setDetailTab('info'); setView('detail'); };

  // Expose openDetail for cross-component navigation (used by Dashboard)
  React.useEffect(() => {
    window.__openClient = (clientId) => {
      const c = clients.find(x => x.id === clientId);
      if (c) openDetail(c);
    };
    return () => { window.__openClient = null; };
  }, [clients]);
  const backToList = () => setView('list');

  // ── CUIT-aware vencimiento generator ────────────────────────────────
  // Given a client + their assigned tributos, produces dated vencimientos
  // for the next 12 months, respecting CUIT-dependent due dates (IVA, F.931, etc.)
  const generateVencimientosForClient = async (client, tributos) => {
    if (!tributos || !tributos.length) return [];
    const now   = new Date();
    const cuit  = (client.cuit || '').replace(/[-\s]/g, '');
    const generated = [];

    for (let m = 0; m < 12; m++) {
      const totalMon = now.getMonth() + m;
      const yr  = now.getFullYear() + Math.floor(totalMon / 12);
      const mon = totalMon % 12;                   // 0-indexed month

      tributos.forEach(t => {
        const per = t.periodicidad || 'mensual';
        // skip non-recurring
        if (per === 'variable' || per === 'cuotas' || per === 'anual') return;
        if (per === 'semestral'     && m % 6 !== 0) return;
        if (per === 'bimestral'     && m % 2 !== 0) return;
        if (per === 'cuatrimestral' && m % 4 !== 0) return;

        // Resolve the exact day using global resolveVencDia (uses CUIT_OFFSETS)
        const rawDay = resolveVencDia(t, cuit, yr, mon);
        const maxDay = new Date(yr, mon + 1, 0).getDate();
        const day    = Math.min(rawDay, maxDay);
        const fecha  = `${yr}-${String(mon+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        // For CUIT-dependent tributos, append last digit so it's traceable
        const cuitTag = t.cuitDependiente && cuit.length
          ? ` · CUIT ···${cuit.slice(-1)}`
          : '';
        const nombre = `${t.label}${cuitTag} — ${client.nombre}`;

        generated.push({
          nombre,
          tipo:       t.categoria === 'Laboral' ? 'laboral' : 'fiscal',
          fecha,
          clientes:   client.nombre,
          prioridad:  t.categoria === 'Nacional' ? 'alta' : 'media',
          completado: false,
          autoGenerado: true,
          clienteId:  client.id,
          tributoId:  t.id,
          notas:      t.nota || '',
        });
      });
    }

    // Persist to Firestore + local state
    const saved = [];
    for (const v of generated) {
      try {
        const ref = await FB().addDoc(FB().collection(FB().db,'vencimientos'), {...v, createdAt: FB().serverTimestamp()});
        saved.push({...v, id: ref.id});
      } catch(e) {
        saved.push({...v, id: 'local-'+Date.now()+Math.random()});
      }
    }
    return saved;
  };

  const handleSave = async () => {
    if (!form.nombre || cuitError) return;
    setSaving(true);
    const payload = {
      nombre: form.nombre||'', tipo: form.tipo||'monotributista',
      cuit: form.cuit||'', email: form.email||'', telefono: form.telefono||'',
      responsable: form.responsable||'', domicilio: form.domicilio||'',
      servicio: form.servicio||'', honorario: Number(form.honorario||0),
      saldoPendiente: Number(form.saldoPendiente||0), estado: form.estado||'activo',
      desde: form.desde||'', empleados: Number(form.empleados||0), notas: form.notas||'',
      tributos: form.tributos||[],
      claves: {
        arca_usuario: form.claves?.arca_usuario||form.cuit||'',
        arca_clave:   form.claves?.arca_clave||'',
        arba_clave:   form.claves?.arba_clave||'',
        muni_clave:   form.claves?.muni_clave||'',
      }
    };
    let savedClient;
    try {
      const fb = FB();
      if (view === 'new') {
        const docRef = await fb.addDoc(fb.collection(fb.db,'clients'), {...payload, createdAt: fb.serverTimestamp()});
        savedClient = {...payload, id: docRef.id};
        setClients(prev => [...prev, savedClient]);
      } else {
        await fb.updateDoc(fb.doc(fb.db,'clients',selected.id), payload);
        savedClient = {...payload, id: selected.id};
        setClients(prev => prev.map(c => c.id===selected.id ? savedClient : c));
      }
    } catch(e) {
      if (view === 'new') {
        savedClient = {...payload, id:'local-'+Date.now()};
        setClients(prev => [...prev, savedClient]);
      } else {
        savedClient = {...payload, id: selected.id};
        setClients(prev => prev.map(c => c.id===selected.id ? savedClient : c));
      }
    }
    // auto-generate vencimientos for NEW clients with assigned tributos
    if (view === 'new' && (form.tributos||[]).length > 0) {
      const newVenc = await generateVencimientosForClient(savedClient, form.tributos);
      if (newVenc.length > 0) setVencimientos(prev => [...prev, ...newVenc]);
    }
    setSelected(savedClient);
    setSaving(false); setView('detail');
    Swal.fire({ icon:'success', title: view==='new'?'Cliente creado':'Cliente actualizado', timer:1500, showConfirmButton:false, customClass:{popup:'swal-ap'} });
  };

  const handleDelete = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar este cliente', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'clients',id)); } catch(e) {}
    setClients(prev => prev.filter(c => c.id !== id));
    setSelected(null); setView('list');
  };

  const toggleTributo = (tid) => {
    setForm(f => {
      const current = f.tributos||[];
      const exists = current.find(t=>t.id===tid);
      if (exists) return {...f, tributos: current.filter(t=>t.id!==tid)};
      const trib = tributosCatalogo.find(t=>t.id===tid);
      if (!trib) return f;
      return {...f, tributos: [...current, {...trib}]};
    });
  };
  const togglePass = (key) => setShowPass(p=>({...p,[key]:!p[key]}));

  const CAT_ICON = { Nacional:'🏛️', Provincial:'🏠', Municipal:'🏙️', Laboral:'👷', Societario:'📂', Otro:'📋' };

  // ── FORM VIEW ───────────────────────────────────────
  const renderForm = () => (
    <div>
      <div className="page-header">
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button className="btn btn-ghost btn-sm" onClick={backToList}>← Volver</button>
          <div>
            <div className="page-title">{view==='new'?'Nuevo Cliente':`Editar: ${selected?.nombre}`}</div>
            <div className="page-subtitle">Completá los datos del cliente</div>
          </div>
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-ghost" onClick={backToList}>Cancelar</button>
          <button className="btn btn-gold" onClick={handleSave} disabled={saving}>
            {saving?'⏳ Guardando...':'✓ Guardar Cliente'}
          </button>
        </div>
      </div>
      <div style={{display:'flex',gap:4,background:'var(--cream2)',padding:4,borderRadius:10,marginBottom:24,width:'fit-content'}}>
        {[['datos','📋 Datos'],['tributos','📊 Tributos'],['claves','🔑 Claves']].map(([t,l])=>(
          <button key={t} className={`tab ${formTab===t?'active':''}`} style={{minWidth:130}} onClick={()=>setFormTab(t)}>{l}</button>
        ))}
      </div>
      <div className="card">
        {formTab==='datos' && (
          <div>
            <div className="form-grid-2">
              <div className="form-group">
                <label className="form-label">Nombre / Razón Social *</label>
                <input className="form-input" value={form.nombre||''} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))} placeholder="Ej: Juan García" autoFocus />
              </div>
              <div className="form-group">
                <label className="form-label">Tipo de Cliente</label>
                <select className="form-select" value={form.tipo||'monotributista'} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                  <option value="sociedad">🏢 Sociedad</option>
                  <option value="responsable_inscripto">📊 Responsable Inscripto</option>
                  <option value="monotributista">📋 Monotributista</option>
                  <option value="exento">🔵 Exento</option>
                </select>
              </div>
            </div>
            <div className="form-grid-2">
              <div className="form-group">
                <label className="form-label">CUIT</label>
                <input className="form-input" value={form.cuit||''} onChange={e=>handleCuitChange(e.target.value)}
                  placeholder="20-12345678-9" inputMode="numeric" style={{borderColor:cuitError?'var(--red)':''}} />
                {cuitError && <div style={{fontSize:11,color:'var(--red)',marginTop:4}}>{cuitError}</div>}
              </div>
              <div className="form-group">
                <label className="form-label">Estado</label>
                <select className="form-select" value={form.estado||'activo'} onChange={e=>setForm(f=>({...f,estado:e.target.value}))}>
                  <option value="activo">✅ Activo</option>
                  <option value="prospecto">🔎 Prospecto</option>
                  <option value="inactivo">⛔ Inactivo</option>
                </select>
              </div>
            </div>
            <div className="form-grid-2">
              <div className="form-group">
                <label className="form-label">Email</label>
                <input className="form-input" type="email" value={form.email||''} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="cliente@email.com" />
              </div>
              <div className="form-group">
                <label className="form-label">Teléfono</label>
                <input className="form-input" value={form.telefono||''} onChange={e=>setForm(f=>({...f,telefono:e.target.value}))} placeholder="+54 221 555-0000" />
              </div>
            </div>
            <div className="form-grid-2">
              <div className="form-group">
                <label className="form-label">Responsable de Contacto</label>
                <input className="form-input" value={form.responsable||''} onChange={e=>setForm(f=>({...f,responsable:e.target.value}))} placeholder="Para empresas" />
              </div>
              <div className="form-group">
                <label className="form-label">Domicilio</label>
                <input className="form-input" value={form.domicilio||''} onChange={e=>setForm(f=>({...f,domicilio:e.target.value}))} placeholder="Calle 47 N° 820, La Plata" />
              </div>
            </div>
            <div className="form-grid-3">
              <div className="form-group">
                <label className="form-label">Servicio Contratado</label>
                <select className="form-select" value={form.servicio||''} onChange={e=>setForm(f=>({...f,servicio:e.target.value}))}>
                  <option value="">Seleccionar...</option>
                  <option>Asesoría Fiscal (Personas)</option>
                  <option>Contabilidad Básica</option>
                  <option>Pack Integral (Fiscal+Laboral)</option>
                  <option>Presentaciones Impositivas</option>
                  <option>Consultoría Premium</option>
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Honorario Mensual (ARS)</label>
                <input className="form-input" type="number" value={form.honorario||''} onChange={e=>setForm(f=>({...f,honorario:e.target.value}))} placeholder="195000" />
              </div>
              <div className="form-group">
                <label className="form-label">N° Empleados</label>
                <input className="form-input" type="number" value={form.empleados||0} onChange={e=>setForm(f=>({...f,empleados:e.target.value}))} min="0" />
              </div>
            </div>
            <div className="form-grid-2">
              <div className="form-group">
                <label className="form-label">Cliente Desde</label>
                <input className="form-input" type="date" value={form.desde||''} onChange={e=>setForm(f=>({...f,desde:e.target.value}))} />
              </div>
              <div className="form-group">
                <label className="form-label">Saldo Pendiente (ARS)</label>
                <input className="form-input" type="number" value={form.saldoPendiente||0} onChange={e=>setForm(f=>({...f,saldoPendiente:e.target.value}))} />
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Notas</label>
              <textarea className="form-textarea" value={form.notas||''} onChange={e=>setForm(f=>({...f,notas:e.target.value}))} placeholder="Observaciones..." />
            </div>
          </div>
        )}
        {formTab==='tributos' && (
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <p style={{fontSize:13,color:'var(--gray)'}}>Seleccioná los tributos que aplican. Al guardar se generarán los vencimientos automáticamente.</p>
              <button className="btn btn-ghost btn-sm" style={{fontSize:12,flexShrink:0}} onClick={()=>setShowCatalogo(true)}>⚙️ Gestionar catálogo</button>
            </div>
            {TRIBUTO_CATEGORIAS.map(cat => {
              const items = tributosCatalogo.filter(t=>(t.categoria||'Otro')===cat);
              if (!items.length) return null;
              return (
                <div key={cat} style={{marginBottom:22}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1.5px',fontFamily:'JetBrains Mono,monospace',marginBottom:10,display:'flex',alignItems:'center',gap:8}}>
                    <span>{CAT_ICON[cat]||'📋'}</span> {cat}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:7}}>
                    {items.map(t => {
                      const active = (form.tributos||[]).find(x=>x.id===t.id);
                      return (
                        <div key={t.id} onClick={()=>toggleTributo(t.id)}
                          style={{display:'flex',alignItems:'center',gap:10,padding:'9px 13px',borderRadius:'var(--r2)',cursor:'pointer',transition:'all 0.15s',
                            background:active?'rgba(201,169,110,0.12)':'var(--cream)',border:active?'1.5px solid var(--gold)':'1.5px solid transparent'}}>
                          <div style={{width:17,height:17,borderRadius:4,flexShrink:0,background:active?'var(--gold)':'transparent',border:active?'2px solid var(--gold)':'2px solid rgba(201,169,110,0.4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'var(--black)',fontWeight:700}}>
                            {active?'✓':''}
                          </div>
                          <div>
                            <div style={{fontSize:13,fontWeight:active?600:400,color:'var(--black)'}}>{t.label}</div>
                            <div style={{fontSize:10,color:'var(--gray)',fontFamily:'JetBrains Mono,monospace'}}>{t.organismo}{t.dia?' · día '+t.dia:''}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            {(form.tributos||[]).length>0 && (
              <div style={{marginTop:12,padding:'10px 14px',background:'var(--green2)',borderRadius:'var(--r2)',fontSize:13,color:'#065f46',borderLeft:'3px solid var(--green)'}}>
                ✓ {(form.tributos||[]).length} tributo{(form.tributos||[]).length>1?'s':''} seleccionado{(form.tributos||[]).length>1?'s':''}
                {view==='new'?' — se generarán vencimientos automáticamente al guardar':''}
              </div>
            )}
          </div>
        )}
        {formTab==='claves' && (
          <div>
            <div style={{padding:'10px 14px',background:'var(--amber2)',borderRadius:'var(--r2)',marginBottom:20,fontSize:13,color:'#78350f',borderLeft:'3px solid var(--amber)'}}>
              🔐 <strong>Información sensible.</strong> Guardada en tu base de datos privada de Firebase.
            </div>
            {/* ARCA — with CUIT/usuario */}
            <div className="clave-card" style={{marginBottom:14}}>
              <div className="clave-card-title">🏛️ ARCA (Ex-AFIP)</div>
              <div className="form-grid-2">
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label">CUIT / Usuario</label>

// ── COBROS ────────────────────────────────────────────
const MEDIOS_PAGO = [
  { id: 'efectivo',    label: 'Efectivo',       icon: '💵', subs: [] },
  { id: 'transferencia', label: 'Transferencia', icon: '🏦', subs: ['Banco Provincia','Banco Nación','Banco Galicia','Mercado Pago','BBVA','HSBC','Otro banco'] },
  { id: 'cheque',      label: 'Cheque',         icon: '📄', subs: [] },
  { id: 'mp',          label: 'Mercado Pago',   icon: '💙', subs: [] },
];
const NATURALEZAS_COBRO = [
  'Honorarios mensuales','Honorario por consulta','Consultoría puntual',
  'Presentación impositiva','Gestión laboral','Trámite especial',
  'Asesoría extraordinaria','Regularización de deuda','Adelanto',
  'Saldo pendiente','Otro',
];

function Cobros({ clients, setClients, cobros, setCobros }) {
  const [modal, setModal]     = useState(false);
  const [editItem, setEditItem] = useState(null); // cobro being edited
  const [form, setForm]       = useState({ clienteId:'', monto:'', naturaleza:'Honorarios mensuales', medio:'efectivo', submedio:'', fecha:todayStr, notas:'' });
  const [saving, setSaving]   = useState(false);
  const [filter, setFilter]   = useState('todos');

  const clientesConDeuda = clients.filter(c => c.saldoPendiente > 0);

  const filtered = filter==='todos' ? cobros :
    cobros.filter(c => c.medio===filter);

  const totalMes = cobros
    .filter(c => c.fecha && c.fecha.startsWith(todayStr.slice(0,7)))
    .reduce((s,c) => s+(c.monto||0),0);
  const totalGeneral = cobros.reduce((s,c) => s+(c.monto||0),0);

  const selectedClient = clients.find(c=>c.id===form.clienteId);

  const handleSave = async () => {
    if (!form.clienteId || !form.monto || !form.fecha) return;
    setSaving(true);
    const cliente = clients.find(c=>c.id===form.clienteId);
    const cobro = {
      clienteId: form.clienteId,
      cliente: cliente?.nombre||'',
      monto: Number(form.monto),
      naturaleza: form.naturaleza,
      medio: form.medio,
      submedio: form.submedio||'',
      fecha: form.fecha,
      notas: form.notas||'',
      tipo: 'ingreso',
    };
    try {
      if (editItem) {
        // UPDATE existing
        try { await FB().updateDoc(FB().doc(FB().db,'cobros',editItem.id), cobro); } catch(e){}
        setCobros(prev=>prev.map(x=>x.id===editItem.id?{...cobro,id:editItem.id}:x));
        Swal.fire({ icon:'success', title:'Cobro actualizado', timer:1500, showConfirmButton:false, customClass:{popup:'swal-ap'} });
      } else {
        // CREATE new
        let saved;
        try {
          const fb = FB();
          const ref = await fb.addDoc(fb.collection(fb.db,'cobros'), {...cobro, createdAt:fb.serverTimestamp()});
          saved = {...cobro, id:ref.id};
        } catch(e) {
          saved = {...cobro, id:'local-'+Date.now()};
        }
        setCobros(prev=>[saved,...prev]);
        // Update client saldo only on new cobro
        if (cliente && Number(form.monto) > 0) {
          const newSaldo = Math.max(0, (cliente.saldoPendiente||0) - Number(form.monto));
          try { await FB().updateDoc(FB().doc(FB().db,'clients',form.clienteId),{saldoPendiente:newSaldo}); } catch(e){}
          setClients(prev=>prev.map(c=>c.id===form.clienteId?{...c,saldoPendiente:newSaldo}:c));
        }
        Swal.fire({ icon:'success', title:'Cobro registrado', text: fmt(Number(form.monto))+' · '+cliente?.nombre, timer:1800, showConfirmButton:false, customClass:{popup:'swal-ap'} });
      }
    } finally {
      setSaving(false);
      setModal(false);
      setEditItem(null);
      setForm({clienteId:'',monto:'',naturaleza:'Honorarios mensuales',medio:'efectivo',submedio:'',fecha:todayStr,notas:''});
    }
  };

  const openEdit = (cobro) => {
    setEditItem(cobro);
    setForm({ clienteId:cobro.clienteId||'', monto:cobro.monto||'', naturaleza:cobro.naturaleza||'Honorarios mensuales',
      medio:cobro.medio||'efectivo', submedio:cobro.submedio||'', fecha:cobro.fecha||todayStr, notas:cobro.notas||'' });
    setModal(true);
  };

  const handleDelete = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar este cobro ', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'cobros',id)); } catch(e){}
    setCobros(prev=>prev.filter(x=>x.id!==id));
  };

  const medioActual = MEDIOS_PAGO.find(m=>m.id===form.medio);
  const MEDIO_LABEL = {efectivo:'💵 Efectivo',transferencia:'🏦 Transferencia',cheque:'📄 Cheque',mp:'💙 Mercado Pago'};

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Cobros</div>
          <div className="page-subtitle">Registrá cobros y generá recibos · {cobros.length} registros</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(

              {selectedClient?.saldoPendiente>0 && ` El saldo pendiente quedará en ${fmt(Math.max(0,selectedClient.saldoPendiente-Number(form.monto)))}.`}

          clients={clients}
          onClose={()=>setShowImport(false)}
        />
      )}
    </div>
  );
}


// ── FINANZAS ──────────────────────────────────────────
function Finanzas({ cobros, setCobros, facturas, setFacturas }) {
  const [mesFilter, setMesFilter] = useState(todayStr.slice(0,7));
  const [editMov, setEditMov]     = useState(null);
  const [editForm, setEditForm]   = useState({});

  const allMovimientos = [
    ...cobros.map(c=>({...c, _tipo:'cobro', _color:'var(--green)'})),
    ...facturas.filter(f=>f.estado==='facturado').map(f=>({
      id:f.id, fecha:f.fecha, cliente:f.cliente||f.clienteNombre, monto:f.monto,
      naturaleza:f.concepto, medio:'—', _tipo:'factura', _color:'var(--blue)',
    })),
  ].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const filtered = mesFilter
    ? allMovimientos.filter(m=>m.fecha&&m.fecha.startsWith(mesFilter))
    : allMovimientos;

  const totalMes  = filtered.reduce((s,m)=>s+(Number(m.monto)||0),0);
  const soloMeses = [...new Set(allMovimientos.map(m=>m.fecha?.slice(0,7)).filter(Boolean))].sort().reverse();

  const handleDelete = async (mov) => {
    const result = await Swal.fire({ title:'¿Eliminar movimiento?', text:`Eliminar ${fmt(mov.monto)} — esta acción no se puede deshacer.`, icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    if (mov._tipo === 'cobro') {
      try { await FB().deleteDoc(FB().doc(FB().db,'cobros',mov.id)); } catch(e){}
      setCobros(prev=>prev.filter(c=>c.id!==mov.id));
    } else {
      try { await FB().updateDoc(FB().doc(FB().db,'facturas',mov.id),{estado:'pendiente'}); } catch(e){}
      setFacturas(prev=>prev.map(f=>f.id===mov.id?{...f,estado:'pendiente'}:f));
    }
  };

  const openEdit = (mov) => {
    setEditMov(mov);
    setEditForm({ monto: mov.monto, fecha: mov.fecha, naturaleza: mov.naturaleza||mov.concepto||'' });
  };

  const saveEdit = async () => {
    if (!editMov) return;
    const changes = { monto: Number(editForm.monto), fecha: editForm.fecha, naturaleza: editForm.naturaleza };
    if (editMov._tipo === 'cobro') {
      try { await FB().updateDoc(FB().doc(FB().db,'cobros',editMov.id),{...changes}); } catch(e){}
      setCobros(prev=>prev.map(c=>c.id===editMov.id?{...c,...changes}:c));
    } else {
      try { await FB().updateDoc(FB().doc(FB().db,'facturas',editMov.id),{monto:changes.monto,fecha:changes.fecha,concepto:changes.naturaleza}); } catch(e){}
      setFacturas(prev=>prev.map(f=>f.id===editMov.id?{...f,monto:changes.monto,fecha:changes.fecha,concepto:changes.naturaleza}:f));
    }
    setEditMov(null);
  };

  const exportXLS = () => exportToExcel(
    filtered.map(m=>({
      'Fecha': m.fecha, 'Cliente': m.cliente||m.clienteNombre, 'Concepto': m.naturaleza,
      'Medio': m.medio&&m.medio!=='—'?m.medio+(m.submedio?' · '+m.submedio:''):'—',
      'Tipo': m._tipo==='cobro'?'Cobro':'Factura', 'Monto': m.monto,
    })),
    `Finanzas_${mesFilter||'historico'}`
  );

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Finanzas</div>
          <div className="page-subtitle">Libro de ingresos · todos los movimientos</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={exportXLS}>📥 Exportar Excel</button>
      </div>

      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:24}}>
        <div className="stat-card"><div className="stat-icon">💰</div>
          <div className="stat-label">Ingresos {mesFilter||'histórico'}</div>
          <div className="stat-value gold">{fmtShort(totalMes)}</div>
        </div>
        <div className="stat-card"><div className="stat-icon">🧾</div>
          <div className="stat-label">Movimientos</div>
          <div className="stat-value">{filtered.length}</div>
        </div>
        <div className="stat-card"><div className="stat-icon">📊</div>
          <div className="stat-label">Promedio por cobro</div>
          <div className="stat-value">{filtered.length>0?fmtShort(totalMes/filtered.length):'—'}</div>
        </div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:12,color:'var(--gray)',fontWeight:600}}>Período:</span>
        <button className={`btn btn-sm ${!mesFilter?'btn-primary':'btn-ghost'}`} onClick={()=>setMesFilter('')}>Todos</button>
        {soloMeses.slice(0,8).map(m=>(
          <button key={m} className={`btn btn-sm ${mesFilter===m?'btn-primary':'btn-ghost'}`} onClick={()=>setMesFilter(m)}>
            {MONTHS_FULL[parseInt(m.slice(5,7))-1]} {m.slice(0,4)}
          </button>
        ))}
      </div>

      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Fecha</th><th>Cliente</th><th>Concepto</th>
              <th>Medio</th><th>Tipo</th><th style={{textAlign:'right'}}>Monto</th><th></th>
            </tr></thead>
            <tbody>
              {filtered.length===0
                ? <tr><td colSpan={7}><div className="empty-state"><div className="empty-icon">📊</div><p>Sin movimientos en este período</p></div></td></tr>
                : filtered.map(m=>(
                  <tr key={m.id+m._tipo}>
                    <td style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,whiteSpace:'nowrap'}}>{fmtDate(m.fecha)}</td>
                    <td style={{fontWeight:600,fontSize:13}}>{m.cliente||m.clienteNombre}</td>
                    <td style={{fontSize:13,color:'var(--gray)'}}>{m.naturaleza}</td>
                    <td style={{fontSize:12}}>{m.medio&&m.medio!=='—'?m.medio+(m.submedio?' · '+m.submedio:''):'—'}</td>
                    <td><span className={`badge ${m._tipo==='cobro'?'badge-green':'badge-blue'}`} style={{fontSize:9}}>{m._tipo==='cobro'?'💰 Cobro':'🧾 Factura'}</span></td>
                    <td style={{textAlign:'right',fontFamily:'JetBrains Mono,monospace',fontWeight:700,color:m._color}}>{fmt(m.monto)}</td>
                    <td><div className="action-btns">
                      <button className="btn-icon edit" title="Editar" onClick={()=>openEdit(m)}>✏️</button>
                      <button className="btn-icon trash" title="Eliminar / revertir" onClick={()=>handleDelete(m)}>🗑️</button>
                    </div></td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </div>

      {editMov && (
        <Modal title="✏️ Editar Movimiento" onClose={()=>setEditMov(null)}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEditMov(null)}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={saveEdit}>Guardar Cambios</button>
          </>}>
          <div style={{padding:'8px 12px',background:'var(--cream2)',borderRadius:'var(--r2)',fontSize:12,color:'var(--gray)',marginBottom:12}}>
            {editMov._tipo==='cobro'?'💰 Cobro registrado':'🧾 Factura'} · {editMov.cliente||editMov.clienteNombre}
          </div>
          <div className="form-group">
            <label className="form-label">Concepto</label>
            <input className="form-input" value={editForm.naturaleza||''} onChange={e=>setEditForm(f=>({...f,naturaleza:e.target.value}))} />
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Monto (ARS)</label>
              <input className="form-input" type="number" value={editForm.monto||''} onChange={e=>setEditForm(f=>({...f,monto:e.target.value}))} />
            </div>
            <div className="form-group">
              <label className="form-label">Fecha</label>
              <input className="form-input" type="date" value={editForm.fecha||''} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} />
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}


// ── TAREAS ───────────────────────────────────────────
function Tareas({ tareas, setTareas, clients }) {
  const [newText, setNewText] = useState('');
  const [newCliente, setNewCliente] = useState('');
  const [filter, setFilter] = useState('pendientes');
  const [editTask, setEditTask] = useState(null);
  const [editTarea, setEditTarea] = useState(null);
  const [editForm, setEditForm] = useState({});

  const shown = tareas.filter(t =>
    filter === 'pendientes' ? !t.completado :
    filter === 'completadas' ? t.completado : true
  );

  const addTask = async () => {
    if (!newText.trim()) return;
    if (editTask) {
      // Update mode
      const updated = {...editTask, texto:newText, cliente:newCliente};
      try { await FB().updateDoc(FB().doc(FB().db,'tareas',editTask.id),{texto:newText,cliente:newCliente}); } catch(e){}
      setTareas(prev=>prev.map(t=>t.id===editTask.id?updated:t));
      setEditTask(null); setNewText(''); setNewCliente(''); return;
    }
    const task = { texto: newText, cliente: newCliente, completado: false, fecha: todayStr };
    try {
      const ref = await FB().addDoc(FB().collection(FB().db, 'tareas'), {...task, createdAt: FB().serverTimestamp()});
      setTareas(prev => [{ ...task, id: ref.id }, ...prev]);
    } catch(e) {
      setTareas(prev => [{ ...task, id: 'local-'+Date.now() }, ...prev]);
    }
    setNewText(''); setNewCliente('');
  };

  const toggle = async (id) => {
    const t = tareas.find(x => x.id === id);
    try { await FB().updateDoc(FB().doc(FB().db, 'tareas', id), { completado: !t.completado }); } catch(e) {}
    setTareas(prev => prev.map(x => x.id === id ? {...x, completado: !x.completado} : x));
  };

  const del = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar esta tarea', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db, 'tareas', id)); } catch(e) {}
    setTareas(prev => prev.filter(x => x.id !== id));
  };

  const saveEdit = async () => {
    if (!editForm.texto?.trim()) return;
    try { await FB().updateDoc(FB().doc(FB().db,'tareas',editTarea.id),{texto:editForm.texto,cliente:editForm.cliente||''}); } catch(e){}
    setTareas(prev=>prev.map(x=>x.id===editTarea.id?{...x,texto:editForm.texto,cliente:editForm.cliente||''}:x));
    setEditTarea(null);
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Tareas</div>
          <div className="page-subtitle">{tareas.filter(t => !t.completado).length} tareas pendientes</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
          shown.map(t=>({'Tarea':t.texto,'Cliente':t.cliente||'','Estado':t.completado?'Completada':'Pendiente','Fecha':t.fecha})),
          'Tareas'
        )}>📥 Excel</button>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div className="quick-add-bar">
          <input value={newText} onChange={e => setNewText(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addTask()}
            placeholder={editTask ? "Editando tarea... (Enter para guardar)" : "Nueva tarea... (Enter para agregar)"}
            style={{background: editTask ? 'rgba(201,169,110,0.08)' : undefined}} />
          <select className="form-select" style={{width:'auto', minWidth:180}} value={newCliente} onChange={e => setNewCliente(e.target.value)}>
            <option value="">Sin cliente</option>
            {clients.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
          </select>
          {editTask && <button className="btn btn-ghost btn-sm" onClick={()=>{setEditTask(null);setNewText('');setNewCliente('');}}>✕</button>}
          <button className="btn btn-gold btn-sm" onClick={addTask}>{editTask?'✓ Guardar':'+ Agregar'}</button>
        </div>
      </div>

      <div style={{display:'flex', gap:8, marginBottom:16}}>
        {['pendientes','completadas','todas'].map(f => (
          <button key={f} className={`btn btn-sm ${filter === f ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setFilter(f)}>
            {f === 'pendientes' ? `⏳ Pendientes (${tareas.filter(t => !t.completado).length})` :
             f === 'completadas' ? `✅ Completadas (${tareas.filter(t => t.completado).length})` : '📋 Todas'}
          </button>
        ))}
      </div>

      <div className="card">
        {shown.length === 0
          ? <div className="empty-state"><div className="empty-icon">✅</div><p>Sin tareas en este filtro</p></div>
          : shown.map(t => (
            <div key={t.id} className="task-item" style={{padding:'14px 0'}}>
              <div className={`task-check ${t.completado ? 'done' : ''}`} onClick={() => toggle(t.id)} />
              <div style={{flex:1}}>
                <div className={`task-text ${t.completado ? 'done' : ''}`} style={{fontSize:15}}>{t.texto}</div>
                <div style={{display:'flex', gap:8, marginTop:4, alignItems:'center'}}>
                  {t.cliente && <span className="badge badge-gray">{t.cliente}</span>}
                  <span className="nota-date">{fmtDate(t.fecha)}</span>
                </div>
              </div>
              <div className="action-btns">
                <button className="btn-icon edit" title="Editar" onClick={()=>{setEditTarea(t);setEditForm({texto:t.texto,cliente:t.cliente||''});}}>✏️</button>
                <button className="btn-icon trash" title="Eliminar" onClick={() => del(t.id)}>🗑️</button>
              </div>
            </div>
          ))
        }
      </div>

      {editTarea && (
        <Modal title="✏️ Editar Tarea" onClose={()=>setEditTarea(null)}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEditTarea(null)}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={saveEdit}>Guardar</button>
          </>}>
          <div className="form-group">
            <label className="form-label">Tarea</label>
            <input className="form-input" value={editForm.texto||''} onChange={e=>setEditForm(f=>({...f,texto:e.target.value}))} autoFocus />
          </div>
          <div className="form-group">
            <label className="form-label">Cliente</label>
            <select className="form-select" value={editForm.cliente||''} onChange={e=>setEditForm(f=>({...f,cliente:e.target.value}))}>
              <option value="">Sin cliente</option>
              {clients.map(c=><option key={c.id} value={c.nombre}>{c.nombre}</option>)}
            </select>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── NOTAS ────────────────────────────────────────────
function Notas({ notas, setNotas, clients }) {
  const [text, setText]       = useState('');
  const [cliente, setCliente] = useState('');
  const [editNota, setEditNota] = useState(null);
  const [editText, setEditText] = useState('');

  const addNota = async () => {
    if (!text.trim()) return;
    const nota = { texto: text, cliente, fecha: todayStr };
    try {
      const ref = await FB().addDoc(FB().collection(FB().db, 'notas'), {...nota, createdAt: FB().serverTimestamp()});
      setNotas(prev => [{ ...nota, id: ref.id }, ...prev]);
    } catch(e) {
      setNotas(prev => [{ ...nota, id: 'local-'+Date.now() }, ...prev]);
    }
    setText(''); setCliente('');
  };

  const del = async (id) => {
    if(!confirm('¿Eliminar esta nota?')) return;
    try { await FB().deleteDoc(FB().doc(FB().db, 'notas', id)); } catch(e) {}
    setNotas(prev => prev.filter(n => n.id !== id));
  };

  const saveEdit = async () => {
    if (!editText.trim()) return;
    try { await FB().updateDoc(FB().doc(FB().db,'notas',editNota.id),{texto:editText}); } catch(e){}
    setNotas(prev=>prev.map(n=>n.id===editNota.id?{...n,texto:editText}:n));
    setEditNota(null); setEditText('');
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Notas & Anotaciones</div>
          <div className="page-subtitle">Registros rápidos y observaciones</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
          notas.map(n=>({'Texto':n.texto,'Cliente':n.cliente||'','Fecha':n.fecha})),
          'Notas'
        )}>📥 Excel</button>
      </div>

      <div className="card" style={{marginBottom:24}}>
        <div className="card-title"><span>✍️</span> Nueva Anotación</div>
        <textarea className="form-textarea" style={{marginBottom:12}} value={text}
          onChange={e => setText(e.target.value)}
          placeholder="Escribí tu nota aquí... (llamados, reuniones, recordatorios, ideas)" />
        <div style={{display:'flex', gap:10, alignItems:'center'}}>
          <select className="form-select" style={{width:'auto', minWidth:200}} value={cliente} onChange={e => setCliente(e.target.value)}>
            <option value="">Sin cliente asociado</option>
            {clients.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
          </select>
          <button className="btn btn-gold" onClick={addNota}>+ Guardar Nota</button>
        </div>
      </div>

      {notas.length === 0
        ? <div className="empty-state"><div className="empty-icon">📝</div><p>Sin notas todavía. ¡Empezá a escribir!</p></div>
        : notas.map(n => (
          <div className="nota-card" key={n.id} style={{position:'relative'}}>
            <div className="nota-text">{n.texto}</div>
            <div className="nota-meta">
              <div style={{display:'flex', gap:8, alignItems:'center'}}>
                <div className="nota-date">{fmtDate(n.fecha)}</div>
                {n.cliente && <span className="badge badge-gold">{n.cliente}</span>}
              </div>
              <div className="action-btns">
                <button className="btn-icon edit" title="Editar" onClick={()=>{setEditNota(n);setEditText(n.texto);}}>✏️</button>
                <button className="btn-icon trash" title="Eliminar" onClick={() => del(n.id)}>🗑️</button>
              </div>
            </div>
          </div>
        ))
      }

      {editNota && (
        <Modal title="✏️ Editar Nota" onClose={()=>setEditNota(null)}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEditNota(null)}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={saveEdit}>Guardar</button>
          </>}>
          <div className="form-group">
            <textarea className="form-textarea" style={{minHeight:120}} value={editText}
              onChange={e=>setEditText(e.target.value)} autoFocus />
          </div>
        </Modal>
      )}
    </div>
  );
}


// ── IMPORTAR VENCIMIENTOS ────────────────────────────
function ImportarVencimientos({ vencimientos, setVencimientos, clients, onClose }) {
  const [tab, setTab]           = useState('ics');
  const [csvText, setCsvText]   = useState('');
  const [icsText, setIcsText]   = useState('');
  const [manualRows, setManualRows] = useState([
    {nombre:'',tipo:'fiscal',fecha:'',clientes:'',prioridad:'media'}
  ]);
  const [saving, setSaving]     = useState(false);
  const [imported, setImported] = useState(0);
  const [preview, setPreview]   = useState([]);
  const [icsPreview, setIcsPreview] = useState([]);

  const addRow = () => setManualRows(r=>[...r,{nombre:'',tipo:'fiscal',fecha:'',clientes:'',prioridad:'media'}]);
  const upRow  = (i,k,v) => setManualRows(r=>r.map((x,j)=>j===i?{...x,[k]:v}:x));
  const delRow = (i) => setManualRows(r=>r.filter((_,j)=>j!==i));

  // ── Parse standard CSV ───────────────────────────────
  const parseCSV = (text) => {
    const lines = text.trim().split('\n').filter(l=>l.trim());
    const isHeader = lines[0] && lines[0].toLowerCase().includes('nombre');
    return lines.slice(isHeader?1:0).map(l=>{
      const parts = l.split(',').map(p=>p.trim().replace(/^"|"$/g,''));
      return { nombre:parts[0]||'', tipo:parts[1]||'fiscal', fecha:parts[2]||'', clientes:parts[3]||'', prioridad:parts[4]||'media' };
    }).filter(r=>r.nombre&&r.fecha);
  };

  // ── Parse ICS / iCalendar — RFC 5545 compliant ──────
  const parseICS = (text) => {
    // 1. Normalize line endings and unfold continuation lines (RFC 5545 §3.1)
    const unfolded = text
      .replace(/\r\n/g, '\n')
      .replace(/\r/g, '\n')
      .replace(/\n[ \t]/g, ''); // unfold: CRLF + SPACE/TAB = continuation

    const events = [];
    const blocks = unfolded.split('BEGIN:VEVENT');

    blocks.slice(1).forEach(block => {
      // Cut at END:VEVENT to avoid bleed into next event
      const eventBlock = block.split('END:VEVENT')[0];

      // Extract a property value — handles param syntax like DTSTART;TZID=...:value
      const getVal = (key) => {
        const rx = new RegExp('^' + key + '(?:;[^:]*)?:(.+)$', 'm');
        const m = eventBlock.match(rx);
        return m ? m[1].trim() : '';
      };

      const summary  = getVal('SUMMARY');
      const dtstart  = getVal('DTSTART');
      const desc     = getVal('DESCRIPTION').replace(/\\n/g,' ').replace(/\\,/g,',');
      const location = getVal('LOCATION');

      if (!summary || !dtstart) return;

      // Parse date: handles 20260318, 20260318T000000, 20260318T000000Z
      let raw = dtstart.replace(/Z$/, '').split('T')[0].replace(/-/g,'');
      let dateStr = '';
      if (raw.length === 8) {
        dateStr = raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);
      } else {
        return; // unparseable date, skip
      }

      // Classify tipo
      const lowSum = (summary + ' ' + desc).toLowerCase();
      const tipo =
        /sueldo|f\.?931|\bsuss\b|cargas sociales|\bart\b|laboral/.test(lowSum) ? 'laboral' :
        /societ|balance|igj|dppj/.test(lowSum) ? 'societario' :
        'fiscal';

      // Classify prioridad
      const prioridad =
        /\biva\b|ganancias|bienes personales|\barca\b|\bafip\b|suss|f\.?931/.test(lowSum)
        ? 'alta' : 'media';

      // Organismo hint for notas
      const org =
        /\barba\b/.test(lowSum) ? 'ARBA' :
        /\barca\b|\bafip\b/.test(lowSum) ? 'ARCA' :
        /\bart\b/.test(lowSum) ? 'ART' : '';

      const notas = [desc, location, org].filter(Boolean).join(' · ').slice(0, 200);

      events.push({ nombre: summary, tipo, fecha: dateStr, clientes: '', prioridad, notas });
    });

    return events;
  };

  // ── Smart CUIT client matching ───────────────────────
  const smartMatchClients = (_row) => {
    // El matching de clientes ocurre en tiempo real al mostrar vencimientos
    // via getClientesDelVenc/getClientesDelGrupo — no durante la importación
    return [];
  };

  // Build smart preview from CSV
  const buildSmartPreview = (text) => {
    const rows = parseCSV(text);
    const expanded = [];
    rows.forEach(row => {
      const matched = smartMatchClients(row);
      if (!matched.length) {
        expanded.push({...row, _display: row.clientes||'General', _matched:[]});
      } else {
        matched.forEach(c => expanded.push({...row, clientes:c.nombre, clienteId:c.id, _display:c.nombre, _matched:[c.nombre]}));
      }
    });
    return expanded;
  };

  // ── Handle file drop / input ─────────────────────────
  const handleICSFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result;
      setIcsText(text);
      const parsed = parseICS(text);
      setIcsPreview(parsed);
    };
    reader.readAsText(file, 'UTF-8');
  };

  React.useEffect(() => {
    if (tab === 'smart' && csvText) setPreview(buildSmartPreview(csvText));
  }, [csvText, tab]);

  // ── Import rows into Firestore + state ───────────────
  const handleImport = async (rows) => {
    const valid = rows.filter(r=>r.nombre&&r.fecha);
    if (!valid.length) {
      Swal.fire({ icon:'warning', title:'Sin datos', text:'No hay filas válidas para importar.', customClass:{popup:'swal-ap'} });
      return;
    }
    setSaving(true);
    let count = 0;
    const newVenc = [];
    for (const r of valid) {
      const { _display, _matched, ...v } = r;
      const rec = {...v, completado:false};
      try {
        const fb = FB();
        const ref = await fb.addDoc(fb.collection(fb.db,'vencimientos'), {...rec, createdAt:fb.serverTimestamp()});
        newVenc.push({...rec, id:ref.id}); count++;
      } catch(e) {
        newVenc.push({...rec, id:'local-'+Date.now()+count}); count++;
      }
    }
    setVencimientos(prev=>[...prev,...newVenc]);
    setSaving(false);
    setImported(count);
    setCsvText(''); setPreview([]); setIcsText(''); setIcsPreview([]);
    if (tab==='manual') setManualRows([{nombre:'',tipo:'fiscal',fecha:'',clientes:'',prioridad:'media'}]);
    Swal.fire({ icon:'success', title:`${count} vencimiento${count!==1?'s':''} importado${count!==1?'s':''}`, timer:2000, showConfirmButton:false, customClass:{popup:'swal-ap'} });
    onClose();
  };

  const TIPO_BADGE = { fiscal:'badge-gold', laboral:'badge-blue', societario:'badge-gray' };

  return (
    <Modal title="📥 Importar Vencimientos" onClose={onClose} wide
      footer={<>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancelar</button>
        {tab!=='info' && (
          <button className="btn btn-gold" disabled={saving}
            onClick={()=>handleImport(
              tab==='ics'    ? icsPreview  :
              tab==='smart'  ? preview     :
              tab==='csv'    ? parseCSV(csvText) :
              manualRows
            )}>
            {saving ? '⏳ Importando...' : `📥 Importar${tab==='ics'&&icsPreview.length?' ('+icsPreview.length+')':tab==='smart'&&preview.length?' ('+preview.length+')':''}`}
          </button>
        )}
      </>}>

      <div style={{display:'flex',gap:4,background:'var(--cream2)',padding:4,borderRadius:10,marginBottom:20,width:'fit-content',flexWrap:'wrap'}}>
        {[['ics','📅 Archivo .ics'],['smart','🧠 Smart CSV'],['manual','✏️ Manual'],['csv','📄 CSV simple'],['info','ℹ️ Ayuda']].map(([t,l])=>(
          <button key={t} className={`tab ${tab===t?'active':''}`} style={{minWidth:110,fontSize:12}} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {/* ── ICS TAB ── */}
      {tab==='ics' && (
        <div>
          <div style={{padding:'10px 14px',background:'var(--blue2)',borderRadius:8,marginBottom:14,fontSize:12,color:'#1e40af',lineHeight:1.7}}>
            <strong>📅 Importar desde Google Calendar / Apple Calendar</strong><br/>
            Exportá tu calendario de vencimientos como <strong>.ics</strong> y subilos acá. El sistema detecta automáticamente fechas, tipos y prioridades.
          </div>
          <div
            onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--gold)';}}
            onDragLeave={e=>{e.currentTarget.style.borderColor='var(--border)';}}
            onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--border)';handleICSFile(e.dataTransfer.files[0]);}}
            style={{border:'2px dashed var(--border)',borderRadius:12,padding:'32px 20px',textAlign:'center',cursor:'pointer',transition:'border-color 0.2s',marginBottom:16}}
            onClick={()=>document.getElementById('ics-file-input').click()}>
            <div style={{fontSize:36,marginBottom:8}}>📅</div>
            <div style={{fontWeight:600,color:'var(--black)',marginBottom:4}}>Arrastrá tu archivo .ics aquí</div>
            <div style={{fontSize:12,color:'var(--gray)'}}>o hacé clic para seleccionar</div>
            <input id="ics-file-input" type="file" accept=".ics,.ical" style={{display:'none'}}
              onChange={e=>handleICSFile(e.target.files[0])} />
          </div>
          {icsPreview.length > 0 && (
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:600,color:'var(--black)'}}>
                  Vista previa — {icsPreview.length} evento{icsPreview.length!==1?'s':''}
                </div>
                <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>{setIcsPreview([]);setIcsText('');}}>✕ Limpiar</button>
              </div>
              <div style={{maxHeight:280,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8}}>
                <table style={{width:'100%',fontSize:11,borderCollapse:'collapse'}}>
                  <thead style={{background:'var(--cream2)',position:'sticky',top:0}}>
                    <tr>
                      {['Evento','Fecha','Tipo','Prioridad'].map(h=>(
                        <th key={h} style={{padding:'7px 10px',textAlign:'left',fontWeight:600,fontSize:11}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {icsPreview.map((r,i)=>(
                      <tr key={i} style={{borderTop:'1px solid var(--border)',background:i%2===0?'white':'var(--cream3)'}}>
                        <td style={{padding:'6px 10px',maxWidth:240,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.nombre}</td>
                        <td style={{padding:'6px 10px',whiteSpace:'nowrap',fontFamily:'JetBrains Mono,monospace',fontSize:11}}>{r.fecha}</td>
                        <td style={{padding:'6px 8px'}}><span className={`badge ${TIPO_BADGE[r.tipo]||'badge-gray'}`} style={{fontSize:10}}>{r.tipo}</span></td>
                        <td style={{padding:'6px 8px'}}><span className={`badge ${r.prioridad==='alta'?'badge-red':'badge-gray'}`} style={{fontSize:10}}>{r.prioridad}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── SMART CSV TAB ── */}
      {tab==='smart' && (
        <div>
          <div style={{padding:'10px 14px',background:'var(--blue2)',borderRadius:8,marginBottom:14,fontSize:12,color:'#1e40af',lineHeight:1.7}}>
            <strong>🧠 CSV con asignación automática por CUIT</strong><br/>
            Pegá el CSV de vencimientos. El sistema detecta a qué clientes corresponde cada fila según terminación de CUIT.
          </div>
          <textarea className="form-textarea" style={{minHeight:140,fontFamily:'JetBrains Mono,monospace',fontSize:11}}

            placeholder={"nombre,tipo,fecha,clientes,prioridad\nIVA Febrero 2026 - CUIT 0-1,fiscal,2026-03-18,CUIT term. 0-1,alta\nMonotributo Marzo 2026,fiscal,2026-03-20,Todos los monotributistas,alta"} />
          {preview.length > 0 && (
            <div style={{marginTop:12}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:8}}>{preview.length} vencimiento{preview.length!==1?'s':''} a crear:</div>
              <div style={{maxHeight:220,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8}}>
                <table style={{width:'100%',fontSize:11,borderCollapse:'collapse'}}>
                  <thead style={{background:'var(--cream2)',position:'sticky',top:0}}>
                    <tr>{['Vencimiento','Fecha','Cliente','Tipo'].map(h=><th key={h} style={{padding:'6px 10px',textAlign:'left',fontSize:11,fontWeight:600}}>{h}</th>)}</tr>
                  </thead>
                  <tbody>
                    {preview.map((r,i)=>(
                      <tr key={i} style={{borderTop:'1px solid var(--border)',background:i%2===0?'white':'var(--cream3)'}}>
                        <td style={{padding:'5px 10px',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.nombre}</td>
                        <td style={{padding:'5px 10px',fontFamily:'JetBrains Mono,monospace',fontSize:11}}>{r.fecha}</td>
                        <td style={{padding:'5px 10px',color:r._matched?.length?'var(--green)':'var(--gray)',fontStyle:r._matched?.length?'normal':'italic'}}>{r._display||'—'}</td>
                        <td style={{padding:'5px 8px'}}><span className={`badge ${TIPO_BADGE[r.tipo]||'badge-gray'}`} style={{fontSize:10}}>{r.tipo}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

      )}

      {/* ── MANUAL TAB ── */}
      {tab==='manual' && (
        <div>
          <p style={{fontSize:12,color:'var(--gray)',marginBottom:14}}>Completá cada fila manualmente.</p>
          {manualRows.map((row,i)=>(
            <div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 2fr 1fr auto',gap:8,marginBottom:10,alignItems:'end'}}>
              <div className="form-group" style={{marginBottom:0}}>
                {i===0&&<label className="form-label">Descripción</label>}
                <input className="form-input" value={row.nombre} onChange={e=>upRow(i,'nombre',e.target.value)} placeholder="IVA Mensual - Abril" />
              </div>
              <div className="form-group" style={{marginBottom:0}}>
                {i===0&&<label className="form-label">Tipo</label>}
                <select className="form-select" value={row.tipo} onChange={e=>upRow(i,'tipo',e.target.value)}>
                  <option value="fiscal">Fiscal</option><option value="laboral">Laboral</option><option value="societario">Societario</option>
                </select>
              </div>
              <div className="form-group" style={{marginBottom:0}}>
                {i===0&&<label className="form-label">Fecha</label>}
                <input className="form-input" type="date" value={row.fecha} onChange={e=>upRow(i,'fecha',e.target.value)} />

              <div className="form-group" style={{marginBottom:0}}>
                {i===0&&<label className="form-label">Cliente(s)</label>}
                <select className="form-select" value={row.clientes} onChange={e=>upRow(i,'clientes',e.target.value)}>

                  <option value="Todos los monotributistas">Todos los monotributistas</option>
                  {clients.map(c=><option key={c.id} value={c.nombre}>{c.nombre}</option>)}
                </select>
              </div>
              <div className="form-group" style={{marginBottom:0}}>
                {i===0&&<label className="form-label">Prioridad</label>}
                <select className="form-select" value={row.prioridad} onChange={e=>upRow(i,'prioridad',e.target.value)}>
                  <option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option>
                </select>

                <button className="btn btn-danger btn-sm" style={{height:38}} onClick={()=>delRow(i)}>✕</button>

          {csvText && <div style={{fontSize:12,color:'var(--gray)',marginTop:6}}>→ {parseCSV(csvText).length} filas válidas</div>}
        </div>

      {tab==='info' && (
        <div style={{fontSize:13,lineHeight:1.9,color:'var(--black)'}}>
          <div style={{padding:'12px 16px',background:'var(--amber2)',borderRadius:8,marginBottom:14,borderLeft:'3px solid var(--amber)'}}>
            <strong>¿Por qué no hay conexión directa con ARCA/ARBA?</strong><br/>
            Ambos organismos requieren CUIT + clave fiscal + reCAPTCHA. No existe API pública.
          </div>
          <p><strong>Métodos disponibles:</strong></p>
          <ul style={{paddingLeft:20,marginTop:8}}>
            <li style={{marginBottom:10}}><strong>📅 Archivo .ics (recomendado):</strong> Exportá tu Google Calendar o Apple Calendar con los vencimientos como .ics. El sistema detecta fechas, tipos y prioridades automáticamente.</li>
            <li style={{marginBottom:10}}><strong>🧠 Smart CSV:</strong> Usá el CSV de vencimientos 2026 provisto. El sistema asigna cada fila al cliente correcto por terminación de CUIT.</li>
            <li style={{marginBottom:10}}><strong>✏️ Manual:</strong> Cargá vencimientos uno a uno o en lote.</li>
            <li style={{marginBottom:10}}><strong>Auto-generado:</strong> Al asignar tributos a un cliente desde su perfil, el sistema genera vencimientos para los próximos 12 meses con fechas exactas según su CUIT.</li>
          </ul>
          <div style={{padding:'10px 14px',background:'var(--green2)',borderRadius:8,marginTop:10,fontSize:12,color:'#065f46',borderLeft:'3px solid var(--green)'}}>
            <strong>Cómo exportar desde Google Calendar:</strong><br/>
            Ajustes → Importar y exportar → Exportar → se descarga un .zip con archivos .ics
          </div>
        </div>
      )}
    </Modal>
  );
}


// ── GESTOR DE TRIBUTOS MODAL ─────────────────────────
// ── CATÁLOGO DE TRIBUTOS (módulo standalone) ─────────
function CatalogoTributos({ tributosCatalogo, setTributosCatalogo }) {
  const [modal, setModal]   = useState(false);
  const [form, setForm]     = useState({ label:'', categoria:'Nacional', organismo:'ARCA', periodicidad:'mensual', dia:'',id:'' });
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const CAT_ICON = { Nacional:'🏛️', Provincial:'🏠', Municipal:'🏙️', Laboral:'👷', Societario:'📂', Otro:'📋' };

  const filtered = tributosCatalogo.filter(t =>
    (t.label||'').toLowerCase().includes(search.toLowerCase()) ||
    (t.categoria||'').toLowerCase().includes(search.toLowerCase()) ||
    (t.organismo||'').toLowerCase().includes(search.toLowerCase())
  );

  const openEdit = (t) => {
    setEditId(t.id);
    setForm({ label:t.label, categoria:t.categoria, organismo:t.organismo, periodicidad:t.periodicidad, dia:t.dia||'' });
    setModal(true);
  };
  const openNew = () => {
    setEditId(null);
    setForm({ label:'', categoria:'Nacional', organismo:'ARCA', periodicidad:'mensual', dia:'', id:'' });
    setModal(true);
  };

  const handleSave = async () => {
    if (!form.label.trim()) return;
    setSaving(true);
    const payload = { label:form.label.trim(), categoria:form.categoria, organismo:form.organismo, periodicidad:form.periodicidad, dia:Number(form.dia), id:form.id||null };
    try {
      const fb = FB();
      if (editId) {
        await fb.updateDoc(fb.doc(fb.db,'tributos',editId), payload);
        setTributosCatalogo(prev => prev.map(t => t.id===editId ? {...payload,id:editId} : t));
      } else {
        const ref = await fb.addDoc(fb.collection(fb.db,'tributos'), {...payload, createdAt:fb.serverTimestamp()});
        setTributosCatalogo(prev => [...prev, {...payload, id:ref.id}]);
      }
    } catch(e) {
      if (editId) setTributosCatalogo(prev => prev.map(t => t.id===editId ? {...payload,id:editId} : t));
      else setTributosCatalogo(prev => [...prev, {...payload, id:'local-'+Date.now()}]);
    }
    setSaving(false); setModal(false); setEditId(null);
  };

  const handleDelete = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar este tributo del catálogo', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'tributos',id)); } catch(e) {}
    setTributosCatalogo(prev => prev.filter(t => t.id !== id));
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Catálogo de Tributos</div>
          <div className="page-subtitle">{tributosCatalogo.length} tributos · base para asignar a clientes y generar vencimientos</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
            tributosCatalogo.map(t=>({'Tributo':t.label,'Categoría':t.categoria,'Organismo':t.organismo,'Periodicidad':t.periodicidad,'Día':t.dia||''})),
            'Catalogo_Tributos'
          )}>📥 Excel</button>
          <button className="btn btn-gold" onClick={openNew}>+ Nuevo Tributo</button>
        </div>
      </div>

      <div className="search-wrap" style={{marginBottom:24}}>
        <span className="search-icon">🔍</span>
        <input className="search-input" placeholder="Buscar por nombre, categoría u organismo..." value={search} onChange={e=>setSearch(e.target.value)} />
      </div>

      {TRIBUTO_CATEGORIAS.map(cat => {
        const items = filtered.filter(t=>(t.categoria||'Otro')===cat);
        if (!items.length) return null;
        return (
          <div key={cat} style={{marginBottom:28}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1.5px',
              fontFamily:'JetBrains Mono,monospace',marginBottom:10,display:'flex',alignItems:'center',gap:8,
              paddingBottom:8,borderBottom:'1px solid rgba(201,169,110,0.15)'}}>
              <span>{CAT_ICON[cat]||'📋'}</span>{cat}
              <span style={{fontWeight:400,color:'var(--gray2)',letterSpacing:0}}>· {items.length} tributo{items.length!==1?'s':''}</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:10}}>
              {items.map(t=>(
                <div key={t.id} className="card" style={{padding:'14px 16px',marginBottom:0,display:'flex',alignItems:'center',gap:12}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,color:'var(--black)'}}>{t.label}</div>
                    <div style={{fontSize:11,color:'var(--gray)',marginTop:3,fontFamily:'JetBrains Mono,monospace',display:'flex',gap:8,flexWrap:'wrap'}}>
                      <span className="badge badge-blue" style={{fontSize:9}}>{t.organismo}</span>
                      <span className="badge badge-gray" style={{fontSize:9}}>{t.periodicidad}</span>
                      {t.dia && <span className="badge badge-amber" style={{fontSize:9}}>día {t.dia}</span>}
                    </div>
                  </div>
                  <div className="action-btns">
                    <button className="btn-icon edit" title="Editar" onClick={()=>openEdit(t)}>✏️</button>
                    <button className="btn-icon trash" title="Eliminar" onClick={()=>handleDelete(t.id)}>🗑️</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {filtered.length===0 && <div className="empty-state"><div className="empty-icon">📊</div><p>No hay tributos en el catálogo</p></div>}

      {modal && (
        <Modal title={editId ? '✏️ Editar Tributo' : '➕ Nuevo Tributo'} onClose={()=>{setModal(false);setEditId(null);}}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setModal(false);setEditId(null);}}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={handleSave} disabled={saving||!form.label.trim()}>
              {saving?'Guardando...':editId?'Guardar Cambios':'Crear Tributo'}
            </button>
          </>}>
          <div className="form-group">
            <label className="form-label">Nombre del Tributo *</label>
            <input className="form-input" value={form.label} onChange={e=>setForm(f=>({...f,label:e.target.value}))}
              placeholder="Ej: IVA Mensual, IIBB La Plata..." autoFocus />
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Categoría</label>
              <select className="form-select" value={form.categoria} onChange={e=>setForm(f=>({...f,categoria:e.target.value}))}>
                {TRIBUTO_CATEGORIAS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Organismo</label>
              <select className="form-select" value={form.organismo} onChange={e=>setForm(f=>({...f,organismo:e.target.value}))}>
                {TRIBUTO_ORGANISMOS.map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Periodicidad</label>
              <select className="form-select" value={form.periodicidad} onChange={e=>setForm(f=>({...f,periodicidad:e.target.value}))}>
                {TRIBUTO_PERIODICIDADES.map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Día de vencimiento <span style={{color:'var(--gray2)',fontWeight:400}}>(opcional)</span></label>
              <input className="form-input" type="number" min="1" max="31" value={form.dia}
                onChange={e=>setForm(f=>({...f,dia:e.target.value}))} placeholder="Ej: 20" />
            </div>
            <div className="form-group">
              <label className="form-label">ID <span style={{color:'var(--gray2)',fontWeight:400}}>(opcional)</span></label>
              <input className="form-input" type="text" value={form.id}
                onChange={e=>setForm(f=>({...f,id:e.target.value}))} placeholder="Ej: siradig" />
            </div>
          </div>
          <div style={{padding:'10px 14px',background:'var(--blue2)',borderRadius:8,fontSize:12,color:'#1e40af',marginTop:4}}>
            💡 El día se usa para generar automáticamente vencimientos al asignar este tributo a un cliente.
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────
function App() {
  const [user, setUser]             = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [section, setSection]       = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  const [clients, setClients]             = useState([]);
  const [vencimientos, setVencimientos]   = useState([]);
  const [tributosCatalogo, setTributosCatalogo] = useState(TRIBUTOS_SEED);
  const [cobros, setCobros]               = useState([]);
  const [facturas, setFacturas]           = useState([]);
  const [tareas, setTareas]               = useState([]);
  const [notas, setNotas]                 = useState([]);

  // Auth listener
  useEffect(() => {
    const fb = FB();
    if (!fb?.auth) { setAuthLoading(false); return; }
    const unsub = fb.onAuthStateChanged(fb.auth, (u) => { setUser(u); setAuthLoading(false); });
    return unsub;
  }, []);

  // Load Firestore data
  useEffect(() => {
    if (!user) return;
    const fb = FB();
    if (!fb?.db) return;

    // clients
    fb.getDocs(fb.collection(fb.db,'clients')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setClients(data);
      }
    }).catch(()=>{});

    // vencimientos
    fb.getDocs(fb.collection(fb.db,'vencimientos')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setVencimientos(data);
      }
    }).catch(()=>{});

    // tributos catalog — seed if empty
    fb.getDocs(fb.collection(fb.db,'tributos')).then(snap => {
      if (snap.empty) {
        // Seed the collection from TRIBUTOS_SEED
        Promise.all(TRIBUTOS_SEED.map(t => fb.addDoc(fb.collection(fb.db,'tributos'), {...t, createdAt:fb.serverTimestamp()})
          .then(ref => ({...t, id:ref.id}))
          .catch(() => t)
        )).then(seeded => setTributosCatalogo(seeded));
      } else {
        setTributosCatalogo(snap.docs.map(d=>({id:d.id,...d.data()})));
      }
    }).catch(()=>{});

    // tareas
    fb.getDocs(fb.collection(fb.db,'tareas')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setTareas(data);
      }
    }).catch(()=>{});

    // notas
    fb.getDocs(fb.collection(fb.db,'notas')).then(snap => {
      if (!snap.empty) {
        const data = snap.docs.map(d=>({id:d.id,...d.data()}));
        setNotas(data);
      }
    }).catch(()=>{});
    // cobros
    fb.getDocs(fb.collection(fb.db,'cobros')).then(snap => {
      if (!snap.empty) setCobros(snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)));
    }).catch(()=>{});
    // facturas
    fb.getDocs(fb.collection(fb.db,'facturas')).then(snap => {
      if (!snap.empty) {
        const data=snap.docs.map(d=>({id:d.id,...d.data()}));
        setFacturas(data);
      }
    }).catch(()=>{});
    // auto-generate monthly charges on first of month
    const todayD=new Date();
    const monthKey=`charges-${todayD.getFullYear()}-${todayD.getMonth()}`;
    if (todayD.getDate()>=1 && !localStorage.getItem(monthKey)) {
      // will run after clients load — use a small delay
      setTimeout(()=>{
        setClients(current => {
          const active=current.filter(c=>c.estado==='activo'&&c.honorario>0);
          const mesLabel=`${MONTHS_FULL[todayD.getMonth()]} ${todayD.getFullYear()}`;
          const newFacts=active.map(c=>({
            id:'auto-'+c.id+'-'+monthKey,
            clienteId:c.id, cliente:c.nombre,
            concepto:`${c.servicio||'Honorarios'} - ${mesLabel}`,
            monto:c.honorario, fecha:todayStr, estado:'pendiente'
          }));
          setFacturas(prev=>{
            const autoIds=newFacts.map(f=>f.id);
            const filtered=prev.filter(f=>!autoIds.includes(f.id));
            return [...filtered,...newFacts];
          });
          // Save to firebase
          const fb2=FB();
          newFacts.forEach(f=>{
            fb2?.addDoc(fb2.collection(fb2.db,'facturas'),{...f,autoGenerado:true,createdAt:fb2.serverTimestamp()}).catch(()=>{});
          });
          localStorage.setItem(monthKey,'done');
          return current;
        });
      },1500);
    }
  }, [user]);

  const handleLogout = async () => { try { await FB().signOut(FB().auth); } catch(e){} setUser(null); };

  if (authLoading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--black)'}}>
      <div><div className="spinner" style={{width:48,height:48,borderWidth:4,margin:'0 auto 20px'}} />
        <div style={{color:'var(--gold2)',fontFamily:'Playfair Display,serif',textAlign:'center'}}>Cargando...</div>
      </div>
    </div>
  );

  if (!user) return <LoginScreen onLogin={()=>{}} />;

  const NAV = [
    { id:'dashboard',    label:'Dashboard',    icon:'🏠' },
    { id:'clientes',     label:'Clientes',     icon:'👥' },
    { id:'vencimientos', label:'Vencimientos', icon:'📅', badge:vencimientos.filter(v=>!v.completado&&daysUntil(v.fecha)<=7).length||null },
    { id:'cobros',       label:'Facturación / Cobros', icon:'💰' },
    { id:'finanzas',     label:'Finanzas',     icon:'📊' },
    { id:'tareas',       label:'Tareas',       icon:'✅', badge:tareas.filter(t=>!t.completado).length||null, badgeClass:'amber' },
    { id:'notas',        label:'Notas',        icon:'📝' },
    { id:'catalogo',     label:'Tributos',     icon:'⚙️' },
  ];

  const S = (id) => ({ style: { display: section===id ? 'block' : 'none' } });

  return (
    <div className="app-layout">
      <aside className={`sidebar ${sidebarCollapsed?'collapsed':''}`}>
        {/* Toggle button */}
        <div className="sidebar-toggle" onClick={()=>setSidebarCollapsed(c=>!c)} title={sidebarCollapsed?'Expandir menú':'Colapsar menú'}>
          {sidebarCollapsed ? '›' : '‹'}
        </div>

        <div className="sidebar-header">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:38,height:38,borderRadius:10,background:'linear-gradient(135deg,var(--gold),var(--gold2))',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Playfair Display,serif',fontWeight:900,fontSize:16,color:'var(--black)',flexShrink:0}}>AP</div>
            {!sidebarCollapsed && (
              <div>
                <div className="sidebar-brand">Aragón Paz</div>
                <div className="sidebar-brand-sub">Estudio Contable</div>
              </div>
            )}
          </div>
        </div>

        <nav className="sidebar-nav">
          {!sidebarCollapsed && <div className="nav-section-label">Principal</div>}
          {NAV.map(item => (
            <div key={item.id} className={`nav-item ${section===item.id?'active':''}`}
              onClick={()=>setSection(item.id)} data-tooltip={item.label}>
              <span className="nav-icon">{item.icon}</span>
              {!sidebarCollapsed && <span className="nav-label">{item.label}</span>}
              {!sidebarCollapsed && item.badge>0 && <span className={`nav-badge ${item.badgeClass||''}`}>{item.badge}</span>}
            </div>
          ))}
        </nav>

        <div className="sidebar-user">
          <div className="user-avatar">
            {user.photoURL ? <img src={user.photoURL} alt={user.displayName} /> : initials(user.displayName||user.email)}
          </div>
          {!sidebarCollapsed && (
            <div className="user-info" style={{flex:1,minWidth:0}}>
              <div className="user-name">{user.displayName?.split(' ')[0]||'Usuario'}</div>
              <div className="user-role">Contador</div>
            </div>
          )}
          {!sidebarCollapsed && <button className="btn-logout" onClick={handleLogout} title="Cerrar sesión">⏻</button>}
        </div>
      </aside>

      <main className={`main ${sidebarCollapsed?'collapsed':''}`}>
        <div {...S('dashboard')}><Dashboard clients={clients} vencimientos={vencimientos} tareas={tareas} notas={notas} setSection={setSection} setTareas={setTareas} /></div>
        <div {...S('clientes')}><Clientes clients={clients} setClients={setClients} vencimientos={vencimientos} setVencimientos={setVencimientos} tributosCatalogo={tributosCatalogo} setTributosCatalogo={setTributosCatalogo} tareas={tareas} setTareas={setTareas} /></div>
        <div {...S('vencimientos')}><Vencimientos vencimientos={vencimientos} setVencimientos={setVencimientos} clients={clients} tareas={tareas} setTareas={setTareas} /></div>
        <div {...S('cobros')}><Cobros clients={clients} setClients={setClients} facturas={facturas} setFacturas={setFacturas} cobros={cobros} setCobros={setCobros} /></div>
        <div {...S('tareas')}><Tareas tareas={tareas} setTareas={setTareas} clients={clients} /></div>
        <div {...S('notas')}><Notas notas={notas} setNotas={setNotas} clients={clients} /></div>
        <div {...S('finanzas')}><Finanzas cobros={cobros} setCobros={setCobros} facturas={facturas} setFacturas={setFacturas} /></div>
        <div {...S('catalogo')}><CatalogoTributos tributosCatalogo={tributosCatalogo} setTributosCatalogo={setTributosCatalogo} /></div>
      </main>

      {/* ── BOTTOM NAV — solo visible en mobile (< 768px) via CSS ── */}
      <nav className="bottom-nav">
        {[
          { id:'dashboard',    icon:'🏠', label:'Inicio' },
          { id:'clientes',     icon:'👥', label:'Clientes' },
          { id:'vencimientos', icon:'📅', label:'Venc.',  badge: vencimientos.filter(v=>!v.completado&&daysUntil(v.fecha)<=7).length||null },
          { id:'cobros',       icon:'💰', label:'Cobros' },
          { id:'tareas',       icon:'✅', label:'Tareas', badge: tareas.filter(t=>!t.completado).length||null },
          { id:'notas',        icon:'📝', label:'Notas' },
        ].map(item => (
          <button key={item.id}
            className={`bottom-nav-item ${section===item.id?'active':''}`}
            onClick={()=>setSection(item.id)}>
            {item.badge > 0 && <span className="bottom-nav-badge">{item.badge}</span>}
            <span className="bottom-nav-icon">{item.icon}</span>
            <span className="bottom-nav-label">{item.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

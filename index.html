  );
}

// ── VENCIMIENTOS (CALENDARIO) ────────────────────────
function Vencimientos({ vencimientos, setVencimientos, clients, tareas, setTareas }) {
  const now = new Date();
  const [calYear,  setCalYear]  = useState(now.getFullYear());
  const [calMonth, setCalMonth] = useState(now.getMonth());     // 0-based
  const [selDate,  setSelDate]  = useState(todayStr);           // 'YYYY-MM-DD'
  const [modal,    setModal]    = useState(null);
  const [form,     setForm]     = useState({});
  const [selVenc,  setSelVenc]  = useState(null);
  const [showImport, setShowImport]       = useState(false);
  const [vencDetail, setVencDetail]       = useState(null); // grupo para modal detalle
  const [debugDay, setDebugDay]           = useState(null); // debug modal

  // helpers
  const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
  const firstDow    = (y,m) => new Date(y, m, 1).getDay(); // 0=Sun
  const ymd = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  // ── Match vencimiento → clientes que tienen ese tributo ─────
  // ═══════════════════════════════════════════════════════════
  // MATCHING: vencimiento → clientes afectados
  //
  // Regla única y simple:
  //   1. Detectar qué tributo corresponde al nombre del vencimiento
  //   2. Si tiene rango CUIT en el nombre → filtrar por penúltimo dígito del CUIT
  //   3. El cliente DEBE tener ese tributo id en su array tributos[]
  //   4. Nunca inferir — si no está en tributos[], no aplica
  // ═══════════════════════════════════════════════════════════

  // Mapeo nombre del vencimiento → id del tributo en el catálogo
  const TRIBUTO_KEYWORDS = [
    { id: 'recat_mono',  words: ['recategori'] },
    { id: 'monotributo', words: ['monotributo'] },
    { id: 'autonomos',   words: ['autónomos', 'autonomos'] },
    { id: 'ganancias',   words: ['ganancias'] },
    { id: 'iibb_cm',     words: ['convenio multilateral', 'multilateral', 'cm0'] },
    { id: 'iibb_anual',  words: ['iibb', 'ingresos brutos'], extra: n => n.includes('anual') },
    { id: 'iibb',        words: ['iibb', 'ingresos brutos'] },
    { id: 'iva',         words: ['iva'] },
    { id: 'f931',        words: ['f.931', 'f931', 'suss', 'siradig', 'f572'] },
    { id: 'bienes_pers', words: ['bienes personales'] },
    { id: 'imp_sellos',  words: ['sellos'] },
    { id: 'imp_inmob',   words: ['inmobiliario'] },
    { id: 'automotores', words: ['automotor', 'patente'] },
    { id: 'sueldos',     words: ['sueldo', 'remuneracion', 'remuneración'] },
  ];

  const getTributoId = (nombre) => {
    const n = (nombre || '').toLowerCase();
    for (const entry of TRIBUTO_KEYWORDS) {
      if (entry.extra && !entry.extra(n)) continue;
      if (entry.words.some(w => n.includes(w))) return entry.id;
    }
    return null;
  };

  // Extrae el rango de terminación CUIT del nombre del vencimiento
  // "CUIT term. 0-3" → [0,1,2,3]   |   sin rango → null
  const getCuitRange = (nombre) => {
    const m = (nombre || '').match(/CUIT[^0-9]*term[^0-9]*(\d)\s*[-–y]\s*(\d)/i);
    if (!m) return null;
    const from = parseInt(m[1]), to = parseInt(m[2]);
    return Array.from({ length: to - from + 1 }, (_, i) => from + i);
  };

  // Penúltimo dígito del CUIT (el que usa AFIP para escalonar vencimientos)
  // CUIT 20-12345678-9 → sin guiones: 20123456789 → penúltimo: 8
  const getCuitDigit = (cuit) => {
    const limpio = (cuit || '').replace(/[-\s]/g, '');
    if (limpio.length < 2) return NaN;
    return parseInt(limpio[limpio.length - 2]);
  };

  // Retorna los clientes que aplican a un vencimiento individual
  const getClientesDelVenc = (v) => {
    const tributeId = getTributoId(v.nombre);
    if (!tributeId) return { matched: [], fallbackText: v.clientes || null };

    const cuitRange = getCuitRange(v.nombre);

    const matched = clients.filter(c => {
      if (c.estado === 'inactivo') return false;
      // Tributo explícito requerido
      const tiene = Array.isArray(c.tributos) && c.tributos.some(t => t.id === tributeId);

      if (!tiene) return false;
      // Con rango CUIT: validar penúltimo dígito
      if (cuitRange) {
        const d = getCuitDigit(c.cuit);

        return !isNaN(d) && cuitRange.includes(d);
      }
      return true;
    });

    return {
      matched,
      fallbackText: matched.length === 0 ? (v.clientes || null) : null
    };
  };

  // Para un GRUPO (varios vencimientos con mismo nombre base):
  // llama getClientesDelVenc por cada item y deduplica
  const getClientesDelGrupo = (grupo) => {
    const map = new Map();
    let fallback = null;
    grupo.items.forEach(v => {
      const { matched, fallbackText } = getClientesDelVenc(v);
      matched.forEach(c => map.set(c.id, c));
      if (fallbackText && !fallback) fallback = fallbackText;
    });
    const matched = [...map.values()];
    return { matched, fallbackText: matched.length === 0 ? fallback : null };
  };



  const prevMonth = () => {
    if (calMonth === 0) { setCalYear(y=>y-1); setCalMonth(11); }
    else setCalMonth(m=>m-1);
  };
  const nextMonth = () => {
    if (calMonth === 11) { setCalYear(y=>y+1); setCalMonth(0); }
    else setCalMonth(m=>m+1);
  };

  // group vencimientos by date string
  const byDate = {};
  vencimientos.forEach(v => {
    if (!byDate[v.fecha]) byDate[v.fecha] = [];
    byDate[v.fecha].push(v);
  });
  // Inject recurring task instances as virtual vencimientos
  (tareas || []).filter(t => t.recurrenteId && t.fecha && !t.recurrente).forEach(t => {
    const entry = {
      id:         t.id,
      nombre:     `🔁 ${t.texto}`,
      tipo:       'tarea',
      fecha:      t.fecha,
      clientes:   t.cliente || '',
      clienteId:  t.clienteId || '',
      completado: t.completado,
      esTareaRecurrente: true,
    };
    if (!byDate[t.fecha]) byDate[t.fecha] = [];
    byDate[t.fecha].push(entry);
  });

  // vencimientos for selected day
  const dayVenc = (byDate[selDate] || []).sort((a,b)=>a.completado-b.completado);

  const toggle = async (id) => {
    // Check if this is a recurring task instance
    const tarea = (tareas||[]).find(x => x.id === id && x.esTareaRecurrente !== undefined || (x.id === id && x.recurrenteId));
    if (tarea || (tareas||[]).find(x=>x.id===id && x.recurrenteId)) {
      const t = (tareas||[]).find(x=>x.id===id);
      if (!t) return;
      try { await FB().updateDoc(FB().doc(FB().db,'tareas',id),{completado:!t.completado}); } catch(e){}
      setTareas(prev=>prev.map(x=>x.id===id?{...x,completado:!x.completado}:x));
      return;
    }
    const v = vencimientos.find(x=>x.id===id);
    if (!v) return;
    try { await FB().updateDoc(FB().doc(FB().db,'vencimientos',id),{completado:!v.completado}); } catch(e) {}
    setVencimientos(prev=>prev.map(x=>x.id===id?{...x,completado:!x.completado}:x));
  };

  // Marcar completado/pendiente un grupo entero de vencimientos
  const toggleGroup = async (ids, nuevoEstado) => {
    const fb = FB();
    await Promise.all(ids.map(id =>
      fb.updateDoc(fb.doc(fb.db,'vencimientos',id),{completado:nuevoEstado}).catch(()=>{})
    ));
    setVencimientos(prev=>prev.map(x=>ids.includes(x.id)?{...x,completado:nuevoEstado}:x));
  };

  // Agrupar vencimientos de un día en tarjetas únicas por "nombre base"
  // Ej: "IVA Enero 2026 — CUIT term. 0-1" y "IVA Enero 2026 — CUIT term. 2-3"
  //     → grupo "IVA Enero 2026" con todos sus docs
  const groupVenc = (vencList) => {
    const grupos = {};
    vencList.forEach(v => {
      // Nombre base: quitar sufijo " — CUIT term. X-X" o similar
      const base = v.nombre
        .replace(/\s*[—–-]+\s*CUIT\s+term[^$]*/i, '')
        .replace(/\s*[—–-]+\s*CUIT\s+terminaci[^$]*/i, '')
        .trim();
      // Agrupar por base + fecha para no mezclar días distintos
      const key = base + '||' + v.fecha;
      if (!grupos[key]) {
        grupos[key] = { base, items: [], tipo: v.tipo, prioridad: v.prioridad, fecha: v.fecha };
      }
      grupos[key].items.push(v);
    });
    // Ordenar: por fecha, luego pendientes primero, luego nombre
    return Object.values(grupos).sort((a,b) => {
      const fechaDiff = new Date(a.fecha) - new Date(b.fecha);
      if (fechaDiff !== 0) return fechaDiff;
      const aPend = a.items.some(x=>!x.completado);
      const bPend = b.items.some(x=>!x.completado);
      if (aPend !== bPend) return aPend ? -1 : 1;
      return a.base.localeCompare(b.base);
    });
  };

  // Compute date for Nth weekday in a month
  // weekN: 1..4 or -1 (last), dowTarget: 0=Sun..6=Sat
  const nthWeekday = (year, month, weekN, dowTarget) => {
    if (weekN === -1) {
      // Last occurrence
      let d = new Date(year, month+1, 0); // last day of month
      while (d.getDay() !== dowTarget) d.setDate(d.getDate()-1);
      return d;
    }
    let d = new Date(year, month, 1);
    let count = 0;
    while (true) {
      if (d.getDay() === dowTarget) { count++; if (count === weekN) return d; }
      d.setDate(d.getDate()+1);
      if (d.getMonth() !== month) return null;
    }
  };

  // Generate recurring dates based on form periodicidad
  const buildFechas = (f) => {
    const per = f.periodicidad || 'puntual';
    const now = new Date();
    const dates = [];
    if (per === 'puntual' || per === 'anual') {
      if (!f.fecha) return [];
      if (per === 'puntual') return [f.fecha];
      // anual: generate next 5 years
      const base = new Date(f.fecha + 'T12:00:00');
      for (let i = 0; i < 5; i++) {
        const d = new Date(base);
        d.setFullYear(base.getFullYear() + i);
        dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
      }
      return dates;
    }
    const dia = parseInt(f.diaMes) || 20;
    const step = per==='bimestral'?2 : per==='trimestral'?3 : 1;
    const months = per==='anual'?1 : per==='trimestral'?4 : per==='bimestral'?6 : 12;
    for (let i = 0; i < months; i += step) {
      const yr  = now.getMonth()+i > 11 ? now.getFullYear()+Math.floor((now.getMonth()+i)/12) : now.getFullYear();
      const mon = (now.getMonth()+i)%12;
      const maxD = new Date(yr, mon+1, 0).getDate();
      const d = Math.min(dia, maxD);
      dates.push(`${yr}-${String(mon+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    }
    return dates;
    if (per === 'mensual-n') {
      const semana = parseInt(f.semana)||4;
      const dow = parseInt(f.diaSemana)||4;
      for (let i = 0; i < 12; i++) {
        const yr  = now.getMonth()+i > 11 ? now.getFullYear()+Math.floor((now.getMonth()+i)/12) : now.getFullYear();
        const mon = (now.getMonth()+i)%12;
        const target = nthWeekday(yr, mon, semana, dow);
        if (target) {
          dates.push(`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`);
        }
      }
      return dates;
    }
    return dates;
  };

  const handleSave = async () => {
    if (!form.nombre) return;
    const per = form.periodicidad || 'puntual';
    // Validation
    if ((per==='puntual'||per==='anual') && !form.fecha) return;
    if ((per==='mensual'||per==='bimestral'||per==='trimestral') && !form.diaMes) return;

    if (selVenc) {
      // Simple update of single record
      const payload = {...form, completado: selVenc.completado};
      try {
        await FB().updateDoc(FB().doc(FB().db,'vencimientos',selVenc.id), payload);
        setVencimientos(prev=>prev.map(x=>x.id===selVenc.id?{...payload,id:selVenc.id}:x));
      } catch(e) {
        setVencimientos(prev=>prev.map(x=>x.id===selVenc.id?{...payload,id:selVenc.id}:x));
      }
    } else {
      // Build all dates based on periodicidad
      let fechas;
      if (per === 'mensual-n') {
        const semana = parseInt(form.semana)||4;
        const dow = parseInt(form.diaSemana)||4;
        fechas = [];
        const now2 = new Date();
        for (let i = 0; i < 12; i++) {
          const yr  = now2.getMonth()+i > 11 ? now2.getFullYear()+Math.floor((now2.getMonth()+i)/12) : now2.getFullYear();
          const mon = (now2.getMonth()+i)%12;
          const target = nthWeekday(yr, mon, semana, dow);
          if (target) {
            fechas.push(`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`);
          }
        }
      } else {
        fechas = buildFechas(form);
      }
      if (!fechas.length) return;
      const base = { nombre:form.nombre, tipo:form.tipo||'fiscal', clientes:form.clientes||'',
        prioridad:form.prioridad||'media', completado:false, periodicidad:per,
        notas:form.notas||'' };
      const newVenc = [];
      for (const fecha of fechas) {
        const v = {...base, fecha};
        try {
          const ref = await FB().addDoc(FB().collection(FB().db,'vencimientos'),{...v,createdAt:FB().serverTimestamp()});
          newVenc.push({...v,id:ref.id});
        } catch(e) {
          newVenc.push({...v,id:'local-'+Date.now()+Math.random()});
        }
      }
      setVencimientos(prev=>[...prev,...newVenc]);
    }
    setModal(null); setSelVenc(null);
  };

  const handleDelete = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar este vencimiento', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'vencimientos',id)); } catch(e) {}
    setVencimientos(prev=>prev.filter(x=>x.id!==id));
  };

  const openNew = () => {
    setSelVenc(null);
    setForm({tipo:'fiscal',prioridad:'media',fecha:selDate});
    setModal('form');
  };
  const openEdit = (v) => {
    setSelVenc(v);
    setForm({...v});
    setModal('form');
  };

  // dot color for a date
  const dotColor = (dateStr) => {
    const vs = byDate[dateStr]||[];
    if (!vs.length) return null;
    const pending = vs.filter(v=>!v.completado);
    if (!pending.length) return 'var(--green)';
    const hasUrgent = pending.some(v=>daysUntil(dateStr)<=7);
    return hasUrgent ? 'var(--red)' : 'var(--gold)';
  };

  const days = daysInMonth(calYear, calMonth);
  const firstDay = firstDow(calYear, calMonth);  // 0=Sun
  // adjust to Mon-start: 0=Mon…6=Sun
  const startOffset = (firstDay + 6) % 7;
  const DOW_LABELS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Agenda de Vencimientos</div>
          <div className="page-subtitle">Calendario fiscal · {MONTHS_FULL[calMonth]} {calYear}</div>
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
            vencimientos.map(v=>({'Descripción':v.nombre,'Fecha':v.fecha,'Tipo':v.tipo||'','Cliente':v.clientes||'','Prioridad':v.prioridad||'','Estado':v.completado?'Completado':'Pendiente'})),
            'Vencimientos'
          )}>📥 Excel</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowImport(true)}>📋 Importar</button>
          <button className="btn btn-gold" onClick={openNew}>+ Nuevo Vencimiento</button>
        </div>
      </div>

      <div style={{display:'flex',gap:20,alignItems:'flex-start'}}>

        {/* ── CALENDAR ── */}
        <div style={{flex:1,minWidth:0}}>
          <div className="card" style={{padding:20}}>
            {/* Month nav */}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
              <button className="btn btn-ghost btn-sm" onClick={prevMonth}>‹ Ant</button>
              <div style={{fontFamily:'Playfair Display,serif',fontSize:20,fontWeight:700,color:'var(--black)'}}>
                {MONTHS_FULL[calMonth]} {calYear}
              </div>
              <button className="btn btn-ghost btn-sm" onClick={nextMonth}>Sig ›</button>
            </div>

            {/* DOW headers */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,marginBottom:8}}>
              {DOW_LABELS.map(d=>(
                <div key={d} style={{textAlign:'center',fontSize:11,fontWeight:700,color:'var(--gray2)',
                  textTransform:'uppercase',letterSpacing:'0.5px',fontFamily:'JetBrains Mono,monospace',padding:'4px 0'}}>
                  {d}
                </div>
              ))}
            </div>

            {/* Day cells */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
              {/* empty cells before month start */}
              {Array.from({length:startOffset}).map((_,i)=>(
                <div key={'e'+i} style={{aspectRatio:'1',borderRadius:10}} />
              ))}
              {Array.from({length:days}).map((_,i)=>{
                const d = i+1;
                const dateStr = ymd(calYear,calMonth,d);
                const isToday = dateStr === todayStr;
                const isSel   = dateStr === selDate;
                const dot     = dotColor(dateStr);
                const count   = (byDate[dateStr]||[]).filter(v=>!v.completado).length;
                return (
                  <div key={d} onClick={()=>setSelDate(dateStr)}
                    style={{
                      aspectRatio:'1',borderRadius:10,display:'flex',flexDirection:'column',
                      alignItems:'center',justifyContent:'center',cursor:'pointer',
                      transition:'all 0.15s',position:'relative',
                      background: isSel ? 'var(--black)' : isToday ? 'rgba(201,169,110,0.15)' : 'var(--cream)',
                      border: isToday && !isSel ? '2px solid var(--gold)' : '2px solid transparent',
                    }}>
                    <div style={{fontSize:14,fontWeight:isSel||isToday?700:400,
                      color:isSel?'var(--gold2)':isToday?'var(--gold)':'var(--black)'}}>
                      {d}
                    </div>
                    {dot && (
                      <div style={{display:'flex',gap:2,marginTop:2}}>
                        {count>0 && Array.from({length:Math.min(count,3)}).map((_,i)=>(
                          <div key={i} style={{width:5,height:5,borderRadius:'50%',background:dot}} />
                        ))}
                        {count>3 && <div style={{width:5,height:5,borderRadius:'50%',background:dot,opacity:0.5}} />}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Legend */}
            <div style={{display:'flex',gap:16,marginTop:16,paddingTop:14,borderTop:'1px solid var(--cream2)',flexWrap:'wrap'}}>
              {[['var(--red)','Urgente / Vencido'],['var(--gold)','Pendiente'],['var(--green)','Completado']].map(([c,l])=>(
                <div key={l} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--gray)'}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:c}} />{l}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* ── PANEL LATERAL ── */}
        <div style={{width:360,flexShrink:0,position:'sticky',top:20}}>
          <div className="card" style={{padding:0,overflow:'hidden'}}>
            {/* Panel header */}
            <div style={{background:'linear-gradient(135deg,var(--black),var(--black2))',padding:'18px 20px',
              display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontFamily:'Playfair Display,serif',fontSize:17,fontWeight:700,color:'var(--gold2)'}}>
                  {selDate === todayStr ? '📅 Hoy' : fmtDate(selDate)}
                </div>
                <div style={{fontSize:11,color:'rgba(250,248,243,0.5)',marginTop:2}}>
                  {dayVenc.length === 0 ? 'Sin vencimientos' :
                   `${dayVenc.filter(v=>!v.completado).length} pendiente${dayVenc.filter(v=>!v.completado).length!==1?'s':''}`}

                {dayVenc.length > 0 && (
                  <button
                    onClick={()=>setDebugDay(selDate)}
                    style={{marginTop:6,padding:'2px 8px',fontSize:9,background:'rgba(255,255,255,0.15)',
                      border:'1px solid rgba(255,255,255,0.3)',borderRadius:4,color:'white',cursor:'pointer',
                      fontFamily:'monospace'}}>
                    🔍 debug
                  </button>
                )}
              </div>
              <button className="btn btn-gold btn-sm" onClick={openNew} style={{fontSize:12}}>+ Agregar</button>
            </div>

            <div style={{padding:16,maxHeight:520,overflowY:'auto'}}>
              {dayVenc.length === 0 ? (
                <div className="empty-state" style={{padding:'36px 16px'}}>
                  <div className="empty-icon" style={{fontSize:32}}>🎉</div>
                  <p>Sin vencimientos para este día</p>
                </div>
              ) : (
                (() => {
                  const grupos = groupVenc(dayVenc);
                  return grupos.map(grupo => {
                    const ids   = grupo.items.map(x=>x.id);
                    const allDone  = grupo.items.every(x=>x.completado);
                    const someDone = grupo.items.some(x=>x.completado) && !allDone;
                    const days     = daysUntil(grupo.fecha);
                    const { matched: cMatch } = getClientesDelGrupo(grupo);

                    return (
                      <div key={grupo.base+'||'+grupo.fecha} style={{
                        padding:'12px 14px',borderRadius:10,marginBottom:8,
                        background: allDone ? 'var(--cream)' : days<0 ? 'rgba(192,57,43,0.06)' : days<=3 ? 'rgba(192,57,43,0.04)' : 'rgba(201,169,110,0.04)',
                        border: allDone ? '1px solid var(--cream2)' : days<0 ? '1px solid rgba(192,57,43,0.25)' : days<=3 ? '1px solid rgba(192,57,43,0.18)' : '1px solid rgba(201,169,110,0.2)',
                        opacity: allDone ? 0.65 : 1,
                      }}>
                        <div style={{display:'flex',alignItems:'flex-start',gap:10}}>

                          {/* Checkbox grupo */}
                          <div onClick={()=>toggleGroup(ids,!allDone)} style={{
                            marginTop:2,flexShrink:0,width:16,height:16,borderRadius:4,
                            border: allDone ? '2px solid var(--gold)' : someDone ? '2px solid var(--gold)' : '2px solid var(--gray3)',
                            background: allDone ? 'var(--gold)' : someDone ? 'rgba(201,169,110,0.3)' : 'transparent',
                            cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.15s'
                          }}>
                            {allDone && <span style={{fontSize:10,color:'white',lineHeight:1}}>✓</span>}
                            {someDone && <span style={{fontSize:10,color:'var(--gold)',lineHeight:1}}>–</span>}
                          </div>

                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:600,color:'var(--black)',
                              textDecoration:allDone?'line-through':'none',lineHeight:1.3}}>
                              {grupo.base}
                            </div>
                            <div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap',alignItems:'center'}}>
                              <span className={`badge ${grupo.tipo==='fiscal'?'badge-blue':grupo.tipo==='laboral'?'badge-gold':'badge-gray'}`} style={{fontSize:9}}>
                                {grupo.tipo||'fiscal'}
                              </span>
                              <span className={`badge ${grupo.prioridad==='alta'?'badge-red':grupo.prioridad==='baja'?'badge-green':'badge-gold'}`} style={{fontSize:9}}>
                                {grupo.prioridad||'media'}
                              </span>
                              {grupo.items.length > 1 && (
                                <span className="badge badge-gray"
                                  style={{fontSize:9,cursor:'pointer',textDecoration:'underline dotted'}}
                                  onClick={e=>{e.stopPropagation();setVencDetail(grupo);}}>
                                  {grupo.items.length} venc.
                                </span>
                              )}
                            </div>

                            {cMatch.length > 0 && (
                              <div style={{marginTop:8,paddingTop:7,borderTop:'1px dashed var(--cream2)'}}>
                                <div style={{fontSize:9,fontWeight:700,color:'var(--gray)',
                                  textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5}}>
                                  {cMatch.length} cliente{cMatch.length!==1?'s':''} afectado{cMatch.length!==1?'s':''}
                                </div>
                                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                                  {cMatch.slice(0,8).map(c=>(
                                    <span key={c.id} style={{
                                      fontSize:10,padding:'2px 8px',borderRadius:20,
                                      background:'rgba(201,169,110,0.12)',
                                      color:'var(--black)',border:'1px solid rgba(201,169,110,0.35)',
                                      fontWeight:500,whiteSpace:'nowrap',
                                      maxWidth:140,overflow:'hidden',textOverflow:'ellipsis'
                                    }}>{c.nombre}</span>
                                  ))}
                                  {cMatch.length > 8 && (
                                    <span style={{fontSize:10,color:'var(--gray)',padding:'2px 4px'}}>
                                      +{cMatch.length-8} más
                                    </span>
                                  )}
                                </div>
                              </div>
                            )}
                          </div>

                          <div style={{display:'flex',gap:4,flexShrink:0}}>
                            <button className="btn btn-ghost btn-sm btn-icon" style={{width:28,height:28,fontSize:12}}
                              onClick={()=>openEdit(grupo.items[0])}>✏️</button>
                            <button className="btn btn-danger btn-sm btn-icon" style={{width:28,height:28,fontSize:12}}
                              onClick={async()=>{
                                const ok = await Swal.fire({
                                  icon:'warning',title:'¿Eliminar vencimiento?',
                                  text: grupo.items.length>1 ? 'Se eliminarán '+grupo.items.length+' registros agrupados.' : 'Se eliminará este vencimiento.',
                                  showCancelButton:true,confirmButtonText:'Sí, eliminar',
                                  cancelButtonText:'Cancelar',customClass:{popup:'swal-ap'}
                                });
                                if (!ok.isConfirmed) return;
                                const fb = FB();
                                await Promise.all(ids.map(id=>fb.deleteDoc(fb.doc(fb.db,'vencimientos',id)).catch(()=>{})));
                                setVencimientos(prev=>prev.filter(x=>!ids.includes(x.id)));
                              }}>🗑️</button>
                          </div>
                        </div>
                      </div>
                    );
                  });
                })()
              )}            </div>
          </div>

                    {/* Próximos 7 días — agrupados */}
          <div className="card" style={{marginTop:16,padding:16}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--gray)',textTransform:'uppercase',
              letterSpacing:'1px',fontFamily:'JetBrains Mono,monospace',marginBottom:12}}>
              Próximos 7 días
            </div>
            {(() => {
              const proximos = vencimientos
                .filter(v=>!v.completado && daysUntil(v.fecha)>=0 && daysUntil(v.fecha)<=7)
                .sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
              if (proximos.length===0) return (
                <div style={{fontSize:12,color:'var(--green)',fontWeight:600}}>✓ Sin urgencias esta semana</div>
              );
              // Agrupar por nombre base + fecha
              const grupos = groupVenc(proximos);
              return grupos.map(grupo=>{
                const d = new Date(grupo.fecha+'T12:00:00');
                const { matched: pMatch, fallbackText: pFallback } = getClientesDelGrupo(grupo);
                const ids = grupo.items.map(x=>x.id);
                const allDone = grupo.items.every(x=>x.completado);
                return (
                  <div key={grupo.base+grupo.fecha} onClick={()=>setSelDate(grupo.fecha)}
                    style={{padding:'9px 0',borderBottom:'1px solid var(--cream2)',cursor:'pointer',
                      opacity: allDone ? 0.5 : 1}}>
                    <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                      <div style={{width:32,height:32,borderRadius:8,background:'var(--red2)',
                        display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                        flexShrink:0,marginTop:1}}>
                        <div style={{fontSize:14,fontWeight:700,color:'var(--red)',lineHeight:1}}>{d.getDate()}</div>
                        <div style={{fontSize:8,color:'var(--red)',textTransform:'uppercase',
                          fontFamily:'JetBrains Mono,monospace'}}>{MONTHS_ES[d.getMonth()]}</div>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:600,overflow:'hidden',
                          textOverflow:'ellipsis',whiteSpace:'nowrap',lineHeight:1.3,
                          textDecoration:allDone?'line-through':'none'}}>
                          {grupo.base}
                          {grupo.items.length > 1 &&
                            <span style={{marginLeft:5,fontSize:10,color:'var(--gray)',fontWeight:400}}>
                              ({grupo.items.length})
                            </span>
                          }
                        </div>
                        {pMatch.length > 0 ? (
                          <div style={{marginTop:4,display:'flex',flexWrap:'wrap',gap:3}}>
                            {pMatch.slice(0,4).map(c=>(
                              <span key={c.id} style={{
                                fontSize:9,padding:'1px 6px',borderRadius:20,
                                background:'rgba(201,169,110,0.12)',
                                color:'var(--black)',border:'1px solid rgba(201,169,110,0.3)',
                                fontWeight:500,whiteSpace:'nowrap',
                                maxWidth:110,overflow:'hidden',textOverflow:'ellipsis'
                              }}>{c.nombre}</span>
                            ))}
                            {pMatch.length > 4 && (
                              <span style={{fontSize:9,color:'var(--gray)',padding:'1px 3px'}}>
                                +{pMatch.length-4}
                              </span>
                            )}
                          </div>
                        ) : null}
                      </div>
                    </div>
                  </div>
                );
              });
            })()}
          </div>

        </div>
      </div>

      {/* FORM MODAL */}
      {modal === 'form' && (
        <Modal title={selVenc?'✏️ Editar Vencimiento':'📅 Nuevo Vencimiento'}
          onClose={()=>{setModal(null);setSelVenc(null);}}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setModal(null);setSelVenc(null);}}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={handleSave}>Guardar</button>
          </>}>

          <div className="form-group">
            <label className="form-label">Descripción *</label>
            <input className="form-input" value={form.nombre||''}
              onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}
              placeholder="Ej: IVA Mensual - Abril" autoFocus />
          </div>

          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Tipo</label>
              <select className="form-select" value={form.tipo||'fiscal'}
                onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                <option value="fiscal">Fiscal / Impositivo</option>
                <option value="laboral">Laboral</option>
                <option value="societario">Societario</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Prioridad</label>
              <select className="form-select" value={form.prioridad||'media'}
                onChange={e=>setForm(f=>({...f,prioridad:e.target.value}))}>
                <option value="alta">🔴 Alta</option>
                <option value="media">🟡 Media</option>
                <option value="baja">🟢 Baja</option>
              </select>
            </div>
          </div>

          <div className="form-group">
            <label className="form-label">Cliente(s)</label>
            <select className="form-select" value={form.clientes||''}
              onChange={e=>setForm(f=>({...f,clientes:e.target.value}))}>
              <option value="">Todos / General</option>
              <option value="Todos los monotributistas">Todos los monotributistas</option>
              {clients.map(c=><option key={c.id} value={c.nombre}>{c.nombre}</option>)}
            </select>
          </div>

          {/* PERIODICIDAD */}
          <div className="form-group">
            <label className="form-label">Recurrencia / Periodicidad</label>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:12}}>
              {[
                {v:'puntual',    l:'📌 Fecha puntual',   d:'Un día específico'},
                {v:'mensual',    l:'📆 Mensual',          d:'Mismo día c/mes'},
                {v:'mensual-n',  l:'📆 Mensual (día rel)',d:'Ej: 4° jueves'},
                {v:'bimestral',  l:'📅 Bimestral',        d:'Cada 2 meses'},
                {v:'trimestral', l:'📅 Trimestral',       d:'Cada 3 meses'},
                {v:'anual',      l:'🗓️ Anual',            d:'Mismo día c/año'},
              ].map(opt=>(
                <div key={opt.v} onClick={()=>setForm(f=>({...f,periodicidad:opt.v,fecha:'',semana:'',diaSemana:''}))}
                  style={{padding:'8px 10px',borderRadius:'var(--r2)',cursor:'pointer',transition:'all 0.15s',textAlign:'center',
                    background:(form.periodicidad||'puntual')===opt.v?'rgba(201,169,110,0.18)':'var(--cream)',
                    border:(form.periodicidad||'puntual')===opt.v?'2px solid var(--gold)':'2px solid transparent'}}>
                  <div style={{fontSize:12,fontWeight:700,color:'var(--black)'}}>{opt.l}</div>
                  <div style={{fontSize:10,color:'var(--gray)',marginTop:2}}>{opt.d}</div>
                </div>
              ))}
            </div>
          </div>

          {/* PUNTUAL or ANUAL → date picker */}
          {(!form.periodicidad||form.periodicidad==='puntual'||form.periodicidad==='anual') && (
            <div className="form-group">
              <label className="form-label">{form.periodicidad==='anual'?'Fecha anual (día y mes)':'Fecha exacta *'}</label>
              <input className="form-input" type="date" value={form.fecha||''}
                onChange={e=>setForm(f=>({...f,fecha:e.target.value}))} />
              {form.periodicidad==='anual' && <div style={{fontSize:11,color:'var(--gray)',marginTop:3}}>Se repetirá cada año en esta fecha. Se generarán los próximos 5 años.</div>}
            </div>
          )}

          {/* MENSUAL por día del mes */}
          {(form.periodicidad==='mensual'||form.periodicidad==='bimestral'||form.periodicidad==='trimestral') && (
            <div className="form-group">
              <label className="form-label">Día del mes (1–31)</label>
              <input className="form-input" type="number" min="1" max="31" value={form.diaMes||''}
                onChange={e=>setForm(f=>({...f,diaMes:e.target.value}))}
                placeholder="Ej: 20 (para el día 20 de cada mes)" />
              <div style={{fontSize:11,color:'var(--gray)',marginTop:3}}>
                {form.periodicidad==='bimestral'?'Se generarán meses alternos.':form.periodicidad==='trimestral'?'Se generarán cada 3 meses.':'Se generará para el mes actual y los próximos 11 meses.'}
              </div>
            </div>
          )}

          {/* MENSUAL por día relativo: ej. 4° jueves */}
          {form.periodicidad==='mensual-n' && (
            <div className="form-grid-2">
              <div className="form-group">
                <label className="form-label">Semana del mes</label>
                <select className="form-select" value={form.semana||'1'} onChange={e=>setForm(f=>({...f,semana:e.target.value}))}>
                  <option value="1">1° semana</option>
                  <option value="2">2° semana</option>
                  <option value="3">3° semana</option>
                  <option value="4">4° semana</option>
                  <option value="-1">Última semana</option>
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Día de la semana</label>
                <select className="form-select" value={form.diaSemana||'4'} onChange={e=>setForm(f=>({...f,diaSemana:e.target.value}))}>
                  <option value="1">Lunes</option>
                  <option value="2">Martes</option>
                  <option value="3">Miércoles</option>
                  <option value="4">Jueves</option>
                  <option value="5">Viernes</option>
                  <option value="6">Sábado</option>
                  <option value="0">Domingo</option>
                </select>
              </div>
              <div style={{gridColumn:'1/-1',fontSize:11,color:'var(--gray)',marginTop:-6}}>
                Ej: 4° Jueves de cada mes = vencimiento el cuarto jueves. Se generarán los próximos 12 meses.
              </div>
            </div>
          )}

          <div className="form-group">
            <label className="form-label">Notas</label>
            <textarea className="form-textarea" value={form.notas||''}
              onChange={e=>setForm(f=>({...f,notas:e.target.value}))}
              placeholder="Detalles adicionales..." style={{minHeight:60}} />
          </div>
        </Modal>
      )}

      {/* ── MODAL DETALLE DE VENCIMIENTOS AGRUPADOS ── */}
      {vencDetail && (
        <Modal
          title={`📋 ${vencDetail.base} — ${fmtDate(vencDetail.fecha)}`}
          onClose={()=>setVencDetail(null)}
          footer={
            <button className="btn btn-ghost btn-sm" onClick={()=>setVencDetail(null)}>Cerrar</button>
          }>
          <div style={{marginBottom:14,padding:'10px 14px',background:'var(--cream2)',
            borderRadius:8,fontSize:12,color:'var(--gray)'}}>
            <strong>{vencDetail.items.length} registro{vencDetail.items.length!==1?'s':''}</strong> agrupados bajo este vencimiento.
            El checkbox del panel completa/descompleta todos a la vez.
          </div>

          {/* Tabla de registros individuales */}
          <div style={{border:'1px solid var(--cream2)',borderRadius:10,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'linear-gradient(135deg,var(--black),var(--black2))'}}>
                  {['Estado','Nombre completo','CUIT/Clientes','Fecha','Prioridad'].map(h=>(
                    <th key={h} style={{padding:'9px 12px',textAlign:'left',color:'var(--cream)',
                      fontWeight:600,fontSize:11,fontFamily:'JetBrains Mono,monospace'}}>
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {vencDetail.items
                  .sort((a,b)=>a.completado-b.completado || a.nombre.localeCompare(b.nombre))
                  .map((v,i)=>{
                    const { matched: cm } = getClientesDelVenc(v);
                    return (
                      <tr key={v.id} style={{
                        borderTop:'1px solid var(--cream2)',
                        background: v.completado ? 'var(--cream)' : i%2===0 ? 'white' : 'var(--cream3,#fdfcf9)',
                        opacity: v.completado ? 0.6 : 1,
                      }}>
                        <td style={{padding:'8px 12px'}}>
                          <div className={`task-check ${v.completado?'done':''}`}
                            onClick={()=>toggle(v.id)}
                            style={{cursor:'pointer'}} />
                        </td>
                        <td style={{padding:'8px 12px',fontWeight:v.completado?400:600,
                          textDecoration:v.completado?'line-through':'none',color:'var(--black)'}}>
                          {v.nombre}
                        </td>
                        <td style={{padding:'8px 12px'}}>
                          {cm.length > 0 ? (
                            <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                              {cm.map(c=>(
                                <span key={c.id} style={{
                                  fontSize:10,padding:'1px 6px',borderRadius:20,
                                  background:'rgba(201,169,110,0.12)',
                                  border:'1px solid rgba(201,169,110,0.3)',
                                  color:'var(--black)',fontWeight:500
                                }}>{c.nombre}</span>
                              ))}
                            </div>
                          ) : (
                            <span style={{color:'var(--gray)',fontSize:11,fontStyle:'italic'}}>
                              {v.clientes || '—'}
                            </span>
                          )}
                        </td>
                        <td style={{padding:'8px 12px',fontFamily:'JetBrains Mono,monospace',
                          fontSize:11,color:'var(--gray)',whiteSpace:'nowrap'}}>
                          {v.fecha}
                        </td>
                        <td style={{padding:'8px 12px'}}>
                          <span className={`badge ${v.prioridad==='alta'?'badge-red':v.prioridad==='baja'?'badge-green':'badge-gold'}`}
                            style={{fontSize:9}}>
                            {v.prioridad||'media'}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
              </tbody>
            </table>
          </div>

          {/* Clientes totales afectados */}
          {(() => {
            const allMatched = [...new Map(
              vencDetail.items.flatMap(v => getClientesDelVenc(v).matched)
                .map(c=>[c.id,c])
            ).values()];
            if (!allMatched.length) return null;
            return (
              <div style={{marginTop:16,padding:'12px 14px',background:'rgba(201,169,110,0.08)',
                border:'1px solid rgba(201,169,110,0.25)',borderRadius:10}}>
                <div style={{fontSize:11,fontWeight:700,color:'var(--gray)',textTransform:'uppercase',
                  letterSpacing:'0.8px',marginBottom:8}}>
                  {allMatched.length} cliente{allMatched.length!==1?'s':''} afectado{allMatched.length!==1?'s':''}
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                  {allMatched.map(c=>(
                    <span key={c.id} style={{fontSize:11,padding:'3px 10px',borderRadius:20,
                      background:'rgba(201,169,110,0.15)',border:'1px solid rgba(201,169,110,0.35)',
                      color:'var(--black)',fontWeight:500}}>
                      {c.nombre}
                    </span>
                  ))}
                </div>
              </div>
            );
          })()}
        </Modal>
      )}

      {/* ── DEBUG MODAL ── */}
      {debugDay && (
        <Modal title={'🔍 Debug matching — ' + debugDay} onClose={()=>setDebugDay(null)}
          footer={<button className="btn btn-ghost btn-sm" onClick={()=>setDebugDay(null)}>Cerrar</button>}>
          <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,lineHeight:1.8}}>
            {(byDate[debugDay]||[]).map((v,i) => {
              const tid = getTributoId(v.nombre);
              const cr  = getCuitRange(v.nombre);
              const todosConTributo = clients.filter(c =>
                c.estado!=='inactivo' &&
                Array.isArray(c.tributos) &&
                c.tributos.some(t => t.id === tid)
              );
              const matchFinal = todosConTributo.filter(c => {
                if (!cr) return true;
                const d = getCuitDigit(c.cuit);
                return !isNaN(d) && cr.includes(d);
              });
              return (
                <div key={v.id} style={{marginBottom:16,padding:12,background:'var(--cream)',borderRadius:8,border:'1px solid var(--cream2)'}}>
                  <div style={{fontWeight:700,marginBottom:6,color:'var(--black)'}}>{v.nombre}</div>
                  <div><span style={{color:'var(--gray)'}}>tributeId:</span> <b style={{color:tid?'var(--green)':'var(--red)'}}>{tid||'⚠️ NO DETECTADO'}</b></div>
                  <div><span style={{color:'var(--gray)'}}>CUIT range:</span> <b>{cr ? '['+cr.join(',')+']' : 'ninguno (todos los CUITs)'}</b></div>
                  <div style={{marginTop:6}}><span style={{color:'var(--gray)'}}>Clientes con tributeId en tributos[]:</span></div>
                  {todosConTributo.length === 0
                    ? <div style={{color:'var(--red)',paddingLeft:12}}>⚠️ Ningún cliente tiene este tributo cargado</div>
                    : todosConTributo.map(c => {
                        const d = getCuitDigit(c.cuit);
                        const pasaCuit = !cr || (!isNaN(d) && cr.includes(d));
                        return (
                          <div key={c.id} style={{paddingLeft:12,color:pasaCuit?'var(--green)':'var(--gray)'}}>
                            {pasaCuit ? '✓' : '✗'} {c.nombre}
                            {cr && <span style={{fontSize:10}}> (CUIT digit: {isNaN(d)?'sin CUIT':d})</span>}
                          </div>
                        );
                      })
                  }
                  <div style={{marginTop:6,fontWeight:600,color:'var(--black)'}}>
                    → Match final: {matchFinal.length > 0 ? matchFinal.map(c=>c.nombre).join(', ') : '(ninguno)'}
                  </div>
                </div>
              );
            })}
          </div>
        </Modal>
      )}

      {/* ── IMPORTAR VENCIMIENTOS MODAL ── */}
      {showImport && (
        <ImportarVencimientos
          vencimientos={vencimientos}
          setVencimientos={setVencimientos}
          clients={clients}
          onClose={()=>setShowImport(false)}
        />
      )}
    </div>
  );
}


// ── FINANZAS ──────────────────────────────────────────
function Finanzas({ cobros, setCobros, facturas, setFacturas }) {
  const [mesFilter, setMesFilter] = useState(todayStr.slice(0,7));
  const [editMov, setEditMov]     = useState(null);
  const [editForm, setEditForm]   = useState({});

  const allMovimientos = [
    ...cobros.map(c=>({...c, _tipo:'cobro', _color:'var(--green)'})),
    ...facturas.filter(f=>f.estado==='facturado').map(f=>({
      id:f.id, fecha:f.fecha, cliente:f.cliente||f.clienteNombre, monto:f.monto,
      naturaleza:f.concepto, medio:'—', _tipo:'factura', _color:'var(--blue)',
    })),
  ].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const filtered = mesFilter
    ? allMovimientos.filter(m=>m.fecha&&m.fecha.startsWith(mesFilter))
    : allMovimientos;

  const totalMes  = filtered.reduce((s,m)=>s+(Number(m.monto)||0),0);
  const soloMeses = [...new Set(allMovimientos.map(m=>m.fecha?.slice(0,7)).filter(Boolean))].sort().reverse();

  const handleDelete = async (mov) => {
    const result = await Swal.fire({ title:'¿Eliminar movimiento?', text:`Eliminar ${fmt(mov.monto)} — esta acción no se puede deshacer.`, icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    if (mov._tipo === 'cobro') {
      try { await FB().deleteDoc(FB().doc(FB().db,'cobros',mov.id)); } catch(e){}
      setCobros(prev=>prev.filter(c=>c.id!==mov.id));
    } else {
      try { await FB().updateDoc(FB().doc(FB().db,'facturas',mov.id),{estado:'pendiente'}); } catch(e){}
      setFacturas(prev=>prev.map(f=>f.id===mov.id?{...f,estado:'pendiente'}:f));
    }
  };

  const openEdit = (mov) => {
    setEditMov(mov);
    setEditForm({ monto: mov.monto, fecha: mov.fecha, naturaleza: mov.naturaleza||mov.concepto||'' });
  };

  const saveEdit = async () => {
    if (!editMov) return;
    const changes = { monto: Number(editForm.monto), fecha: editForm.fecha, naturaleza: editForm.naturaleza };
    if (editMov._tipo === 'cobro') {
      try { await FB().updateDoc(FB().doc(FB().db,'cobros',editMov.id),{...changes}); } catch(e){}
      setCobros(prev=>prev.map(c=>c.id===editMov.id?{...c,...changes}:c));
    } else {
      try { await FB().updateDoc(FB().doc(FB().db,'facturas',editMov.id),{monto:changes.monto,fecha:changes.fecha,concepto:changes.naturaleza}); } catch(e){}
      setFacturas(prev=>prev.map(f=>f.id===editMov.id?{...f,monto:changes.monto,fecha:changes.fecha,concepto:changes.naturaleza}:f));
    }
    setEditMov(null);
  };

  const exportXLS = () => exportToExcel(
    filtered.map(m=>({
      'Fecha': m.fecha, 'Cliente': m.cliente||m.clienteNombre, 'Concepto': m.naturaleza,
      'Medio': m.medio&&m.medio!=='—'?m.medio+(m.submedio?' · '+m.submedio:''):'—',
      'Tipo': m._tipo==='cobro'?'Cobro':'Factura', 'Monto': m.monto,
    })),
    `Finanzas_${mesFilter||'historico'}`
  );

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Finanzas</div>
          <div className="page-subtitle">Libro de ingresos · todos los movimientos</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={exportXLS}>📥 Exportar Excel</button>
      </div>

      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:24}}>
        <div className="stat-card"><div className="stat-icon">💰</div>
          <div className="stat-label">Ingresos {mesFilter||'histórico'}</div>
          <div className="stat-value gold">{fmtShort(totalMes)}</div>
        </div>
        <div className="stat-card"><div className="stat-icon">🧾</div>
          <div className="stat-label">Movimientos</div>
          <div className="stat-value">{filtered.length}</div>
        </div>
        <div className="stat-card"><div className="stat-icon">📊</div>
          <div className="stat-label">Promedio por cobro</div>
          <div className="stat-value">{filtered.length>0?fmtShort(totalMes/filtered.length):'—'}</div>
        </div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:12,color:'var(--gray)',fontWeight:600}}>Período:</span>
        <button className={`btn btn-sm ${!mesFilter?'btn-primary':'btn-ghost'}`} onClick={()=>setMesFilter('')}>Todos</button>
        {soloMeses.slice(0,8).map(m=>(
          <button key={m} className={`btn btn-sm ${mesFilter===m?'btn-primary':'btn-ghost'}`} onClick={()=>setMesFilter(m)}>
            {MONTHS_FULL[parseInt(m.slice(5,7))-1]} {m.slice(0,4)}
          </button>
        ))}
      </div>

      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Fecha</th><th>Cliente</th><th>Concepto</th>
              <th>Medio</th><th>Tipo</th><th style={{textAlign:'right'}}>Monto</th><th></th>
            </tr></thead>
            <tbody>
              {filtered.length===0
                ? <tr><td colSpan={7}><div className="empty-state"><div className="empty-icon">📊</div><p>Sin movimientos en este período</p></div></td></tr>
                : filtered.map(m=>(
                  <tr key={m.id+m._tipo}>
                    <td style={{fontFamily:'JetBrains Mono,monospace',fontSize:12,whiteSpace:'nowrap'}}>{fmtDate(m.fecha)}</td>
                    <td style={{fontWeight:600,fontSize:13}}>{m.cliente||m.clienteNombre}</td>
                    <td style={{fontSize:13,color:'var(--gray)'}}>{m.naturaleza}</td>
                    <td style={{fontSize:12}}>{m.medio&&m.medio!=='—'?m.medio+(m.submedio?' · '+m.submedio:''):'—'}</td>
                    <td><span className={`badge ${m._tipo==='cobro'?'badge-green':'badge-blue'}`} style={{fontSize:9}}>{m._tipo==='cobro'?'💰 Cobro':'🧾 Factura'}</span></td>
                    <td style={{textAlign:'right',fontFamily:'JetBrains Mono,monospace',fontWeight:700,color:m._color}}>{fmt(m.monto)}</td>
                    <td><div className="action-btns">
                      <button className="btn-icon edit" title="Editar" onClick={()=>openEdit(m)}>✏️</button>
                      <button className="btn-icon trash" title="Eliminar / revertir" onClick={()=>handleDelete(m)}>🗑️</button>
                    </div></td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </div>

      {editMov && (
        <Modal title="✏️ Editar Movimiento" onClose={()=>setEditMov(null)}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEditMov(null)}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={saveEdit}>Guardar Cambios</button>
          </>}>
          <div style={{padding:'8px 12px',background:'var(--cream2)',borderRadius:'var(--r2)',fontSize:12,color:'var(--gray)',marginBottom:12}}>
            {editMov._tipo==='cobro'?'💰 Cobro registrado':'🧾 Factura'} · {editMov.cliente||editMov.clienteNombre}
          </div>
          <div className="form-group">
            <label className="form-label">Concepto</label>
            <input className="form-input" value={editForm.naturaleza||''} onChange={e=>setEditForm(f=>({...f,naturaleza:e.target.value}))} />
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Monto (ARS)</label>
              <input className="form-input" type="number" value={editForm.monto||''} onChange={e=>setEditForm(f=>({...f,monto:e.target.value}))} />
            </div>
            <div className="form-group">
              <label className="form-label">Fecha</label>
              <input className="form-input" type="date" value={editForm.fecha||''} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} />
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── FACTURACIÓN ──────────────────────────────────────
function Facturacion({ clients, facturas, setFacturas, cobros, setCobros }) {
  const [modal, setModal]   = useState(null);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm]     = useState({});
  const [filterMes, setFilterMes] = useState('');
  const now = new Date();
  const mesActual = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const listaFiltrada = filterMes ? facturas.filter(f=>(f.fecha||'').startsWith(filterMes)) : facturas;

  // Totals computed inline in JSX

  const handleSave = async () => {
    if (!form.cliente || !form.monto) return;
    const payload = {...form, monto: Number(form.monto), clienteId: clients.find(c=>c.nombre===form.cliente)?.id||''};
    if (editItem) {
      try { await FB().updateDoc(FB().doc(FB().db,'facturas',editItem.id), payload); } catch(e){}
      setFacturas(prev=>prev.map(x=>x.id===editItem.id?{...payload,id:editItem.id}:x));
    } else {
      try {
        const ref = await FB().addDoc(FB().collection(FB().db,'facturas'), {...payload, createdAt:FB().serverTimestamp()});
        setFacturas(prev => [...prev, {...payload, id: ref.id}]);
      } catch(e) {
        setFacturas(prev => [...prev, {...payload, id: 'local-'+Date.now()}]);
      }
    }
    setModal(null); setEditItem(null);
  };

  const ESTADO_CYCLE = { 'na':'pendiente', 'pendiente':'facturado', 'facturado':'na' };
  const ESTADO_LABEL = { 'na':'— N/A', 'pendiente':'⏳ Pendiente', 'facturado':'🧾 Facturado' };
  const ESTADO_BADGE = { 'na':'badge-gray', 'pendiente':'badge-amber', 'facturado':'badge-green' };

  const toggleEstado = async (id) => {
    const f = facturas.find(x=>x.id===id);
    const cur = f?.estado||'na';
    const newEstado = ESTADO_CYCLE[cur]||'pendiente';
    try { await FB().updateDoc(FB().doc(FB().db,'facturas',id),{estado:newEstado}); } catch(e){}
    setFacturas(prev => prev.map(f => f.id === id ? {...f, estado: newEstado} : f));
  };

  const openEditFac = (f) => {
    setEditItem(f);
    setForm({ cliente:f.cliente||'', concepto:f.concepto||'', monto:f.monto||'', fecha:f.fecha||todayStr, estado:f.estado||'pendiente' });
    setModal('new');
  };

  const handleDeleteFac = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar esta factura/cargo', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db,'facturas',id)); } catch(e){}
    setFacturas(prev=>prev.filter(x=>x.id!==id));
  };

  const meses = [...new Set(facturas.map(f=>(f.fecha||'').slice(0,7)))].filter(Boolean).sort().reverse();

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Facturación</div>
          <div className="page-subtitle">Honorarios generados · {filterMes||'Todos los meses'}</div>
        </div>
        <button className="btn btn-gold" onClick={() => { setEditItem(null); setForm({ estado: 'na', fecha: todayStr }); setModal('new'); }}>+ Nuevo Cargo</button>
      </div>

      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)', marginBottom:24}}>
        <div className="stat-card">
          <div className="stat-icon">🧾</div>
          <div className="stat-label">Facturados</div>
          <div className="stat-value gold">{fmtShort(listaFiltrada.filter(f=>f.estado==='facturado').reduce((s,f)=>s+Number(f.monto||0),0))}</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon">⏳</div>
          <div className="stat-label">Pendiente de factura</div>
          <div className="stat-value" style={{color:'var(--amber)'}}>{fmtShort(listaFiltrada.filter(f=>f.estado==='pendiente').reduce((s,f)=>s+Number(f.monto||0),0))}</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon">📋</div>
          <div className="stat-label">Total cargos</div>
          <div className="stat-value">{listaFiltrada.length}</div>
        </div>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:16,alignItems:'center',flexWrap:'wrap'}}>
        <span style={{fontSize:12,color:'var(--gray)',fontWeight:600}}>Mes:</span>
        <button className={`btn btn-sm ${!filterMes?'btn-primary':'btn-ghost'}`} onClick={()=>setFilterMes('')}>Todos</button>
        {meses.slice(0,6).map(m=>(
          <button key={m} className={`btn btn-sm ${filterMes===m?'btn-primary':'btn-ghost'}`} onClick={()=>setFilterMes(m)}>{m}</button>
        ))}
      </div>

      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th style={{paddingLeft:16}}>Concepto</th><th>Cliente</th><th>Monto</th><th>Fecha</th><th>Estado <span style={{fontSize:10,opacity:0.6}}>(clic para cambiar)</span></th><th>Acciones</th>
            </tr></thead>
            <tbody>
              {[...listaFiltrada].sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).map(f => (
                <tr key={f.id}>
                  <td style={{paddingLeft:16,fontWeight:500}}>{f.concepto}</td>
                  <td style={{fontSize:13}}>{f.cliente}</td>
                  <td style={{fontFamily:'JetBrains Mono,monospace',fontWeight:700}}>{fmt(f.monto)}</td>
                  <td style={{fontFamily:'JetBrains Mono,monospace',fontSize:13}}>{fmtDate(f.fecha)}</td>
                  <td>
                    <span className={`badge ${ESTADO_BADGE[f.estado||'na']}`} style={{cursor:'pointer'}} title="Clic para cambiar estado" onClick={()=>toggleEstado(f.id)}>
                      {ESTADO_LABEL[f.estado||'na']}
                    </span>
                  </td>
                  <td><div className="action-btns">
                    <button className="btn-icon edit" title="Editar" onClick={()=>openEditFac(f)}>✏️</button>
                    <button className="btn-icon trash" title="Eliminar" onClick={()=>handleDeleteFac(f.id)}>🗑️</button>
                  </div></td>
                </tr>
              ))}
              {listaFiltrada.length===0 && <tr><td colSpan={6} style={{textAlign:'center',padding:32,color:'var(--gray2)'}}>Sin comprobantes</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {modal === 'new' && (
        <Modal title={editItem ? "✏️ Editar Cargo" : "Nueva Factura / Cargo"} onClose={() => setModal(null)}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={() => {setModal(null);setEditItem(null);}}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={handleSave}>{editItem?'Guardar Cambios':'Guardar'}</button>
          </>}>
          <div className="form-group">
            <label className="form-label">Cliente</label>
            <select className="form-select" value={form.cliente||''} onChange={e => setForm(f => ({...f, cliente: e.target.value}))}>
              <option value="">Seleccionar cliente...</option>

// ── TAREAS ───────────────────────────────────────────
function Tareas({ tareas, setTareas, clients }) {
  const [newText, setNewText] = useState('');
  const [newCliente, setNewCliente] = useState('');
  const [filter, setFilter] = useState('pendientes');
  const [editTask, setEditTask] = useState(null);
  const [editTarea, setEditTarea] = useState(null);
  const [editForm, setEditForm] = useState({});

  const shown = tareas.filter(t =>
    filter === 'pendientes' ? !t.completado :
    filter === 'completadas' ? t.completado : true
  );

  const addTask = async () => {
    if (!newText.trim()) return;
    if (editTask) {
      // Update mode
      const updated = {...editTask, texto:newText, cliente:newCliente};
      try { await FB().updateDoc(FB().doc(FB().db,'tareas',editTask.id),{texto:newText,cliente:newCliente}); } catch(e){}
      setTareas(prev=>prev.map(t=>t.id===editTask.id?updated:t));
      setEditTask(null); setNewText(''); setNewCliente(''); return;
    }
    const task = { texto: newText, cliente: newCliente, completado: false, fecha: todayStr };
    try {
      const ref = await FB().addDoc(FB().collection(FB().db, 'tareas'), {...task, createdAt: FB().serverTimestamp()});
      setTareas(prev => [{ ...task, id: ref.id }, ...prev]);
    } catch(e) {
      setTareas(prev => [{ ...task, id: 'local-'+Date.now() }, ...prev]);
    }
    setNewText(''); setNewCliente('');
  };

  const toggle = async (id) => {
    const t = tareas.find(x => x.id === id);
    try { await FB().updateDoc(FB().doc(FB().db, 'tareas', id), { completado: !t.completado }); } catch(e) {}
    setTareas(prev => prev.map(x => x.id === id ? {...x, completado: !x.completado} : x));
  };

  const del = async (id) => {
    const result = await Swal.fire({ title:'¿Confirmar eliminación?', text:'Eliminar esta tarea', icon:'warning', showCancelButton:true, confirmButtonText:'Sí, eliminar', cancelButtonText:'Cancelar', customClass:{popup:'swal-ap',confirmButton:'swal2-confirm',cancelButton:'swal2-cancel'}, reverseButtons:true });
    if (!result.isConfirmed) return;
    try { await FB().deleteDoc(FB().doc(FB().db, 'tareas', id)); } catch(e) {}
    setTareas(prev => prev.filter(x => x.id !== id));
  };

  const saveEdit = async () => {
    if (!editForm.texto?.trim()) return;
    try { await FB().updateDoc(FB().doc(FB().db,'tareas',editTarea.id),{texto:editForm.texto,cliente:editForm.cliente||''}); } catch(e){}
    setTareas(prev=>prev.map(x=>x.id===editTarea.id?{...x,texto:editForm.texto,cliente:editForm.cliente||''}:x));
    setEditTarea(null);
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">Tareas</div>
          <div className="page-subtitle">{tareas.filter(t => !t.completado).length} tareas pendientes</div>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={()=>exportToExcel(
          shown.map(t=>({'Tarea':t.texto,'Cliente':t.cliente||'','Estado':t.completado?'Completada':'Pendiente','Fecha':t.fecha})),
          'Tareas'
        )}>📥 Excel</button>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div className="quick-add-bar">
          <input value={newText} onChange={e => setNewText(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addTask()}
            placeholder={editTask ? "Editando tarea... (Enter para guardar)" : "Nueva tarea... (Enter para agregar)"}
            style={{background: editTask ? 'rgba(201,169,110,0.08)' : undefined}} />
          <select className="form-select" style={{width:'auto', minWidth:180}} value={newCliente} onChange={e => setNewCliente(e.target.value)}>
            <option value="">Sin cliente</option>
            {clients.map(c => <option key={c.id} value={c.nombre}>{c.nombre}</option>)}
          </select>
          {editTask && <button className="btn btn-ghost btn-sm" onClick={()=>{setEditTask(null);setNewText('');setNewCliente('');}}>✕</button>}
          <button className="btn btn-gold btn-sm" onClick={addTask}>{editTask?'✓ Guardar':'+ Agregar'}</button>
        </div>
      </div>

      <div style={{display:'flex', gap:8, marginBottom:16}}>
        {['pendientes','completadas','todas'].map(f => (
          <button key={f} className={`btn btn-sm ${filter === f ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setFilter(f)}>
            {f === 'pendientes' ? `⏳ Pendientes (${tareas.filter(t => !t.completado).length})` :
             f === 'completadas' ? `✅ Completadas (${tareas.filter(t => t.completado).length})` : '📋 Todas'}
          </button>
        ))}
      </div>

      <div className="card">
        {shown.length === 0
          ? <div className="empty-state"><div className="empty-icon">✅</div><p>Sin tareas en este filtro</p></div>
          : shown.map(t => (
            <div key={t.id} className="task-item" style={{padding:'14px 0'}}>
              <div className={`task-check ${t.completado ? 'done' : ''}`} onClick={() => toggle(t.id)} />
              <div style={{flex:1}}>
                <div className={`task-text ${t.completado ? 'done' : ''}`} style={{fontSize:15}}>{t.texto}</div>
                <div style={{display:'flex', gap:8, marginTop:4, alignItems:'center'}}>
                  {t.cliente && <span className="badge badge-gray">{t.cliente}</span>}
                  <span className="nota-date">{fmtDate(t.fecha)}</span>
                </div>
              </div>
              <div className="action-btns">
                <button className="btn-icon edit" title="Editar" onClick={()=>{setEditTarea(t);setEditForm({texto:t.texto,cliente:t.cliente||''});}}>✏️</button>
                <button className="btn-icon trash" title="Eliminar" onClick={() => del(t.id)}>🗑️</button>
              </div>
            </div>
          ))
        }
      </div>

      {editTarea && (
        <Modal title="✏️ Editar Tarea" onClose={()=>setEditTarea(null)}
          footer={<>
            <button className="btn btn-ghost btn-sm" onClick={()=>setEditTarea(null)}>Cancelar</button>
            <button className="btn btn-gold btn-sm" onClick={saveEdit}>Guardar</button>
          </>}>
          <div className="form-group">
            <label className="form-label">Tarea</label>
            <input className="form-input" value={editForm.texto||''} onChange={e=>setEditForm(f=>({...f,texto:e.target.value}))} autoFocus />
          </div>
          <div className="form-group">
            <label className="form-label">Cliente</label>
            <select className="form-select" value={editForm.cliente||''} onChange={e=>setEditForm(f=>({...f,cliente:e.target.value}))}>
              <option value="">Sin cliente</option>
              {clients.map(c=><option key={c.id} value={c.nombre}>{c.nombre}</option>)}
            </select>
          </div>
        </Modal>
      )}
    </div>
  );
}
